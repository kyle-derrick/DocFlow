# DocFlow 生产部署编排（设计文档 §12 部署架构）。
#
# 端口边界：caddy 是唯一映射宿主端口的服务（80/443）；backend / postgres /
# redis / onlyoffice / clamav 均仅 compose 内网可达，不做任何宿主映射。
# 前端不运行 dev server：静态产物在构建期打进 caddy 镜像 /srv/frontend
#（frontend/Dockerfile 多阶段 node:22-alpine 构建 → caddy:2.8.4-alpine）。
#
# Profiles（服务矩阵）：
#   minimal    caddy + backend + postgres                  —— make up-minimal
#   full       minimal + redis + onlyoffice             —— make up-full
#   antivirus  minimal + clamav（可与 full 叠加）        —— docker compose
#              --profile full --profile antivirus up -d
#   search     minimal + meilisearch（可与 full 叠加）     —— 全文搜索引擎可选项
#   storage    minimal + minio（可与 full 叠加）           —— S3 对象存储可选项，
#              需 .env 联动 STORAGE_DRIVER=s3（否则 local 驱动不使用该服务）
# 三个核心 profile（minimal/full/antivirus）均含核心三件套（caddy/backend/
# postgres），可单独或叠加启动；search profile 需 .env 联动 SEARCH_DRIVER=meili
#（否则 backend 仍用 pg 引擎，meilisearch 服务不被使用）。
# draw.io 图表编辑器不占服务：官方 webapp 静态层在构建期并入 caddy 镜像
#（frontend/Dockerfile，经 /drawio/* 路径服务）。
#
# 本地开发不经本文件的 caddy：后端 `make run` 直接监听宿主 :8080，前端
# `cd frontend && npm run dev`（vite 将 /api 代理到 localhost:8080）。
# 本机无 postgres 时可临时起一个：
#   docker run -d --name docflow-pg -p 5432:5432 \
#     -e POSTGRES_DB=docflow -e POSTGRES_USER=docflow \
#     -e POSTGRES_PASSWORD=change-me postgres:16-alpine
services:
  # 统一入口：TLS 终止 + 前端静态产物 + API/内容/ONLYOFFICE 反代。
  # 构建上下文为 ./frontend（多阶段构建，产物并入本镜像），配置挂载
  # deploy/Caddyfile；证书与站点地址见 .env 的 APP_DOMAIN。
  caddy:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
    image: docflow/caddy:${DOCFLOW_IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 站点域名（Caddyfile 站点地址 {$APP_DOMAIN}）：未设置时兜底 :80
      #（本地验证，无 TLS）；生产在 .env 设为对外域名，自动签发 HTTPS。
      APP_DOMAIN: ${APP_DOMAIN:-:80}
      # ONLYOFFICE 反代上游：minimal 下无 onlyoffice 服务，写死 onlyoffice:80
      # 会让 Caddy 启动时 DNS 解析失败退出，故默认 discard 端口
      #（/onlyoffice/* 502 属预期）；make up-full 注入 onlyoffice:80。
      ONLYOFFICE_UPSTREAM: ${ONLYOFFICE_UPSTREAM:-127.0.0.1:9}
      # 独立内容 origin；默认 content.localhost 仅用于本地验证。
      CONTENT_DOMAIN: ${CONTENT_DOMAIN:-content.localhost}
      CONTENT_UPSTREAM: ${CONTENT_UPSTREAM:-backend:8080}
      # admin API（HTTPS 运行时切换的下发通道）：监听容器内全部接口，
      # 仅 expose 给 compose 内网（无宿主端口映射，外部不可达）。
      CADDY_ADMIN: ${CADDY_ADMIN:-:2019}
      # 自定义证书（管理页 custom 模式）：与 backend 共享 tls_certs 卷
      #（本容器只读）；backend 上传的 cert.pem/key.pem 落在 /data/tls，
      # 热下发的 tls 指令经下面两个 env 指向该路径（含默认值）。
      CADDY_TLS_CERT: ${CADDY_TLS_CERT:-/data/tls/cert.pem}
      CADDY_TLS_KEY: ${CADDY_TLS_KEY:-/data/tls/key.pem}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - tls_certs:/data/tls:ro
    expose:
      - "2019"
    depends_on:
      backend:
        condition: service_healthy
    profiles: ["minimal", "full", "antivirus"]

  # Go API：仅内网暴露 8080（无宿主端口映射，外部一律经 caddy）。
  backend:
    build:
      context: .
      args:
        # 国内网络构建加速（.env 里 GOPROXY=https://goproxy.cn）。
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: docflow/backend:${DOCFLOW_IMAGE_TAG:-1.0.0}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://docflow:change-me@postgres:5432/docflow?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: 8080
      # 生产 HTTPS 默认 true；本地 HTTP 访问需在 .env 显式设 false。
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL: ${REFRESH_TOKEN_TTL:-168h}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_ROOT: /data/storage
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_PATH_STYLE: ${S3_PATH_STYLE:-true}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-2147483648}
      # 单次上传 PATCH 请求体上限（默认 64MiB）。
      PATCH_MAX_BYTES: ${PATCH_MAX_BYTES:-67108864}
      UPLOAD_SESSION_TTL: ${UPLOAD_SESSION_TTL:-24h}
      # 可信代理 CIDR/IP（逗号分隔）：caddy 反代场景需设为 compose 网段
      #（如 172.16.0.0/12）才会采信 X-Forwarded-For；默认空不信任任何代理。
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      # 病毒扫描联动 antivirus profile：启用 clamav 后设 .env
      # SCAN_ENABLED=true、CLAMAV_ADDR=clamav:3310（容器内 localhost 不可达；
      # CLAMAV_REQUIRED=true 时 clamd 不可达会 fail closed 拒绝上传）。
      SCAN_ENABLED: ${SCAN_ENABLED:-false}
      CLAMAV_ADDR: ${CLAMAV_ADDR:-clamav:3310}
      CLAMAV_TIMEOUT: ${CLAMAV_TIMEOUT:-5m}
      CLAMAV_REQUIRED: ${CLAMAV_REQUIRED:-true}
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-120}
      # 对外基地址（邮件/分享/OIDC 回调链接前缀）：生产设 https://<域名>。
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # HTTPS 运行时切换（管理页面 /api/v1/admin/tls）：Caddy admin API 地址；
      # 默认指向 compose 内网 caddy（开箱可用）；显式置空可关闭该功能。
      CADDY_ADMIN_ADDR: ${CADDY_ADMIN_ADDR:-caddy:2019}
      # 自定义证书目录（custom 模式）：管理页上传的 cert.pem/key.pem 落盘
      # 于此（0600），与 caddy 共享 tls_certs 卷（backend 可写 / caddy 只读）。
      TLS_CERT_DIR: /data/tls
      LOGIN_RATE_LIMIT_PER_MIN: ${LOGIN_RATE_LIMIT_PER_MIN:-10}
      PUBLIC_RATE_LIMIT_PER_MIN: ${PUBLIC_RATE_LIMIT_PER_MIN:-60}
      MAX_VERSIONS_PER_FILE: ${MAX_VERSIONS_PER_FILE:-5}
      # 后台清理任务（janitor）。
      JANITOR_ENABLED: ${JANITOR_ENABLED:-true}
      JANITOR_INTERVAL: ${JANITOR_INTERVAL:-10m}
      # 后台任务队列：inprocess（默认）| redis（需 --profile full 且
      # REDIS_ADDR 指向 redis 服务；QUEUE_DRIVER=redis 时启动 ping 失败即退出）。
      # 多实例横向扩展（backend 副本 >1）必须 QUEUE_DRIVER=redis：除任务
      # 队列外，WebSocket 站内通知的跨实例广播也复用同一 Redis
      #（docflow:notify Pub/Sub 扇出到全部实例的本地连接）；inprocess 下
      # 通知仅达本实例连接（跨实例用户收不到实时推送）。
      QUEUE_DRIVER: ${QUEUE_DRIVER:-inprocess}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-5}
      # ONLYOFFICE 集成（默认关闭）：启用需在 .env 设置 ONLYOFFICE_ENABLED=true、
      # ONLYOFFICE_JWT_SECRET（≥32 字节，与下方 onlyoffice 服务的 JWT_SECRET 一致）。
      ONLYOFFICE_ENABLED: ${ONLYOFFICE_ENABLED:-false}
      ONLYOFFICE_SERVER_URL: ${ONLYOFFICE_SERVER_URL:-http://onlyoffice:80}
      # 浏览器可达的 DocumentServer 地址（/onlyoffice/config 返回给前端加载
      # api.js）：留空回退 ONLYOFFICE_SERVER_URL（内网名，浏览器不可达）。
      # full profile 经 caddy /onlyoffice/* 反代，.env 示例值
      # https://<APP_DOMAIN>/onlyoffice（APP_DOMAIN 即对外域名）；
      # 本值不影响回调 SSRF 校验（始终以 SERVER_URL 为基准）。
      ONLYOFFICE_PUBLIC_URL: ${ONLYOFFICE_PUBLIC_URL:-}
      ONLYOFFICE_JWT_SECRET: ${ONLYOFFICE_JWT_SECRET:-}
      ONLYOFFICE_DOWNLOAD_URL_BASE: ${ONLYOFFICE_DOWNLOAD_URL_BASE:-http://backend:8080}
      ONLYOFFICE_RATE_LIMIT_PER_MIN: ${ONLYOFFICE_RATE_LIMIT_PER_MIN:-60}
      # draw.io 图表编辑集成（默认关闭）：编辑器为浏览器侧 iframe embed
      #（postMessage JSON 协议），后端不与 drawio 服务通信，仅
      # /api/v1/drawio/config 探测端点返回地址；启用需 .env 设
      # DRAWIO_ENABLED=true，并配置 DRAWIO_PUBLIC_URL（full profile 经 caddy
      # /drawio/* 反代时为 https://<对外域名>/drawio；SERVER_URL 为内网
      # 回退地址，见 .env.example 联动说明）。保存走「上传 file_id 覆盖
      # 新版本」通用链路，无新增后端端点。
      DRAWIO_ENABLED: ${DRAWIO_ENABLED:-false}
      DRAWIO_SERVER_URL: ${DRAWIO_SERVER_URL:-http://drawio:8080}
      DRAWIO_PUBLIC_URL: ${DRAWIO_PUBLIC_URL:-}
      # OIDC 单点登录（默认 false）：启用需 .env 设 OIDC_ENABLED=true、
      # OIDC_ISSUER（IdP 签发方基地址，如 https://sso.example.com/realms/x）
      # 与 OIDC_CLIENT_ID/SECRET；回调默认 {PUBLIC_BASE_URL}/api/v1/auth/oidc/callback。
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-true}
      # 邮件通道（默认 false = noop 仅日志输出链接）：启用需 .env 设
      # SMTP_ENABLED=true、SMTP_HOST/SMTP_FROM 必填（认证与端口按需）。
      SMTP_ENABLED: ${SMTP_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Prometheus 指标端点（默认启用，无认证）。/metrics 不经 Caddy 暴露
      #（Caddyfile 无该反代规则，未匹配路径返回 SPA 首页）；内网监控在
      # compose 网络内直连 backend:8080/metrics，无内网抓取可设 false 关闭。
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      # 网页包（zip）安全预览开关与解包限制（与后端 config 默认一致）。
      WEBPKG_ENABLED: ${WEBPKG_ENABLED:-true}
      WEBPKG_MAX_ENTRIES: ${WEBPKG_MAX_ENTRIES:-500}
      WEBPKG_MAX_FILE_SIZE: ${WEBPKG_MAX_FILE_SIZE:-33554432}
      WEBPKG_MAX_TOTAL_SIZE: ${WEBPKG_MAX_TOTAL_SIZE:-268435456}
      WEBPKG_MAX_DEPTH: ${WEBPKG_MAX_DEPTH:-10}
      WEBPKG_RATE_LIMIT_PER_MIN: ${WEBPKG_RATE_LIMIT_PER_MIN:-120}
      # 全文检索引擎（SEARCH_DRIVER=pg|meili，默认 pg）：meili 时启动
      # EnsureIndex 校验连通性（失败即退出），需 --profile search 启动
      # meilisearch 服务（MEILI_URL 默认指向 compose 服务名）。
      SEARCH_DRIVER: ${SEARCH_DRIVER:-pg}
      MEILI_URL: ${MEILI_URL:-http://meilisearch:7700}
      MEILI_API_KEY: ${MEILI_API_KEY:-}
      # AI 文件摘要（默认关闭）：启用需 .env 设 AI_ENABLED=true 与 AI_API_KEY
      #（BASE_URL/MODEL 可指向任意 OpenAI 兼容网关与模型）。
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      AI_RAG_MODE: ${AI_RAG_MODE:-keyword}
      AI_RAG_VECTOR_ENABLED: ${AI_RAG_VECTOR_ENABLED:-false}
      AI_RAG_QDRANT_URL: ${AI_RAG_QDRANT_URL:-http://qdrant:6333}
      AI_RAG_COLLECTION_PREFIX: ${AI_RAG_COLLECTION_PREFIX:-docflow_}
      AI_RAG_EMBEDDING_PROVIDER: ${AI_RAG_EMBEDDING_PROVIDER:-mock}
      AI_RAG_EMBEDDING_MODEL: ${AI_RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      AI_RAG_TOP_K: ${AI_RAG_TOP_K:-8}
      AI_RAG_CHUNK_SIZE: ${AI_RAG_CHUNK_SIZE:-1000}
      AI_RAG_CHUNK_OVERLAP: ${AI_RAG_CHUNK_OVERLAP:-100}
      # Agent 容器平台 AI IPC socket 目录（agentsock.go；backend 在此监听
      # ai.sock，agent 容器经下方 docflow-agent-ipc 卷只读共享 /run/docflow-ai
      # ——NetworkMode=none 断网容器仍可调平台 AI）。agent.allow_ai=false
      # 时平台不签发令牌，容器内无 AI 能力（runner 降级），socket 保持监听。
      DOCFLOW_AGENT_IPC_DIR: /run/docflow-ipc
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - backend_storage:/data/storage
      - tls_certs:/data/tls
      # Agent AI IPC socket 共享卷（可写；agent 容器由 backend 经 Docker
      # Engine API 创建并以 :ro 挂载到 /run/docflow-ai）。
      - docflow-agent-ipc:/run/docflow-ipc
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    profiles: ["minimal", "full", "antivirus"]

  migrate:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-}
    image: docflow/backend:${DOCFLOW_IMAGE_TAG:-1.0.0}
    restart: "no"
    # 镜像 ENTRYPOINT 为 /docflow，须用 entrypoint 覆盖（command 只覆盖 CMD）。
    entrypoint: ["/migrate"]
    command: ["-dir", "/migrations"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://docflow:change-me@postgres:5432/docflow?sslmode=disable}
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["minimal", "full", "antivirus"]

  # 首次部署引导管理员（幂等：已存在则跳过）。在 migrate 之后运行一次；
  # 生产务必在 .env 覆盖 SEED_ADMIN_EMAIL/PASSWORD 并在首次登录后改密。
  seed:
    build:
      context: .
      args:
        GOPROXY: ${GOPROXY:-}
    image: docflow/backend:${DOCFLOW_IMAGE_TAG:-1.0.0}
    restart: "no"
    entrypoint: ["/seed"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://docflow:change-me@postgres:5432/docflow?sslmode=disable}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_USERNAME: ${SEED_ADMIN_USERNAME:-admin}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env}
      SEED_ADMIN_ROLE: ${SEED_ADMIN_ROLE:-admin}
    depends_on:
      migrate:
        condition: service_completed_successfully
    profiles: ["minimal", "full", "antivirus"]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docflow}
      POSTGRES_USER: ${POSTGRES_USER:-docflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    # 保留 initdb 挂载仅为全新空卷兼容兜底；增量迁移由 migrate 服务每次启动执行，
    # 因此已有数据库升级不依赖 postgres entrypoint。
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
    profiles: ["minimal", "full", "antivirus"]

  # Redis（full profile）：后台任务队列的后端存储——QUEUE_DRIVER=redis 时
  # backend 经 asynq（hibiken/asynq）把上传补完/网页包解包任务写入 Redis，
  # 多实例部署下任意实例的 worker 均可消费（无本地状态，横向扩展安全）；
  # 同一 Redis 还承载 WebSocket 站内通知的跨实例广播（docflow:notify
  # Pub/Sub 频道，QUEUE_DRIVER=redis 时启用），多实例 backend 共享。
  # 默认 QUEUE_DRIVER=inprocess 时本服务不被使用。进程内限流仍为内存实现，
  # 多实例下各实例独立计数。归入 full profile：minimal 栈保持零 Redis 依赖，
  # backend 亦不声明 depends_on（避免把 redis 拖入 minimal）；未挂宿主端口。
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["full"]

  # 病毒扫描（antivirus profile）：docker compose --profile antivirus up -d
  # 启用，可与 full 叠加（--profile full --profile antivirus）。
  # 启用后 .env 联动：SCAN_ENABLED=true、CLAMAV_ADDR=clamav:3310。
  # 注意：不加 depends_on，保持按需启用；clamd 首次启动需下载病毒库，耗时
  # 数分钟（CLAMAV_REQUIRED=true 期间上传会 fail closed 拒绝）。
  clamav:
    image: clamav/clamav:1.4.1
    profiles: ["antivirus"]
    expose:
      - "3310"
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10m

  # ONLYOFFICE Document Server（full profile）：make up-full 或
  # docker compose --profile full up -d 启用。
  # 对应 .env：ONLYOFFICE_ENABLED=true、ONLYOFFICE_SERVER_URL=http://onlyoffice:80、
  # ONLYOFFICE_JWT_SECRET 与本服务 JWT_SECRET 联动（≥32 字节，未设置时
  # compose 拒绝启动）、ONLYOFFICE_DOWNLOAD_URL_BASE=http://backend:8080
  #（DocumentServer 回源后端地址）。
  # 端口仅 compose 内网（不映射宿主 8081）：浏览器经 caddy /onlyoffice/* 访问，
  # .env 须同时设 ONLYOFFICE_PUBLIC_URL=https://<对外域名>/onlyoffice
  #（/onlyoffice/config 返回它给浏览器加载 api.js；SERVER_URL 仍为内网
  # SSRF 基准）；本地联调可临时 docker run -p 8081:80 起 DS，把
  # ONLYOFFICE_SERVER_URL 与 ONLYOFFICE_PUBLIC_URL 均指向 http://localhost:8081。
  # 版本锁定 8.2.3（设计文档 16.5 风险 4：8.2.x 内可平滑升级，跨大版本需评估
  # API 变更）。
  onlyoffice:
    # 官方镜像 + 中文字体（deploy/onlyoffice/Dockerfile）：无 CJK 字体时
    # 中文文档渲染为方块乱码。镜像内容与 8.2.3 完全一致，仅叠加 fonts-noto-cjk。
    build:
      context: ./deploy/onlyoffice
    image: docflow/onlyoffice:8.2.3-cjk
    profiles: ["full"]
    environment:
      - JWT_ENABLED=true
      - JWT_SECRET=${ONLYOFFICE_JWT_SECRET:?set ONLYOFFICE_JWT_SECRET in .env}
    expose:
      - "80"
    volumes:
      - onlyoffice_data:/var/www/onlyoffice/Data
      - onlyoffice_logs:/var/log/onlyoffice
    restart: unless-stopped

  # draw.io 图表编辑器：官方 webapp 静态层在构建期并入 caddy 镜像
  #（frontend/Dockerfile 第三阶段 → /srv/drawio，经 /drawio/* 路径服务），
  # 不再需要独立 drawio 服务（原 jgraph/drawio:27.0.9 容器内的 Tomcat/Java
  # 仅服务其自建站云盘 OAuth 回调，本场景不使用）。对应 .env 联动：
  # DRAWIO_ENABLED=true、DRAWIO_PUBLIC_URL=https://<对外域名>/drawio。

  # MinIO S3 兼容对象存储（storage profile，可与 full 叠加）。
  # local 是默认存储驱动，不会自动启用此服务；启用 S3 时配置 STORAGE_DRIVER=s3。
  # 对应 .env：STORAGE_DRIVER=s3、S3_ENDPOINT=http://minio:9000、
  # S3_BUCKET=docflow（需提前创建，见下）、S3_ACCESS_KEY/S3_SECRET_KEY 同
  # MINIO_ROOT_USER/PASSWORD、S3_PATH_STYLE=true。
  # 说明：曾用 chrislusf/seaweedfs:3.80，真实联动验证中其 S3 网关 DELETE
  # 间歇性 500（含存在的 key），导致上传 complete 失败，故切换 MinIO。
  minio:
    # MinIO 2025 起从 Docker Hub 下架历史 tag，官方源迁至 quay.io
    #（docker.io/minio/minio 拉取报 pull access denied）。
    image: quay.io/minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-docflow}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-docflow-secret}
    restart: unless-stopped
    expose:
      - "9000"
    volumes:
      - minio_data:/data
    profiles: ["storage"]

  # Meilisearch 全文搜索引擎（search profile，可与 full/antivirus 叠加）：
  # docker compose --profile search up -d 启动。对应 .env 联动：
  # SEARCH_DRIVER=meili、MEILI_URL=http://meilisearch:7700；启用 MASTER_KEY
  # 时 MEILI_API_KEY 取同值（可空 = 无认证实例，仅内网暴露）。
  # backend 启动即创建索引 docflow-files（主键 file_id），不可达时拒绝启动；
  # 不声明 depends_on，保持按需启用（pg 驱动时不拖入本服务）。
  # 端口仅 compose 内网（不映射宿主 7700）。
  meilisearch:
    image: getmeili/meilisearch:v1.8.3
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-}
      MEILI_NO_ANALYTICS: "true"
    expose:
      - "7700"
    volumes:
      - meili_data:/meili_data
    profiles: ["search"]
  qdrant:
    image: qdrant/qdrant:v1.12.5
    profiles: ["ai-vector"]
    expose:
      - "6333"
    volumes:
      - qdrant_data:/qdrant/storage
    # qdrant 官方镜像不含 curl/wget，用 bash 内置 /dev/tcp 做 TCP 探测
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
  # SearXNG 元搜索引擎（ai-search profile，可与 full/antivirus 叠加）：
  # AI 联网搜索（/ai/chat 的 web_search）的自托管后端，接入成熟方案不自研
  # 爬虫。对应管理端联动：/admin/settings/ai 设 ai.search.provider=searxng、
  # ai.search.searxng_url=http://searxng:8080。注意 SearXNG 出于安全默认
  # 只开放 html 输出，JSON API（format=json）需在 settings.yml 的
  # search.formats 中显式启用——本服务要求挂载
  # ./deploy/searxng/settings.yml（内容两行即可，见下方注释），文件缺失时
  # 容器以默认配置启动、web_search 将 403 降级（不阻断对话）。
  # 端口仅 compose 内网（不映射宿主 8080）。
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      # 最小 settings.yml（部署时创建该文件）：
      #   use_default_settings: true
      #   server:
      #     secret_key: "<随机 32+ 字符>"
      #   search:
      #     formats:
      #       - html
      #       - json
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
    profiles: ["ai-search"]
  #
  # 如需其他 S3 兼容对象存储（STORAGE_DRIVER=s3），可参考以下示例自行启用
  #（本仓库默认 MinIO，见上方 storage profile；SeaweedFS 等亦可，需自建 bucket）：
  # seaweedfs (S3 网关):
  #   image: chrislusf/seaweedfs:3.80
  #   command: server -s3 -dir=/data -master.volumeSizeLimitMB=1024
  #   volumes: [seaweedfs_data:/data]
  #   # 对应 .env：STORAGE_DRIVER=s3、S3_ENDPOINT=http://seaweedfs:8333、
  #   # S3_BUCKET=docflow（需提前创建）、S3_PATH_STYLE=true
volumes:
  postgres_data:
  backend_storage:
  # Agent AI IPC socket 共享卷：backend 可写（监听 ai.sock），backend 创建
  # 的 agent 容器只读挂载到 /run/docflow-ai。name 钉死实际卷名（不带
  # compose 项目前缀），backend 才能用固定名 docflow-agent-ipc 挂到同一卷。
  docflow-agent-ipc:
    name: docflow-agent-ipc
  clamav_data:
  caddy_data:
  caddy_config:
  # 自定义 TLS 证书共享卷（管理页 custom 模式）：backend 可写（上传）、
  # caddy 只读（tls 指令读取 cert.pem/key.pem）。
  tls_certs:
  onlyoffice_data:
  onlyoffice_logs:
  minio_data:
  meili_data:
  qdrant_data:
