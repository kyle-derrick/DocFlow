# DocFlow HTTP API 契约（OpenAPI 3.1）。
# 本文件以 internal/http 实际实现为准（handler.go / uploads.go / tus.go / shares.go /
# teams.go / trash.go / preview.go / download.go / ratelimit.go / webpkg.go / tags.go /
# batch.go / dashboard.go / webhooks.go / resolve.go / sharetree.go / unpack.go），由
# internal/http/openapi_test.go 做双向路由一致性校验，契约与实现不允许漂移。
# 说明：/health、/ready、/metrics 为基础设施端点，不属于业务契约；路由参数统一写作 {id} 形式。
# 网页包内容域端点 GET /content/{pid}/{filepath} 为契约外路由（openapi_test.go
# isExcludedRoute 豁免）：无认证、面向 sandbox iframe 而非 API 客户端，独立按 IP
# 轻限流并携带严格 CSP/nosniff，语义见 /files/{id}/preview 的 webpkg 分支。
# 受控原始内容域端点同为契约外路由（isExcludedRoute 豁免）：
#   - GET/HEAD /raw/auth/{grant}/{nsType}/{nsScope}/{path}：登录用户经
#     GET /resolve/{nsType}/{nsScope}/*path 换取 10 分钟 HMAC grant（绑定
#     purpose=raw/user/ns/scope）后访问；每请求实时复验读授权与当前版本
#     blob 可用性；扩展名白名单（html/css/js/json/txt/png/jpg/jpeg/gif/webp/
#     avif/svg/ico/woff/woff2/pdf/mp4/webm/mp3，未知扩展 415）；目录无尾斜杠
#     308 加斜杠、尾斜杠解析 index.html；单区间 Range；响应携带 CSP
#     sandbox allow-scripts、nosniff、Cache-Control private,no-store、
#     Referrer-Policy no-referrer。无 /raw/view 登录态端点——raw 域无 Cookie
#     依赖，授权一律经 resolve API 换取 grant（前端查看器直接使用 raw_url）。
#   - GET/HEAD /raw/share/{token}/{grant}/{path}：公开目录分享子资源；grant
#     由 GET /public/shares/{token}/tree/*path（密码分享须先 verify）签发，
#     purpose=raw-share 且绑定 share_id；每请求复查分享未撤销/未过期（410）、
#     根存在、路径在子树内（404）与 blob 可用；不消耗 download_count。
openapi: 3.1.0
info:
  title: DocFlow API
  version: 1.0.0
  description: |
    DocFlow 文档管理服务 API。

    ## 认证
    - 业务端点要求 `Authorization: Bearer <access_token>`（HS256 JWT，subject 为用户 UUID）。
    - 登录/刷新通过 HttpOnly Cookie `refresh_token`（Path=/api/v1/auth/refresh，SameSite=Lax）轮换会话。

    ## 错误与限流
    - 错误响应统一为 `{error, code?}`；`code` 为机器可读错误码（如 NAME_CONFLICT、QUARANTINED）。
    - 认证接口按 user_id+IP 每分钟限流；登录按 IP+邮箱前缀哈希更严格限流；
      公开分享接口按 IP 独立限流；超限返回 429 并带 Retry-After。
    - 文件元数据响应带 ETag（基于 updated_at）。
servers:
  - url: /api/v1
    description: API 基础路径（契约测试据此归一化路由）
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: >-
      登录、刷新、登出、会话管理、两步验证（TOTP）、OIDC 单点登录
      （/auth/oidc/*，启用时可用）、邀请注册与密码管理（忘记/重置/修改）
  - name: Tokens
    description: 个人访问令牌（PAT，dfpat_ 前缀 Bearer 凭证）：创建（明文仅返回一次）、列表与撤销
  - name: Notifications
    description: 站内通知与通知偏好（本人维度）：列表/未读数/已读、各事件类型开关
  - name: Webhooks
    description: >-
      Webhook 通知渠道（本人维度）：注册出站回调 URL（一次性签名 secret 仅
      创建时返回）、列表（含投递状态）、启停与删除；事件触发时 POST 签名
      JSON 载荷（经队列异步投递）
  - name: Users
    description: 用户目录查找（邀请场景）与个人档案（/me：档案读写 + 存储用量/配额）
  - name: Dashboard
    description: 个人仪表盘概览统计（admin 附加全局统计）
  - name: Files
    description: 个人空间文件与目录
  - name: Paths
    description: >-
      路径型访问（v1.1）：GET /resolve 按命名空间+路径解析文件并签发短期
      raw 授权（/raw/* 为契约外内容域端点，见文件头说明）
  - name: Zip Import
    description: zip 导入目录树（POST /files/{id}/unpack：解为真实文件树，逐条目走上传管线）
  - name: Tags
    description: 标签与收藏（用户维度标签 CRUD、文件打/去标签、行级星标）
  - name: Batch
    description: 批量操作（部分成功语义，可选 Idempotency-Key 幂等）
  - name: Trash
    description: 回收站
  - name: Uploads
    description: 自定义分片上传 API
  - name: tus
    description: tus 1.0.0 断点续传（creation/expiration 扩展）
  - name: Shares
    description: 私有分享（登录用户按显式授权访问）
  - name: Public Shares
    description: 公开分享（token 链接，无认证）
  - name: Teams
    description: >-
      团队与团队空间（成员/自定义角色权限、团队目录）；路径级 ACL
      （/folders/{id}/acl，设计 6.5.3/6.5.4 最小落地：团队作用域目录的
      read/write/delete/share 判定先走 folder_acl 链，无适用条目回退团队角色）
  - name: AI
    description: >-
      AI 文件摘要（v2 可落地子集）：OpenAI 兼容 /chat/completions；
      AI_ENABLED=false 时端点返回 503 AI_DISABLED
  - name: Admin
    description: >-
      管理端（仅 admin 角色）：系统设置、基础统计、邀请管理与用户管理
      （列表/禁用启用/改配额/改角色/重置密码；删除以软禁用替代）
  - name: onlyoffice
    description: >-
      ONLYOFFICE Document Server 集成（可用性探测、编辑会话、回源下载与
      保存回调）；除 config 探测端点恒注册（禁用时 enabled=false 且不暴露
      server_url）外，其余端点仅在 ONLYOFFICE_ENABLED=true 时注册
      （禁用时 404）
  - name: drawio
    description: >-
      draw.io 图表编辑集成（可用性探测）；编辑器为浏览器侧 iframe embed
      （postMessage JSON 协议：init→load→save），后端无独立编辑/保存端点
      ——保存走通用「覆盖为新版本」上传链路（POST /uploads 携带 file_id），
      图表文件即普通 .drawio 文件

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 登录（邮箱或用户名 + 密码）
      description: >-
        校验凭据后签发访问令牌并创建刷新会话；刷新令牌经 HttpOnly Cookie
        refresh_token 下发。登录按 IP+标识前缀哈希独立限流。identifier 为
        登录标识（email 或 username；含 @ 按归一邮箱精确匹配，否则按用户名
        精确匹配），旧字段 email 兼容保留（identifier 缺省时使用）。连续失败
        达到 LOGIN_MAX_RETRIES（默认 5）次后账号锁定 LOGIN_LOCK_MINUTES
        （默认 15 分钟）：锁定期间登录/refresh 一律 423 ACCOUNT_LOCKED
        （不计新失败），成功登录清零计数。已启用两步验证（TOTP）的账号
        密码正确时仍 401 TOTP_REQUIRED（不发放任何令牌），须凭同一凭据转
        POST /auth/login/totp 提交第二因子。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                identifier:
                  type: string
                  description: 登录标识（email 或 username），优先于 email 字段
                email:
                  type: string
                  description: 旧字段（兼容保留）；identifier 缺省时使用
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功；Set-Cookie 下发 refresh_token
          headers:
            Set-Cookie:
              description: refresh_token=...; Path=/api/v1/auth/refresh; HttpOnly; SameSite=Lax
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: >-
            凭据错误（identifier 或密码不匹配，统一响应防枚举）；或账号已启用
            两步验证——此时 body 为 {error: totp_required, code: TOTP_REQUIRED}，
            不发放任何令牌（防绕过：启用 TOTP 的账号在 /login 永远拿不到 token）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423':
          description: >-
            账号处于锁定期（连续登录失败达到 LOGIN_MAX_RETRIES），
            body 为 {error, code: ACCOUNT_LOCKED}；不计新失败。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/login/totp:
    post:
      tags: [Auth]
      operationId: loginTotp
      summary: 两步验证登录（第二段）
      description: >-
        重新验证 identifier+密码后校验第二因子：code 为认证器当前 6 位 TOTP 码
        （±30s 窗口），或 recovery_code 为一次性恢复码（命中即消耗，不可
        重用）。通过后签发访问令牌并创建刷新会话（响应同 login）。密码错误
        与 /login 同响应（401 invalid credentials，防枚举）并同样计入失败
        锁定；码错误 401 invalid totp code（不计失败锁定——限流已约束爆破，
        避免以错误码恶意锁定他人账号）；锁定期间 423 ACCOUNT_LOCKED。
        限流与 /login 共享同一实例与限流键（IP+标识前缀哈希）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TOTPLoginRequest' }
      responses:
        '200':
          description: 登录成功；Set-Cookie 下发 refresh_token
          headers:
            Set-Cookie:
              description: refresh_token=...; Path=/api/v1/auth/refresh; HttpOnly; SameSite=Lax
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: >-
            凭据错误（invalid credentials，与 login 同响应防枚举），
            或 code/recovery_code 校验失败（invalid totp code）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423':
          description: '账号处于锁定期，{error, code: ACCOUNT_LOCKED}'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/oidc/config:
    get:
      tags: [Auth]
      operationId: oidcConfig
      summary: OIDC 单点登录可用性探测
      description: >-
        恒注册的公开探测端点：{enabled}。enabled=false 表示后端未启用
        OIDC（OIDC_ENABLED=false），此时 /auth/oidc/login 与 /auth/oidc/callback
        不注册（404），登录页不展示「使用 SSO 登录」按钮。
      security: []
      responses:
        '200':
          description: '{enabled: 是否启用 SSO}'
          content:
            application/json:
              schema:
                type: object
                required: [enabled]
                properties:
                  enabled: { type: boolean }

  /auth/oidc/login:
    get:
      tags: [Auth]
      operationId: oidcLogin
      summary: 发起 OIDC 单点登录（302 跳 IdP）
      description: >-
        仅 OIDC_ENABLED=true 时注册。签发一次性 state（内存登记 PKCE
        verifier，TTL 10 分钟，用后即焚）并 302 跳转 IdP 授权端点
        （response_type=code + PKCE S256，scope=openid email profile）；
        state 同时写入 HttpOnly cookie oidc_state（Path=/api/v1/auth/oidc/callback），
        callback 侧与 URL 参数双验证（防 CSRF/重放）。按 IP 独立轻限流。
      security: []
      responses:
        '302':
          description: >-
            Location 为 IdP 授权地址；Set-Cookie 下发 oidc_state
            （HttpOnly，10 分钟）。
          headers:
            Location:
              description: IdP authorization_endpoint（含 state 与 code_challenge）
              schema: { type: string, format: uri }
            Set-Cookie:
              description: oidc_state=...; Path=/api/v1/auth/oidc/callback; HttpOnly; SameSite=Lax
              schema: { type: string }
        '500':
          description: 服务端状态签发失败（极少见）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/oidc/callback:
    get:
      tags: [Auth]
      operationId: oidcCallback
      summary: OIDC 授权码回调（302 前端落地页）
      description: >-
        仅 OIDC_ENABLED=true 时注册。state 双验证（cookie == 参数）并经
        服务端内存消费（一次性）后，以授权码 + PKCE verifier 换取令牌，
        解析 sub/email（userinfo 优先，回退 ID token claims；email 小写
        归一）。用户映射：oidc_links 的 sub 关联 → email 匹配 active 用户
        → 自动开户（OIDC_AUTO_PROVISION，默认 true；role=user、随机不可
        登录密码、审计 oidc.provision，根目录延迟创建）。关闭自动开户且
        无匹配时 403（SSO_NOT_PROVISIONED，引导联系管理员）。安全取舍：
        SSO 信任 IdP 认证强度，跳过本地 TOTP 二验（密码登录的 TOTP 拦截
        不变）。成功后签发 DocFlow 会话：refresh_token 经 HttpOnly Cookie，
        access_token 经 URL fragment 跳转前端落地页——fragment 不随请求
        发送、不进日志与 Referer。按 IP 独立轻限流。
      security: []
      parameters:
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: code
          in: query
          required: true
          schema: { type: string }
      responses:
        '302':
          description: >-
            登录成功。Location 为 {PUBLIC_BASE_URL}/sso#access_token=<jwt>
            （前端落地页读取 fragment 存内存并清除）；Set-Cookie 下发
            refresh_token。
          headers:
            Location:
              description: 前端 SSO 落地页（access_token 在 URL fragment 中）
              schema: { type: string, format: uri }
            Set-Cookie:
              description: refresh_token=...; Path=/api/v1/auth/refresh; HttpOnly; SameSite=Lax
              schema: { type: string }
        '401':
          description: state 缺失/不匹配/已消费，或授权码换取失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            账号被禁用，或无匹配账号且自动开户关闭（后者 code 为
            SSO_NOT_PROVISIONED，引导联系管理员）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: 轮换刷新令牌
      description: >-
        从 refresh_token Cookie 读取刷新令牌并轮换（rotate）：旧令牌立即失效，
        新 Cookie 与新访问令牌随响应返回。该端点无独立限流。同源校验
        （CSRF，设计 6.1.5）：Origin/Referer 至少其一存在且 host 与请求 Host
        一致；严格模式（CSRF_STRICT，默认 true）下缺失两头一律 403——现代
        浏览器对 POST 均携带 Origin，同源 fetch 自然满足；非浏览器客户端
        （curl 等）需配置 CSRF_STRICT=false。账号被禁用 401（撤销刚轮换出的
        会话）；账号处于登录失败锁定期 423 ACCOUNT_LOCKED（同样撤销）。
      security: []
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          schema: { type: string }
          description: HttpOnly 刷新令牌 Cookie
      responses:
        '200':
          description: 新访问令牌；Set-Cookie 轮换 refresh_token
          headers:
            Set-Cookie:
              description: 轮换后的 refresh_token Cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: 刷新令牌缺失、无效或已过期；或账号已禁用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: >-
            同源校验失败（CSRF）：Origin/Referer 缺失（严格模式）或 host 与
            请求 Host 不一致，body 为 {error, code: CSRF_REJECTED}。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '423':
          description: '账号处于登录失败锁定期，{error, code: ACCOUNT_LOCKED}'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 登出
      description: >-
        撤销 refresh_token Cookie 对应的刷新会话并清除 Cookie；幂等，未携带
        Cookie 也返回 204。同源校验（CSRF）与 /auth/refresh 一致（见其描述）。
      security: []
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          schema: { type: string }
      responses:
        '204':
          description: 已登出（Cookie 被清除）
        '403':
          description: '同源校验失败（CSRF），{error, code: CSRF_REJECTED}'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 凭邀请注册（邀请接受）
      description: >-
        v1.0 仅管理员邀请制：凭一次性邀请 token 完成注册（用户名 3-32 字符
        仅限字母/数字/_/-，密码与 seed 同规则：≥12 字符且含大小写与数字），
        用户邮箱继承邀请、角色继承邀请。成功即视为登录：签发 access token
        并创建新 refresh 会话（响应同 login）。token 未知 404、已过期或已
        使用 410、用户名/邮箱冲突 409。按 IP 独立严格限流（10/min）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: 注册成功并已登录；Set-Cookie 下发 refresh_token
          headers:
            Set-Cookie:
              description: refresh_token=...; Path=/api/v1/auth/refresh; HttpOnly; SameSite=Lax
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: 邀请 token 未知
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 用户名或邮箱已被占用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: 邀请已过期或已被使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: 请求密码重置邮件
      description: >-
        邮箱存在活跃账号时创建 30 分钟有效的一次性重置令牌并发送邮件
        （链接 {PUBLIC_BASE_URL}/reset/{token}）；无论邮箱是否存在一律 202，
        不泄露账号存在性。按 IP 独立严格限流（10/min）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '202':
          description: 已受理（不区分邮箱是否存在）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: 凭一次性令牌重置密码
      description: >-
        消费一次性重置令牌（原子标记 used_at），更新密码并撤销该用户全部
        会话。令牌未知/已使用/已过期 400。按 IP 独立严格限流（10/min）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204':
          description: 已重置（全部会话失效，需重新登录）
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: 修改密码（认证）
      description: >-
        校验旧密码（错误 403）与新密码强度后更新哈希，撤销该用户全部其他
        会话，并轮换当前会话——响应头 Set-Cookie 下发本会话新的 refresh_token。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: 已修改；Set-Cookie 轮换本会话 refresh_token
          headers:
            Set-Cookie:
              description: 轮换后的 refresh_token Cookie（其他会话已被撤销）
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 旧密码错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      summary: 我的活跃登录会话
      description: >-
        列出当前用户全部活跃会话（未撤销且未过期，last_active_at 倒序）。
        实现取舍：不标记「当前会话」——会话由 refresh cookie 识别，其哈希
        不参与任何响应（凭据材料不出服务端），可伪造的请求头不作为信任源。
        响应不含 refresh_token 任何形态。
      responses:
        '200':
          description: 活跃会话列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Auth]
      operationId: revokeAllSessions
      summary: 撤销全部会话（含当前）
      description: >-
        撤销当前用户的全部会话——包括发起本请求的「当前」会话（实现取舍：
        不依赖可伪造的 X-Session-Hint 之类请求头区分当前会话），并清除
        refresh_token Cookie。前端收到 204 后应清除本地 access token 并跳转
        登录页。PAT 不受影响（无 session 语义，另行经 /tokens 撤销）。
      responses:
        '204':
          description: 已全部撤销（Cookie 被清除）
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: 撤销指定会话
      description: 撤销自己的指定会话（远程登出某设备）；会话不存在、非属主或已撤销一律 404（不泄露存在性）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已撤销 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/totp:
    get:
      tags: [Auth]
      operationId: totpStatus
      summary: 两步验证状态
      description: 当前用户两步验证（TOTP）状态；未 setup 时 enabled=false、confirmed_at=null。
      responses:
        '200':
          description: 状态视图
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TOTPStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Auth]
      operationId: totpDisable
      summary: 禁用两步验证
      description: >-
        密码或当前有效 6 位 TOTP 码二选一验证（均错 403；恢复码不可用于
        禁用）后删除 user_totp 行。写 totp.disable 审计；重新启用走全新
        setup。未启用时 404。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TOTPDisableRequest' }
      responses:
        '204': { description: 已禁用 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/totp/setup:
    post:
      tags: [Auth]
      operationId: totpSetup
      summary: 开始两步验证设置
      description: >-
        生成新 secret（作废未完成的旧 setup）并落库 enabled=false，返回
        Base32 secret 与 otpauth URL。客户端不渲染二维码：以文本展示供
        认证器手动录入/导入（设计限制）。已启用时 409（须先禁用）。
      responses:
        '200':
          description: secret 与 otpauth URL（待 confirm）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TOTPSetup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/totp/confirm:
    post:
      tags: [Auth]
      operationId: totpConfirm
      summary: 确认启用两步验证
      description: >-
        校验认证器 6 位码（±30s 窗口）后启用（enabled=true + confirmed_at）
        并生成 10 个恢复码（xxxx-xxxx）。明文仅本响应返回一次，服务端只存
        SHA-256 哈希。写 totp.enable 审计。码错误 400；未 setup 400；已启用 409。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TOTPConfirmRequest' }
      responses:
        '200':
          description: 已启用；恢复码明文仅此一次返回
          content:
            application/json:
              schema:
                type: object
                required: [recovery_codes]
                properties:
                  recovery_codes:
                    type: array
                    items: { type: string }
                    description: 10 个恢复码（xxxx-xxxx），一次性明文
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tokens:
    post:
      tags: [Tokens]
      operationId: createToken
      summary: 创建个人访问令牌
      description: >-
        创建 PAT：明文 token（dfpat_ + 43 字符 URL-safe base64）仅在本 201
        响应返回一次，服务端只存 SHA-256 哈希；prefix 为明文前 14 字符
        （UI 展示用）。name 去空白后限 1-100 字符；expires_in_days 缺省或 0
        表示永久，1-3650 天。写 token.create 审计（PAT 认证本身不审计）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                expires_in_days:
                  { type: integer, minimum: 0, maximum: 3650, default: 0, description: 有效期（天）；0 表示永久 }
      responses:
        '201':
          description: 已创建；token 明文仅此一次返回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedApiToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Tokens]
      operationId: listTokens
      summary: 我的个人访问令牌列表
      description: 当前用户未撤销的 PAT（含已过期，按 created_at 倒序）；不含明文 token，附 last_used_at（最近一次认证，未使用为 null）。
      responses:
        '200':
          description: 令牌列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tokens/{id}:
    patch:
      tags: [Tokens]
      operationId: updateToken
      summary: 修改个人访问令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                scopes: { type: array, items: { type: string, enum: [files:read, files:write] } }
      responses:
        '200': { description: 已更新 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Tokens]
      operationId: revokeToken
      summary: 撤销个人访问令牌
      description: 撤销自己的 PAT（立即失效，后续认证 401）；不存在、非属主或已撤销一律 404。写 token.revoke 审计。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已撤销 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /ws/notifications:
    get:
      tags: [Notifications]
      operationId: websocketNotifications
      summary: WebSocket 实时通知
      responses:
        '101': {description: WebSocket upgrade}
        '401': {description: 未授权}
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: 我的站内通知列表
      description: >-
        当前用户通知（created_at 倒序），响应恒附 unread_count（顶栏铃铛徽标）。
        游标分页：next_cursor 为本页最后一条的 created_at（RFC3339Nano），
        作为下一页请求的 cursor（取该时间点之前的记录）；无更多页时为空串。
        简化取舍：同一时刻多条通知可能跨页跳漏，v1.0 可接受。
      parameters:
        - name: unread_only
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: 仅返回未读通知
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 20, maximum: 100 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: 上一页 next_cursor（RFC3339Nano）；非法格式 400
      responses:
        '200':
          description: 通知列表（含未读数与下一页游标）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: 全部标记已读
      description: 当前用户全部未读通知置为已读（read_at=now）；无未读时幂等成功。
      responses:
        '204': { description: 已全部标记已读 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /notifications/{id}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: 标记单条已读
      description: 标记自己的通知为已读（幂等，已读不重复更新 read_at）；不存在或不属于当前用户一律 404（不泄露存在性）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已标记已读 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /notification-preferences:
    get:
      tags: [Notifications]
      operationId: listNotificationPreferences
      summary: 我的通知偏好
      description: >-
        返回全部事件类型的生效开关；无偏好记录的事件类型按默认值
        （当前全部默认开启）返回。事件类型：upload.completed（上传完成）、
        upload.quarantined（上传被隔离）、share.accessed（分享被下载）、
        file.updated（团队文件更新）。
      responses:
        '200':
          description: 各事件类型开关
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferenceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /notification-preferences/{type}:
    put:
      tags: [Notifications]
      operationId: updateNotificationPreference
      summary: 更新单个通知偏好
      description: >-
        upsert 当前用户对事件类型的开关（user_id+event_type 冲突覆盖）；
        关闭后该类型事件不再生成通知（分发时短路）。未知事件类型 400。
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [upload.completed, upload.quarantined, share.accessed, file.updated, file.version.deleted, quota.warning]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: 已更新；返回生效值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreference' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /webhooks:
    post:
      tags: [Webhooks]
      operationId: createWebhook
      summary: 注册 Webhook
      description: >-
        注册出站回调 URL：事件发生时（与站内通知同一偏好开关，偏好关闭则
        不投递）POST {event,timestamp,data} JSON 并附 X-DocFlow-Signature:
        sha256=<hex(HMAC-SHA256(secret, body))> 签名头（接收方用下发的
        secret 验签）。URL 须为 http(s) 且无 userinfo（localhost/内网允许，
        自托管场景；SSRF 经签名 secret、有限重试与自动禁用缓解）；events
        为白名单事件类型的非空子集（重复去重）。一次性签名 secret
        （whsec_ + 43 字符 URL-safe base64）仅在本 201 响应返回一次，服务端
        存明文（HMAC 出站签名需明文密钥，与入站认证的 PAT 哈希不同）。
        投递超时 10s、内部重试 3 次（1s/5s/25s 退避），经后台队列异步执行。
        同一用户重复注册同一 URL 返回 409。写 webhook.create 审计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url, events]
              properties:
                url: { type: string, maxLength: 2048, description: 回调 URL（http/https，无 userinfo） }
                events:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    enum: [upload.completed, upload.quarantined, share.accessed, file.updated]
      responses:
        '201':
          description: 已创建；secret 明文仅此一次返回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedWebhook' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 同一用户已注册该 URL }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Webhooks]
      operationId: listWebhooks
      summary: 我的 Webhook 列表
      description: >-
        当前用户的全部 webhook（created_at 倒序，含已禁用）；附投递状态
        （last_status 为最近一次投递 HTTP 状态码，0=传输层失败，null=从未
        投递；failure_count 为连续失败计数，成功清零，连续 10 次失败自动
        禁用）。不含 secret。
      responses:
        '200':
          description: webhook 列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebhookList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /webhooks/{id}:
    patch:
      tags: [Webhooks]
      operationId: updateWebhook
      summary: 启用/停用 Webhook
      description: >-
        更新自己的 webhook 启停（自动禁用后可经此重新启用）；不存在或不属于
        当前用户一律 404（不泄露存在性）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: 已更新；返回最新条目
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Webhook' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Webhooks]
      operationId: deleteWebhook
      summary: 删除 Webhook
      description: 删除自己的 webhook（立即停止投递）；不存在或非属主一律 404。写 webhook.delete 审计。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已删除 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /users/lookup:
    get:
      tags: [Users]
      operationId: lookupUsers
      summary: 用户查找（邀请场景）
      description: >-
        按邮箱或用户名精确/前缀匹配查找活跃用户（大小写不敏感前缀），按 username
        排序，固定最多返回 10 条。权限考虑：任何登录用户均可查询（添加团队成员/
        邀请场景需要）；为避免用户枚举与隐私泄露，响应只含 id 与 username，
        绝不返回 email，并受通用认证接口限流约束。q 为空返回 400。
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: 查询串：邮箱（精确或前缀）或用户名（精确或前缀）
      responses:
        '200':
          description: 匹配的用户列表（仅 id 与 username）
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    username: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /users/search:
    get:
      tags: [Users]
      operationId: searchUsers
      summary: 用户检索（成员/ACL 主体选择器）
      description: >-
        按 username/nickname 子串（大小写不敏感）检索活跃用户；q 含 @ 时
        额外匹配 email 子串（邮箱不做无 @ 的模糊匹配，防枚举）。任何登录用户
        可用（添加团队成员/ACL 场景需要），固定最多返回 20 条；响应含
        id/username/email/nickname（团队协作场景需 email 区分同名用户）。
        q 少于 2 个字符返回 400。
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2 }
          description: 查询串（≥2 字符）
      responses:
        '200':
          description: 匹配的用户列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  users:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        username: { type: string }
                        email: { type: string, format: email }
                        nickname: { type: string, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me:
    get:
      tags: [Users]
      operationId: getMe
      summary: 当前用户档案与存储用量
      description: >-
        返回当前认证用户的档案（username/email/role/status + 昵称、部门、
        职位、电话、简介、语言、时区）与个人空间存储用量/配额（C3/C21a）。
        storage.used 与配额校验同口径：当前版本大小求和且软删（回收站）文件
        计入——对象在彻底删除前仍占用存储；头像不落库（avatar 由前端按
        username/昵称首字母计算）。
      responses:
        '200':
          description: 当前用户档案
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Users]
      operationId: updateMe
      summary: 更新当前用户档案
      description: >-
        更新档案字段（仅提供的字段；文本字段空串表示清空）。校验：
        nickname ≤64、department/position ≤128、phone ≤32、bio ≤512 字符，
        language ∈ zh-CN|en-US，timezone 非空 ≤64（IANA 名称）。成功返回
        更新后的完整 /me 视图；并发更新为最后写入胜出。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeProfileUpdate' }
      responses:
        '200':
          description: 更新后的档案
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /me/open-with:
    get:
      tags: [Users]
      operationId: listOpenWith
      summary: 默认打开方式偏好列表
      description: >-
        返回当前用户按扩展名记录的「默认打开方式」偏好（user_open_with，
        每 ext 一行，按 ext 排序；无记录返回空列表）。
      responses:
        '200':
          description: 偏好列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  open_with:
                    type: array
                    items: { $ref: '#/components/schemas/OpenWithPreference' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      tags: [Users]
      operationId: updateOpenWith
      summary: 设置默认打开方式偏好（upsert）
      description: >-
        upsert 一条偏好。ext 规范化：去前置点、转小写、1..16 个 [a-z0-9]
        字符；opener 枚举校验（office/drawio/excalidraw/text/markdown/
        code/web/default）。非法请求 400。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OpenWithPreference' }
      responses:
        '200':
          description: 已保存的偏好
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpenWithPreference' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Users]
      operationId: deleteOpenWith
      summary: 删除默认打开方式偏好（幂等）
      parameters:
        - name: ext
          in: query
          required: true
          schema: { type: string }
          description: 扩展名（规范化规则同 PUT；非法 400）
      responses:
        '204': { description: 已删除（或本就不存在） }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /search:
    get:
      tags: [Files]
      operationId: searchFiles
      summary: 文件全文检索（名称 + 文本内容）
      description: >-
        跨目录检索当前用户可读的文件（个人 owner + 团队在册成员，实时判定；
        软删文件排除；访问判定与 GET /files 的检索模式一致）。匹配规则：
        名称 ILIKE %q%（大小写不敏感子串，中文友好）OR 内容 tsvector @@
        plainto_tsquery('simple', q)（内容索引仅覆盖文本类文件且 ≤2MB，
        二进制——图片/pdf/office——仅名称匹配；'simple' 分词对中文内容
        基本无效，中文以名称子串为主）。索引在上传完成（新建/覆盖版本）
        后异步构建，检索到最新上传内容可能有短暂延迟。结果名称命中优先，
        其次 updated_at 倒序。高频读端点：不记录审计，限流沿用认证接口组。
        tag_id/starred 过滤可选（语义同 /files 检索模式）。
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: 检索词（名称子串或内容词；%/_/\ 按字面匹配）
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 20, maximum: 100 }
          description: 返回条数上限（服务端固定上限 100）
        - name: tag_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 限定带该标签的结果（须属于当前用户，否则 404）
        - name: starred
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
          description: 限定收藏状态
      responses:
        '200':
          description: 检索结果（名称命中附 snippet=名称；内容命中附 ts_headline 片段）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResultList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      summary: 个人仪表盘统计（登录用户）
      description: >-
        个人空间（owner 维度）概览统计：我的文件数、存储占用（当前版本
        file_versions.size 之和，软删与历史版本不计入）、有效分享数（公开 +
        私有：未撤销且未过期）、近 7 天上传会话数，以及最近更新的 5 个文件
        （id/name/updated_at）。团队文件不计入个人口径，另以 team_files
        单列（当前用户可访问团队空间的文件数，在册成员实时判定）。
        请求者为 admin 角色时附加全局统计 admin（复用 GET /admin/stats，
        角色查询失败时静默降级为个人视图）。
      responses:
        '200':
          description: 个人统计（admin 附全局统计）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files:
    get:
      tags: [Files]
      operationId: listFiles
      summary: 列出目录内容（或按标签/收藏跨目录检索）
      description: >-
        缺省（无 tag_id/starred）列出 parent_id 指定目录（缺省为用户根目录，
        服务端按需创建）的直接子项。提供 tag_id 或 starred 时切换为跨目录
        检索模式（忽略 parent_id）：覆盖个人 + 团队可读文件（个人 owner、
        团队在册成员，实时判定）。sort/order 两种模式均生效。
        tag_id 须属于当前用户（否则 404，不泄露存在性）。
      parameters:
        - name: recent
          in: query
          required: false
          schema: { type: boolean }
          description: 按最近访问时间倒序列出文件
        - name: parent_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 父目录 ID；缺省为用户根目录（检索模式下忽略）
        - name: tag_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 标签过滤（提供即进入跨目录检索模式）
        - name: starred
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
          description: 收藏过滤（提供即进入跨目录检索模式）
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [name, updated_at, size], default: name }
          description: 排序键（size 取当前版本字节数）
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 100, maximum: 100 }
          description: 返回条数上限（服务端固定上限 100）
      responses:
        '200':
          description: 目录内容或检索结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/copy:
    post:
      tags: [Files]
      operationId: copyFile
      summary: 复制文件
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [parent_id]
              properties:
                parent_id: { type: string, format: uuid }
                name: { type: string, maxLength: 255 }
      responses:
        '201': { description: 已复制 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /files/batch/move:
    post:
      tags: [Batch]
      operationId: batchMove
      summary: 批量移动（部分成功）
      description: >-
        把多个文件/目录移动到 target_parent_id（缺省为个人根目录）下。
        目标目录整体校验失败（不存在 404 / 无写权限 403）时整个请求失败；
        其余逐项执行、逐项收集结果 [{id,ok,error_code}]，单项失败不回滚
        其他项（部分成功语义），目标目录同名冲突项跳过（NAME_CONFLICT）。
        移动继承目标目录作用域（个人↔团队移动更新 scope/team）。根目录与
        移入自身/后代（INVALID_TARGET）拒绝；移动后子树最深深度超过
        folder.max_depth（默认 32）时逐项 DEPTH_LIMIT 跳过。file_ids 去重、
        上限经 batch.max_items 热读取（默认 100）。
        可选 Idempotency-Key：同 key+同请求体 60s 内重放缓存响应
        （Idempotency-Replayed: true），同 key 不同请求体 409；
        缓存为进程内实现，多实例部署下不跨实例共享。
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: 幂等键（batch 三端点通用语义）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_ids]
              properties:
                file_ids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                target_parent_id:
                  { type: string, format: uuid, description: 目标目录 ID；缺省为个人根目录 }
      responses:
        '200':
          description: 逐项结果（含失败项 error_code）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency-Key 已被不同请求体使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/batch/download:
    post:
      tags: [Batch]
      operationId: batchDownload
      summary: 批量安全 ZIP 下载
      description: 最多 100 个可读文件，服务端仅打包 available blob，文件名加 UUID 前缀防冲突与路径穿越。
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_ids]
              properties:
                file_ids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 100
      responses:
        '200':
          description: ZIP 流
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/batch/trash:
    post:
      tags: [Batch]
      operationId: batchTrash
      summary: 批量软删除（部分成功）
      description: >-
        批量移入回收站（软删除）；根目录跳过（ROOT），个人文件仅 owner、
        团队文件要求成员写权限（FORBIDDEN）。逐项结果语义与上限同 move。
        Idempotency-Key 语义同 move。
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_ids]
              properties:
                file_ids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 100
      responses:
        '200':
          description: 逐项结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Idempotency-Key 已被不同请求体使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/batch/restore:
    post:
      tags: [Batch]
      operationId: batchRestore
      summary: 批量恢复（部分成功）
      description: >-
        批量从回收站恢复，逐项复用单文件 Restore 语义：原父目录已删除
        （PARENT_DELETED）/ 名称冲突（NAME_CONFLICT）/ 未删除（NOT_DELETED）
        记入 per-item 结果，不静默改名。Idempotency-Key 语义同 move。
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_ids]
              properties:
                file_ids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 100
      responses:
        '200':
          description: 逐项结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Idempotency-Key 已被不同请求体使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: 我的标签列表
      description: 当前用户的标签（用户维度，按名称排序）。
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Tags]
      operationId: createTag
      summary: 创建标签
      description: 名称 NFC 归一、非空、≤64 rune、拒绝控制字符；(user_id, name) 唯一。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
      responses:
        '201':
          description: 标签已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tags/{id}:
    delete:
      tags: [Tags]
      operationId: deleteTag
      summary: 删除标签（解除全部关联）
      description: 仅创建者可删；file_tags 关联级联清理。他人的标签按 404 处理。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已删除 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /folders:
    post:
      tags: [Files]
      operationId: createFolder
      summary: 创建目录
      description: >-
        深度校验（folder.max_depth，默认 32、根为 1）：父目录深度 + 1 超过
        上限时 400（code: FOLDER_DEPTH_LIMIT）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parent_id:
                  { type: string, format: uuid, description: 父目录 ID；缺省为用户根目录 }
      responses:
        '201':
          description: 目录已创建
          headers:
            ETag: { schema: { type: string }, description: 基于 updated_at 的弱校验值 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}:
    get:
      tags: [Files]
      operationId: getFile
      summary: 文件/目录元数据（含当前版本）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 元数据；文件无当前版本时 current_version 为 null
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileWithVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Files]
      operationId: renameFile
      summary: 重命名
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: 重命名后的元数据
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Files]
      operationId: deleteFile
      summary: 软删除（移入回收站）
      description: 删除文件或目录（含子树）进入回收站；根目录不可删除（403）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已移入回收站 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/download:
    get:
      tags: [Files]
      operationId: downloadFile
      summary: 下载当前版本
      description: >-
        对象状态须为 available（否则 403）；成功时递增 download_count；
        Content-Disposition: attachment（文件名按 RFC 5987 编码）；支持单区间 Range。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          required: false
          schema: { type: string }
          description: '如 bytes=0-1023 或 bytes=-N（后缀区间）；多区间不支持（416）'
      responses:
        '200':
          description: 全量内容（实际 Content-Type 为对象 MIME 类型）
          headers:
            Content-Disposition:
              description: attachment; filename=...（RFC 5987）
              schema: { type: string }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 对象不可下载（非 available 状态）或无权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416':
          description: 'Range 无法满足；响应带 Content-Range: bytes */<size>'
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/download.zip:
    get:
      tags: [Files]
      operationId: downloadFolderZip
      summary: 目录打包下载（流式 zip）
      description: >-
        id 须为目录（否则 400）。服务端递归遍历子树（soft-delete 排除；当前
        版本非 available 的文件跳过），以 zip 流式写出（不落盘不缓存）：
        entry 名为相对根目录的路径（目录含尾斜杠），文件内容从对象存储整
        对象流式拷贝；Content-Disposition: attachment 文件名=<目录名>.zip。
        规模限制：子树条目数 ≤2000、文件总大小 ≤2GB，超限 413（响应体写出
        前完成预遍历）。权限同文件读取（authorizeFileRead：个人 owner、
        团队在册成员/ACL）。不支持 Range（整包流式生成）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: zip 归档流
          headers:
            Content-Disposition:
              description: attachment; filename=<目录名>.zip（RFC 5987）
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413':
          description: 子树规模超限（条目数 >2000 或总大小 >2GB）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/convert-markdown:
    post:
      tags: [Files]
      operationId: convertToMarkdown
      summary: XMind 转 Markdown（产物落库）
      description: >-
        源文件须为 .xmind（否则 422）；解析 content.json（新格式，老版
        content.xml 返回明确不支持错误）生成 Markdown（每 sheet 一个
        `# 标题`，topic 树转嵌套 `- ` 列表，notes 转缩进 `> ` 引用），以
        <同名>.md 写入源文件所在目录（重名自动加 -converted-N 后缀），经
        上传管线落库（校验/配额生效），返回新 file_id。解析失败 422 附原因。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: 转换完成（新文件已创建）
          content:
            application/json:
              schema:
                type: object
                properties:
                  file_id: { type: string, format: uuid }
                  name: { type: string, description: 产物文件名（含 -converted-N 后缀如有） }
                  size: { type: integer, description: Markdown 字节数 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422':
          description: 源非 .xmind 或解析失败（附原因）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/preview:
    get:
      tags: [Files]
      operationId: previewFile
      summary: 内联预览
      description: >-
        MIME 白名单：image/*、application/pdf、application/json、text/plain；
        image/svg* 一律拒绝（防 XSS）；text/* 强制 charset=utf-8；
        Content-Disposition: inline 且带 X-Content-Type-Options: nosniff；
        成功递增 view_count；支持单区间 Range。
        网页包联动：application/zip（或 .zip 文件名）且 web_packages 存在
        ready 解包结果时，返回 200 JSON {kind:"webpkg",
        url:"/content/<public_id>/index.html"}（替代 415），前端以
        sandbox iframe 加载该 URL。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: >-
            内联内容（常规类型为二进制流）；zip 网页包为 WebpkgPreview JSON
          headers:
            Content-Disposition:
              description: inline; filename=...（RFC 5987）；webpkg JSON 分支无此头
              schema: { type: string }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: '#/components/schemas/WebpkgPreview' }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 对象不可预览（非 available 状态）或无权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415':
          description: preview not supported（MIME 不在白名单，或 zip 无 ready 网页包）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '416':
          description: Range 无法满足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/webpkg/extract:
    post:
      tags: [Files]
      operationId: extractWebpkg
      summary: 手动解包网页包（幂等重建）
      description: >-
        对文件当前版本（zip）执行安全解包；权限同「覆盖为新版本」：
        个人文件 owner、团队文件 CanWrite（editor 及以上）。重复执行幂等重建
        （先删旧解包对象再解包，public_id 保持稳定）。安全校验未通过时返回
        200 且 status=blocked（附原因）；存储级失败返回 500。上传完成时
        （WEBPKG_ENABLED，默认 true）亦会自动尝试解包，失败置 blocked，
        不影响文件本身可用性。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 解包结果（status=ready|blocked|failed|extracting）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpkgPackage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 文件无当前版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500':
          description: 存储级解包失败（status=failed，原因见 200 语义或服务器日志）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /files/{id}/unpack:
    post:
      tags: [Zip Import]
      operationId: unpackZip
      summary: zip 解为真实文件树（导入目录树）
      description: >-
        对 zip 文件（id）执行解包导入：在其所在父目录下以 zip 名（去扩展）
        创建目录（已存在同名目录则复用，幂等），逐条目经上传管线落库
        （office 内容校验、扩展名黑名单、扫描与配额自然生效；HTML/CSS/JS
        等 MIME 按扩展映射）。安全限制：条目数 ≤500、展开总量 ≤500MB、
        路径清洗复用 webpkg sanitize 规则（Zip Slip/控制字符/保留名/深度），
        结构类失败（穿越条目/超限/空 zip/非 zip）整体拒绝（400
        code=UNPACK_INVALID，不产生半提交）；单条目失败聚合进 failures
        返回（同名条目按已存在跳过并计入 skipped）。权限：文件读权限 +
        父目录写权限（个人 owner / 团队 CanWrite+ACL）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 解包结果（部分成功语义：失败条目见 failures 明细）
          content:
            application/json:
              schema:
                type: object
                required: [root_folder_id, created_files, created_folders, skipped, failures]
                properties:
                  root_folder_id: { type: string, format: uuid }
                  created_files: { type: integer }
                  created_folders: { type: integer }
                  skipped: { type: integer, description: 同名已存在而幂等跳过的条目数 }
                  failures:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        error: { type: string }
        '400':
          description: 安全校验未通过（code=UNPACK_INVALID：穿越条目/超限/空 zip/非 zip）或非法 id
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 无父目录写权限或对象不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 目标目录被同名文件占用 / 文件无当前版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500':
          description: 存储读取等内部错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /files/{id}/versions:
    get:
      tags: [Files]
      operationId: listFileVersions
      summary: 版本列表
      description: >-
        按版本号倒序列出文件全部版本（含关联对象 blob 的 status/size/sha256/mime）。
        读权限同文件元数据：个人文件 owner、团队文件任意在册成员。
        新版本不设独立写入端点，经上传链路（POST /uploads 或 tus 创建）携带 file_id 覆盖产生。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 版本列表（含当前版本）
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/FileVersionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/versions/{versionId}:
    delete:
      tags: [Files]
      operationId: deleteFileVersion
      summary: 删除非当前历史版本
      description: >-
        边界语义：current_version 指向的版本不可删（409），因此删除后文件
        剩余版本恒 ≥1；零引用 blob 延后由 janitor 物理回收。成功写审计
        file.version.delete；团队文件且删除者非 owner 时向文件 owner 发
        file.version.deleted 站内通知（偏好可关）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已删除；零引用 blob 延后由 janitor 物理回收 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 当前版本或跨文件版本不可删除 }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/versions/{versionId}/restore:
    post:
      tags: [Files]
      operationId: restoreFileVersion
      summary: 回滚当前版本
      description: >-
        将 current_version 指向该文件的既有版本（版本内容不可变，仅移动指针）；
        仅允许指向该文件的版本，否则 409（code: NOT_FILE_VERSION）。
        权限：个人文件 owner、团队文件 CanWrite（editor 及以上）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 目标版本记录 ID（versions 列表中的 id）
      responses:
        '200':
          description: 回滚后的文件元数据（current_version 已指向目标版本）
          headers:
            ETag: { schema: { type: string }, description: 基于 updated_at 的弱校验值 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileWithVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本不属于该文件；code 为 NOT_FILE_VERSION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/versions/{versionId}/content:
    get:
      tags: [Files]
      operationId: getFileVersionContent
      summary: 版本原始内容（文本版本对比）
      description: >-
        返回指定历史版本的原始内容（v2：前端版本对比）。读权限同版本列表
        （个人文件 owner、团队文件任意在册成员）；版本须属于该文件且关联
        blob 为 available（quarantined 等回 403）。响应 Content-Type 为
        blob MIME、Content-Disposition: inline、X-Content-Type-Options:
        nosniff；不支持 Range（整读，对比场景按版本完整取回）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 版本记录 ID（versions 列表中的 id）
      responses:
        '200':
          description: 版本原始内容（inline，Content-Type 为 blob MIME）
          headers:
            Content-Disposition:
              description: inline; filename="<文件名>"（RFC 5987）
              schema: { type: string }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 无读权限（团队非成员），或 blob 非 available（quarantined 等，附 status）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/tags:
    get:
      tags: [Tags]
      operationId: listFileTags
      summary: 文件上的标签（当前用户的）
      description: 列出该文件上属于当前用户的标签；文件读权限（个人 owner、团队任意在册成员）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Tags]
      operationId: addFileTag
      summary: 给文件打标签
      description: >-
        把当前用户自己的标签打到文件上；文件读权限即可（标签为用户维度
        组织视图，不改动文件内容）。幂等：重复打同一标签仍 201。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_id]
              properties:
                tag_id: { type: string, format: uuid }
      responses:
        '201':
          description: 关联已建立（或已存在，幂等）
          content:
            application/json:
              schema:
                type: object
                properties:
                  tag_id: { type: string, format: uuid }
                  file_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/tags/{tagId}:
    delete:
      tags: [Tags]
      operationId: removeFileTag
      summary: 解除文件标签（幂等）
      description: 解除当前用户自己的标签与文件的关联；未关联时同样 204。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: tagId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已解除（或本就未关联） }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/starred:
    patch:
      tags: [Tags]
      operationId: setFileStarred
      summary: 切换收藏
      description: >-
        设置 files.is_starred。取舍：星标为行级共享标记（团队文件全队
        共享，不引入 per-user 表），写权限放宽为读权限即可切换；不影响
        updated_at/ETag。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starred]
              properties:
                starred: { type: boolean }
      responses:
        '200':
          description: 更新后的文件元数据
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/restore:
    post:
      tags: [Trash]
      operationId: restoreFile
      summary: 从回收站恢复
      description: 恢复软删除文件；原父目录已删除或名称冲突时返回 409（带错误码），不静默改名。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 恢复后的元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 恢复冲突；code 为 PARENT_DELETED / NAME_CONFLICT / NOT_DELETED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /trash:
    get:
      tags: [Trash]
      operationId: listTrash
      summary: 回收站列表
      description: 列出当前用户软删除文件（含子树条目），按 deleted_at 倒序，limit 简单分页。
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 100, maximum: 1000 }
      responses:
        '200':
          description: 回收站内容
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items: { $ref: '#/components/schemas/TrashFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /trash/{id}:
    delete:
      tags: [Trash]
      operationId: purgeFile
      summary: 彻底删除（硬删除）
      description: >-
        仅软删除文件可彻底删除；级联删除子树记录，物理对象引用计数归零后删除存储对象。
        根目录不可删除（403）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已彻底删除 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 目标不在回收站；code 为 NOT_DELETED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /uploads:
    post:
      tags: [Uploads]
      operationId: createUpload
      summary: 创建上传会话（自定义分片 API）
      description: >-
        与 tus 端点并存的自定义 API。注意：此处服务启动失败类错误（如超出大小上限）
        一律映射 400，而非 tus 端点的 413。
        携带 file_id 时为「覆盖为新版本」会话：目标须为 type=file 且当前用户有
        CanWrite 权限（个人 owner / 团队 editor+），name 与 parent_id 被忽略，
        沿用目标文件现有名称与父目录；Complete 成功后内容成为该文件的新版本，
        并按 MAX_VERSIONS_PER_FILE（默认 5，upload.max_versions_per_file 热调）
        裁剪历史版本（upload.version_retention_days 时间窗内的版本不因数量
        裁剪删除；0=不启用）。
        门控：扩展名命中 upload.blocked_extensions 黑名单时 400；每用户活跃
        （非终态）会话达到 upload.max_concurrent_uploads_per_user 上限时 429
        （DB COUNT 计数，多实例共享）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size]
              properties:
                name: { type: string }
                size: { type: integer, format: int64, minimum: 0 }
                expected_sha256:
                  { type: string, description: 期望内容 SHA-256（64 位十六进制，大小写不敏感） }
                parent_id:
                  { type: string, format: uuid, description: 目标目录；缺省为用户根目录 }
                file_id:
                  { type: string, format: uuid, description: 覆盖目标文件 ID；指定时 name/parent_id 被忽略 }
      responses:
        '201':
          description: 会话已创建
          headers:
            Location:
              description: '/api/v1/uploads/{id}'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            无 CanWrite 权限（团队 viewer/非成员）、版本覆盖能力未启用，或
            存储配额超限——后者 body 为 {error, code: QUOTA_EXCEEDED}
            （C3：已用含回收站软删文件，彻底删除后才释放配额）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: file_id 目标不存在（或个人文件非 owner，不泄露存在性）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /uploads/{id}:
    get:
      tags: [Uploads]
      operationId: getUpload
      summary: 查询上传会话
      description: 轮询上传状态（含后台自动完成后的终态）；响应为 UploadSession 的子集（不含 retry_count）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 会话状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Uploads]
      operationId: patchUpload
      summary: 追加上传数据
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          description: 必须等于服务端当前 offset，否则 409
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 追加成功；响应头 Upload-Offset 为新偏移
          headers:
            Upload-Offset: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /uploads/{id}/complete:
    post:
      tags: [Uploads]
      operationId: completeUpload
      summary: 完成上传
      description: >-
        校验哈希 → 病毒扫描（如启用）→ 落库为文件版本。终态幂等：available 重复调用
        返回 200；quarantined / failed 返回 409（code 分别为 QUARANTINED / FAILED）。
        扩展名黑名单复检（会话期间 upload.blocked_extensions 可能变更）：命中时
        400 且会话置 failed。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 完成后的会话（status=available）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '扫描被隔离 / 校验失败 / 会话不可完成；code: QUARANTINED 或 FAILED'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tus/files:
    options:
      tags: [tus]
      operationId: tusOptions
      summary: tus 能力发现
      description: >-
        响应头：Tus-Resumable: 1.0.0、Tus-Version: 1.0.0、
        Tus-Extension: creation,expiration、Tus-Max-Size（配置了上限时返回）。
        不支持 concatenation / termination / checksum 扩展。
      security: []
      responses:
        '204':
          description: 能力宣告（无响应体）
          headers:
            Tus-Resumable: { schema: { type: string, const: '1.0.0' } }
            Tus-Version: { schema: { type: string, const: '1.0.0' } }
            Tus-Extension: { schema: { type: string, const: 'creation,expiration' } }
            Tus-Max-Size:
              description: 单次上传长度上限（字节）；未配置上限时不返回该头
              schema: { type: integer, format: int64 }
    post:
      tags: [tus]
      operationId: tusCreate
      summary: 创建 tus 上传（creation 扩展）
      description: >-
        Upload-Metadata 为逗号分隔的 "key base64value" 对（value 可整体省略）；
        filename 键必填；parent_id（UUID）与 sha256 可选，其余键原样保存并在 HEAD 回显。
        未指定 parent_id 时落入用户根目录。
        携带 file_id（UUID，base64 编码）时为「覆盖为新版本」会话：目标须为
        type=file 且当前用户有 CanWrite 权限，filename/parent_id 被忽略，
        沿用目标文件现有名称与父目录；写满自动完成后内容成为新版本并按
        MAX_VERSIONS_PER_FILE 裁剪历史。
      parameters:
        - name: Upload-Length
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          description: 上传总字节数；超过 Tus-Max-Size 时返回 413
        - name: Upload-Metadata
          in: header
          required: true
          schema: { type: string }
          description: >-
            逗号分隔的 "key base64value" 对；filename 必填（base64 编码），
            可选 parent_id、sha256（base64 编码的 64 位十六进制）、
            file_id（base64 编码的 UUID，覆盖为新版本）
        - name: Tus-Resumable
          in: header
          required: false
          schema: { type: string, const: '1.0.0' }
          description: 协议版本头；当前实现未强制校验请求头
      responses:
        '201':
          description: 上传已创建
          headers:
            Location:
              description: '/api/v1/tus/files/{id}'
              schema: { type: string }
            Upload-Offset: { schema: { type: integer, format: int64, const: 0 } }
            Upload-Expires:
              description: 会话过期时间（RFC 7231 日期格式）
              schema: { type: string }
            Tus-Resumable: { schema: { type: string, const: '1.0.0' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            无 CanWrite 权限（团队 viewer/非成员）或存储配额超限（C3；
            tus 协议无 JSON code 载荷，配额超限文案固定为 storage quota
            exceeded）。
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: file_id 目标不存在（或个人文件非 owner，不泄露存在性）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tus/files/{id}:
    head:
      tags: [tus]
      operationId: tusHead
      summary: 查询上传偏移与元数据
      description: >-
        无响应体。响应头：Upload-Offset、Upload-Length、Upload-Metadata（创建时回显原始头）、
        Cache-Control: no-store、Tus-Resumable。终态会话仍可查询；
        uploading 且已过期返回 410；不存在或非本人资源一律 404（不泄露存在性）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 当前偏移与长度（无响应体）
          headers:
            Upload-Offset: { schema: { type: integer, format: int64 } }
            Upload-Length: { schema: { type: integer, format: int64 } }
            Upload-Metadata:
              description: 创建时的原始 Upload-Metadata 头（无则不返回）
              schema: { type: string }
            Cache-Control: { schema: { type: string, const: no-store } }
            Tus-Resumable: { schema: { type: string, const: '1.0.0' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [tus]
      operationId: tusPatch
      summary: 追加数据块
      description: >-
        Content-Type 必须为 application/offset+octet-stream（否则 415）；
        Upload-Offset 请求头必须等于服务端当前偏移（否则 409）；
        请求体字节数不得超过剩余长度（否则 400）。
        偏移写满后服务端后台自动完成（verify → scan → available），
        可通过 GET /uploads/{id} 轮询状态；终态会话返回 410。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          description: 当前服务端偏移
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: 追加成功（无响应体）
          headers:
            Upload-Offset: { schema: { type: integer, format: int64 } }
            Upload-Expires: { schema: { type: string } }
            Tus-Resumable: { schema: { type: string, const: '1.0.0' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shares:
    post:
      tags: [Shares]
      operationId: createShare
      summary: 创建分享
      description: >-
        visibility=public（默认）：生成公开 token，明文 token 与 share_url 仅在本次
        响应返回一次（库中只存 SHA-256 哈希）；此时 user_ids / team_ids 必须为空。
        visibility=private：不生成 token，按 user_ids / team_ids 显式授权。
        password 仅公开分享可用（4-64 字符，库中只存 SHA-256(password||share_id)
        哈希，响应仅返回 has_password 标记）；watermark_enabled / watermark_text
        未显式指定时采用系统设置默认（share.default_watermark /
        share.watermark_text，模板支持 {email}/{date}/{name} 占位符，公开访问
        的 {email} 渲染为脱敏 IP 前缀）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id]
              properties:
                file_id: { type: string, format: uuid }
                permission:
                  { type: string, enum: [view, download], default: view }
                visibility:
                  { type: string, enum: [public, private], default: public }
                user_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: 私有分享：显式授权的用户列表
                team_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: 私有分享：授权的团队列表（成员可访问）
                expires_in:
                  { type: integer, format: int64, description: 有效期（秒）；缺省或 0 表示永久 }
                max_downloads:
                  { type: integer, description: 最大下载次数；缺省表示不限 }
                password:
                  type: string
                  minLength: 4
                  maxLength: 64
                  description: >-
                    公开分享访问密码（明文仅本请求可见，库中只存加盐哈希）；
                    私有分享传入返回 400
                watermark_enabled:
                  { type: boolean, description: 水印开关；缺省用系统设置 share.default_watermark（默认 true） }
                watermark_text:
                  type: string
                  maxLength: 256
                  description: >-
                    自定义水印模板（{email}/{date}/{name} 占位符）；缺省用系统
                    设置 share.watermark_text（默认 "{date} {name}"）
      responses:
        '201':
          description: >-
            分享已创建；公开分享额外返回 token 与 share_url
            （/api/v1/public/shares/{token}，仅此一次），私有分享不含两者
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedShare' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 文件不可分享（如软删除中）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Shares]
      operationId: listShares
      summary: 我的分享列表
      description: >-
        按创建时间倒序列出当前用户创建的分享（公开与私有）；
        每条附 file_name（文件已删除时为空串）与 visibility（public|private）。
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 100, maximum: 1000 }
      responses:
        '200':
          description: 分享列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shares/shared-with-me:
    get:
      tags: [Shares]
      operationId: listSharedWithMe
      summary: 与我共享的列表
      description: >-
        分享给当前用户的有效私有分享列表（share_users 显式授权，或当前用户属于
        share_teams 任一授权团队；成员关系实时判定）。公开分享、已撤销、已过期、
        达下载上限的分享，以及文件已删除/不可用的条目不返回；按 created_at 倒序。
        owner_username 为分享者用户名（不含 email，避免泄露）。
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 100, maximum: 1000 }
      responses:
        '200':
          description: 与我共享的分享列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedWithMeList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shares/{id}:
    get:
      tags: [Shares]
      operationId: getShare
      summary: 分享详情与访问统计
      description: >-
        仅分享创建者可查。返回脱敏全字段（不含明文 token 与密码哈希，仅
        has_password 标记）+ 关联文件名 + 访问统计（file_access_events 聚合）：
        total_access 事件总数、unique_visitors 独立访客数（distinct 哈希 IP）、
        recent 最近 20 条访问记录（IP 已脱敏为前缀，如 203.0.*；user_agent
        截断 512 字节）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 分享详情（含统计）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Shares]
      operationId: updateShare
      summary: 修改分享（有效期/下载上限/水印）
      description: >-
        仅分享创建者可改。可修改字段：expires_in（秒；0 表示改为永久）、
        max_downloads（0 表示改为不限）、watermark_enabled、watermark_text
        （空串表示恢复系统默认模板）；未提供的字段保持不变。permission、
        visibility、授权名单与密码不可改（密码变更请撤销后重建分享）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                expires_in:
                  { type: integer, format: int64, minimum: 0, description: 新有效期（秒）；0 表示永久 }
                max_downloads:
                  { type: integer, minimum: 0, description: 新下载上限；0 表示不限 }
                watermark_enabled: { type: boolean }
                watermark_text:
                  { type: string, maxLength: 256, description: 新水印模板；空串恢复默认 }
      responses:
        '200':
          description: 更新后的分享记录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Shares]
      operationId: revokeShare
      summary: 撤销分享
      description: 幂等；仅分享创建者可撤销。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已撤销 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shares/{id}/files/{fid}:
    get:
      tags: [Shares]
      operationId: shareFileInfo
      summary: 私有分享文件元数据（登录用户）
      description: >-
        分享 owner 可直接访问；其他登录用户须被显式授权（user_ids）或属于授权团队
        （team_ids），否则 403。公开分享不以用户入口开放：非 owner 访问一律 404
        （公开分享按 token 解析，404 语义不泄露分享存在性）。仅暴露安全字段，
        不含 owner、内部 ID 与存储路径。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 分享 ID
        - name: fid
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 被分享的文件 ID
      responses:
        '200':
          description: 文件元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareFileMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 当前用户未被授权访问该私有分享
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shares/{id}/files/{fid}/download:
    get:
      tags: [Shares]
      operationId: shareFileDownload
      summary: 私有分享下载（登录用户）
      description: >-
        需 download 权限；成功原子递增分享与文件 download_count（受 max_downloads 限制）；
        存储内容读取失败（500）时补偿回退已消耗的计数。支持单区间 Range 与
        Content-Disposition: attachment。授权语义同元数据端点（公开分享非 owner
        一律 404；私有分享未授权 403）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: fid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 全量内容
          headers:
            Content-Disposition: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '416':
          description: Range 无法满足
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shares/{id}/files/{fid}/preview:
    get:
      tags: [Shares]
      operationId: shareFilePreview
      summary: 私有分享预览（登录用户）
      description: >-
        view 与 download 权限均可预览；不消耗分享 download_count；MIME 白名单同
        个人预览。授权语义同元数据端点（公开分享非 owner 一律 404；私有分享
        未授权 403）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: fid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 内联内容
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '416':
          description: Range 无法满足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/shares/{token}:
    get:
      tags: [Public Shares]
      operationId: publicShareInfo
      summary: 公开分享元数据（无认证）
      description: >-
        按 token 匹配（库中只存哈希）；无认证、按 IP 独立限流。
        仅暴露安全字段。未启用则 404；过期/撤销/达下载上限 410。
        密码保护分享须先经 POST /public/shares/{token}/verify 取得会话
        cookie（docflow_sa_<token前8>，HttpOnly、SameSite=Lax、Path=
        /api/v1/public、1 小时），否则 401 code=PASSWORD_REQUIRED。
        附带水印信息：watermark_enabled 与 watermark_text（模板已按访问者
        渲染：{email}/{ip} → 脱敏 IP 前缀、{date} → 当天日期、{name} → 文件名）。
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
          description: 创建公开分享时返回的一次性明文 token（URL-safe base64）
      responses:
        '200':
          description: 文件元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareFileMeta' }
        '401':
          description: 分享受密码保护且未携带有效会话 cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 文件当前不可用（对象非 available 状态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/shares/{token}/verify:
    post:
      tags: [Public Shares]
      operationId: publicShareVerify
      summary: 校验公开分享密码（无认证）
      description: >-
        密码正确时创建 1 小时有效的访问会话，经 HttpOnly cookie
        （docflow_sa_<token前8>，Path=/api/v1/public，SameSite=Lax）下发，
        此后 info/download/preview 携带该 cookie 即可访问。密码错误 401；
        按 IP+token 每分钟限流 5 次（防暴力猜测）；未设密码 400；不存在 404、
        失效 410。库中只存 SHA-256(password||share_id)，明文密码不落库。
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, description: 分享访问密码 }
      responses:
        '200':
          description: 校验通过；响应携带会话 cookie
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }
        '400':
          description: 请求非法或分享未启用密码保护
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 密码错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/shares/{token}/download:
    get:
      tags: [Public Shares]
      operationId: publicShareDownload
      summary: 公开分享下载（无认证）
      description: >-
        校验分享有效性与对象可用性；成功原子递增分享与文件 download_count，
        并写入访问事件（action=download，IP 以加盐哈希存储）；
        存储内容读取失败（500）时补偿回退已消耗的计数；支持单区间 Range 与
        Content-Disposition: attachment。密码保护分享须先经 verify 取得会话
        cookie（未携带时 401 code=PASSWORD_REQUIRED，且不消耗下载计数）。
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 全量内容
          headers:
            Content-Disposition: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401':
          description: 分享受密码保护且未携带有效会话 cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 分享不允许下载或对象不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '416':
          description: Range 无法满足
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/shares/{token}/download.zip:
    get:
      tags: [Public Shares]
      operationId: publicShareDownloadZip
      summary: 目录分享打包下载（流式 zip，无认证）
      description: >-
        分享根须为目录（单文件分享 400）且分享具 download 权限（view 403，
        不消耗计数）。子树遍历与 zip 流式写出规则同 GET /files/{id}/download.zip
        （soft-delete 排除、entry 为相对分享根路径、目录含尾斜杠、≤2000 条目
        /≤2GB 超限 413）。成功消耗一次下载额度（原子消费与限额语义同单文件
        下载：达上限/撤销/过期 410）。密码保护分享须先经 verify 取得会话
        cookie（未携带时 401 code=PASSWORD_REQUIRED）。
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: zip 归档流
          headers:
            Content-Disposition:
              description: attachment; filename=<分享根目录名>.zip（RFC 5987）
              schema: { type: string }
          content:
            application/zip:
              schema: { type: string, format: binary }
        '400':
          description: 分享根不是目录
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: 分享受密码保护且未携带有效会话 cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 分享不允许下载（permission=view）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '413':
          description: 子树规模超限（条目数 >2000 或总大小 >2GB）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/shares/{token}/preview:
    get:
      tags: [Public Shares]
      operationId: publicSharePreview
      summary: 公开分享预览（无认证）
      description: >-
        view 与 download 权限均可预览；不消耗分享 download_count；
        MIME 白名单与安全头同个人预览。网页包联动同个人预览：zip 且存在
        ready 解包结果时返回 200 JSON（WebpkgPreview）。预览成功时写入
        访问事件（action=preview）。密码保护分享须先经 verify 取得会话
        cookie（未携带时 401 code=PASSWORD_REQUIRED）。
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 内联内容；zip 网页包为 WebpkgPreview JSON
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: '#/components/schemas/WebpkgPreview' }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '401':
          description: 分享受密码保护且未携带有效会话 cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: 对象不可用或分享不允许访问
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '416':
          description: Range 无法满足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/shares/{token}/tree/*path:
    get:
      tags: [Public Shares]
      operationId: publicShareTree
      summary: 目录分享树（无认证）——子路径清单/文件元数据 + raw grant 签发
      description: >-
        目录分享（根为 folder 的公开分享，创建入口同 POST /shares）的树
        访问：path 为空（或尾斜杠）返回分享根目录清单；命中子目录返回该
        目录直接子项（name/type/path/size/mime_type，path 为相对分享根的
        canonical 路径）；命中文件返回元数据。撤销/过期/达上限 410；根已
        删除 410；子路径不存在/穿越段统一 404。密码保护分享复用既有
        verify 会话 cookie（未携带时 401 code=PASSWORD_REQUIRED）。
        响应附 raw_base（/raw/share/{token}/{grant}：purpose=raw-share、
        绑定 share_id 的 10 分钟 HMAC grant）与 grant_expires_at；子资源
        内容经 GET /raw/share/{token}/{grant}/{path} 获取（契约外内容域
        端点，见文件头说明；每请求复查分享有效性与 blob 可用，不消耗
        download_count——显式下载仍走 download 端点）。
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: path
          in: path
          required: true
          description: 分享根内相对路径（"/"分隔；空路径即分享根）
          schema: { type: string }
      responses:
        '200':
          description: 目录清单（type=folder）或文件元数据（type=file）
          content:
            application/json:
              schema:
                type: object
                required: [name, type, permission, raw_base, grant_expires_at]
                properties:
                  name: { type: string }
                  type: { type: string, enum: [file, folder] }
                  path: { type: string, description: 相对分享根的 canonical 路径（根目录为空） }
                  permission: { type: string, enum: [view, download] }
                  expires_at: { type: [string, 'null'], format: date-time }
                  entries:
                    type: array
                    description: type=folder 时的直接子项清单
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        type: { type: string, enum: [file, folder] }
                        path: { type: string }
                        size: { type: integer }
                        mime_type: { type: string }
                  size: { type: integer, description: type=file 时的当前版本大小 }
                  mime_type: { type: string }
                  raw_base: { type: string, description: '/raw/share/{token}/{grant}（grant 已含）' }
                  grant_expires_at: { type: string, format: date-time }
        '401':
          description: 分享受密码保护且未携带有效会话 cookie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: raw 授权签发器未配置
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /teams:
    post:
      tags: [Teams]
      operationId: createTeam
      summary: 创建团队
      description: 创建者自动成为 owner 成员，并在同一事务内生成团队根目录；团队名全局唯一。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  { type: string, maxLength: 100, description: 非空、无控制字符 }
                description: { type: string }
      responses:
        '201':
          description: 团队已创建（含 root_folder_id）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedTeam' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 团队名已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Teams]
      operationId: listTeams
      summary: 我的团队列表
      description: 当前用户所属（成员或 owner）的团队。
      responses:
        '200':
          description: 团队列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /teams/{id}:
    patch:
      tags: [Teams]
      operationId: updateTeam
      summary: 重命名团队（仅 owner）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string, maxLength: 100 }, description: { type: string } } }
      responses:
        '200': { description: 团队已更新 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Teams]
      operationId: deleteTeam
      summary: 删除团队（软删除，仅 owner）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: 团队已删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /teams/{id}/roles:
    get:
      tags: [Teams]
      operationId: listTeamRoles
      summary: 列出自定义角色（仅 owner）
      description: 返回团队自定义角色列表（含 member_count 引用统计与 permissions 勾选）。
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamRoleList' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Teams]
      operationId: createTeamRole
      summary: 创建自定义角色（仅 owner）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
                permissions: { $ref: '#/components/schemas/TeamRolePermissions' }
      responses:
        '201':
          description: 角色已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamRole' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 同团队角色名已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /teams/{id}/roles/{role_id}:
    patch:
      tags: [Teams]
      operationId: updateTeamRole
      summary: 更新自定义角色（仅 owner）
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: role_id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
                permissions: { $ref: '#/components/schemas/TeamRolePermissions' }
      responses:
        '204': { description: 已更新 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Teams]
      operationId: deleteTeamRole
      summary: 删除自定义角色（仅 owner）
      description: 仍有成员引用该角色时返回 409（须先改派成员角色）。
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }, { name: role_id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: 已删除 }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 角色仍被成员引用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /teams/{id}/members:
