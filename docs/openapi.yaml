          required: true
          schema: { type: string, format: uuid }
        - name: parent_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 团队目录 ID；缺省为团队根目录
        - name: tag_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 标签过滤（须为当前用户的标签，否则 404）
        - name: starred
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
          description: 收藏过滤
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [name, updated_at, size], default: name }
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 100, maximum: 1000 }
      responses:
        '200':
          description: 目录内容（含所属父目录 ID）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamFileList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /teams/{id}/folders:
    post:
      tags: [Teams]
      operationId: createTeamFolder
      summary: 创建团队目录（editor 及以上角色）
      description: 在团队根目录（缺省）或指定团队目录下创建目录；viewer 返回 403。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parent_id:
                  { type: string, format: uuid, description: 团队目录 ID；缺省为团队根目录 }
      responses:
        '201':
          description: 目录已创建
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /folders/{id}/acl:
    get:
      tags: [Teams]
      operationId: getFolderACL
      summary: 查看目录的路径级 ACL 条目
      description: >-
        返回团队作用域目录（含团队根目录）的全部 folder_acl 条目（附 subject
        名称解析：user → username、team → 团队名）。仅文件夹所在团队 owner
        或系统 admin 可读；个人空间目录 400（NOT_TEAM_FOLDER）。求值语义
        （read/write/delete/share 判定先走 ACL 链）见 PUT 端点描述。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 目录 ID（团队根目录或其子目录）
      responses:
        '200':
          description: ACL 条目列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderACL' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      tags: [Teams]
      operationId: replaceFolderACL
      summary: 整体替换目录的 ACL 条目（空数组即清空）
      description: >-
        整体替换目录的全部 folder_acl 条目（事务内删旧插新）。仅团队作用域
        目录可设置（个人空间 400）；权限：文件夹所在团队 owner 或系统 admin。
        求值规则：沿 parent 链自目标文件/目录向上到团队根收集条目，最近节点
        优先；同节点 user 条目优先于 team 条目、deny 优先于 allow；链上无
        适用条目（含未设置任何 ACL 的目录）回退团队角色判定——无 ACL 时
        行为与既有权限完全一致。审计 acl.update。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 目录 ID（团队根目录或其子目录）
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FolderACLUpdate' }
      responses:
        '200':
          description: 替换后的条目列表（与 GET 同构）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolderACL' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /resolve/{nsType}/{nsScope}/*path:
    get:
      tags: [Paths]
      operationId: resolvePath
      summary: 路径解析（登录）——返回文件元数据与 view/edit/raw 短期授权 URL
      description: >-
        按命名空间（personal：scopeID 必须等于当前用户，取其个人根目录；
        team：须为团队成员，取团队根目录）解析 "/" 分隔的相对路径：段校验
        与上传建名一致（NFC、拒绝空/.././斜杠/反斜杠/控制字符/Cf/二次编码
        变体，≤32 段），逐段按 parent_id+lower(name) 匹配（大小写不敏感、
        软删除不可见、中间段须目录、环防御）。mode=view 按读权限（个人
        owner / 团队成员或 ACL read）；mode=edit 额外按写权限（CanWrite/
        ACL write，viewer 403）。响应附 view_url（/view/... 前端路由）与
        edit_url（/edit/... 前端路由）、raw_url（/raw/auth/{grant}/...，
        10 分钟 HMAC grant 绑定 purpose=raw/user/ns/scope；目录以尾斜杠
        结尾供 index.html 解析；目录且 origin_content=1 时以
        CONTENT_PUBLIC_BASE_URL 绝对化）与 grant_expires_at。raw_url 由
        前端查看器直接使用（/raw/* 为契约外内容域端点，见文件头说明；
        不提供 /raw/view 登录态端点）。mime_type 为文件当前版本 MIME
        （目录或无版本时为 null）。
      parameters:
        - name: nsType
          in: path
          required: true
          schema: { type: string, enum: [personal, team] }
        - name: nsScope
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: path
          in: path
          required: true
          description: 命名空间内的相对路径（"/"分隔；空路径即根目录）
          schema: { type: string }
        - name: mode
          in: query
          required: false
          schema: { type: string, enum: [view, edit], default: view }
        - name: origin_content
          in: query
          required: false
          description: '1 时 raw_url 以 CONTENT_PUBLIC_BASE_URL 绝对化（未配置回退相对路径）'
          schema: { type: string, enum: ['1'] }
      responses:
        '200':
          description: 解析结果
          content:
            application/json:
              schema:
                type: object
                required: [file_id, name, type, canonical_path, view_url, edit_url, raw_url, grant_expires_at]
                properties:
                  file_id: { type: string, format: uuid }
                  name: { type: string }
                  type: { type: string, enum: [file, folder] }
                  mime_type: { type: [string, 'null'] }
                  canonical_path: { type: string, description: 按实际存储名称重建的相对路径 }
                  view_url: { type: string }
                  edit_url: { type: string }
                  raw_url: { type: string }
                  grant_expires_at: { type: string, format: date-time }
        '400':
          description: 非法命名空间/scope/路径段（含穿越与二次编码变体）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: mode=edit 且无写权限（团队 viewer 等）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: 路径解析能力未配置（RAW_URL 签发器未注入）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /files/{id}/ai/summary:
    post:
      tags: [AI]
      operationId: fileAISummary
      summary: 生成文件当前版本的 AI 摘要
      description: >-
        读取文件当前版本内容并调用 OpenAI 兼容 /chat/completions 生成摘要
        （system 提示要求与文件相同语言、300 字内，max_tokens 500，超时 60s）。
        前置条件：读权限（个人 owner / 团队在册成员 + 路径级 ACL）、文件为
        文本类（search.IsTextIndexable 语义：mime text/*、json/xml 或扩展名
        白名单）、当前版本 blob available、内容 ≤100KB（超出拒绝，不截断）。
        高频端点：不记录审计。AI_ENABLED=false 时 503 AI_DISABLED。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 摘要结果
          content:
            application/json:
              schema:
                type: object
                required: [summary]
                properties:
                  summary: { type: string, description: AI 生成的摘要文本 }
        '400':
          description: 非文本文件（code=NOT_TEXT_FILE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 当前版本未 available（扫描中/隔离等）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413':
          description: 内容超过 100KB 摘要上限（code=CONTENT_TOO_LARGE）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '502':
          description: 上游请求失败（含超时）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503':
          description: AI 摘要未启用（code=AI_DISABLED）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /onlyoffice/config:
    get:
      tags: [onlyoffice]
      operationId: getOnlyOfficeConfig
      summary: 集成可用性探测（前端据此显示「编辑」入口）
      description: >-
        返回 ONLYOFFICE 集成状态与浏览器可达的 DocumentServer 地址（前端加载
        `{server_url}/web-apps/apps/api/documents/api.js`）：server_url 优先取
        ONLYOFFICE_PUBLIC_URL（如经反向代理暴露的
        https://example.com/onlyoffice，本地直连可为 http://localhost:8081），
        未设置时回退 ONLYOFFICE_SERVER_URL（注意：该值为服务间内网地址时，
        浏览器可能无法解析加载）。该端点恒注册：ONLYOFFICE_ENABLED=false 时
        返回 `{enabled:false, server_url:null}`（不暴露内部 URL），其余
        onlyoffice 端点此时不注册（404）。
      responses:
        '200':
          description: 集成状态
          content:
            application/json:
              schema:
                type: object
                required: [enabled, server_url]
                properties:
                  enabled: { type: boolean }
                  server_url:
                    type: [string, 'null']
                    description: 浏览器可达的 DocumentServer 地址
                      （ONLYOFFICE_PUBLIC_URL 优先，回退 ONLYOFFICE_SERVER_URL）；
                      禁用时为 null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /onlyoffice/session:
    post:
      tags: [onlyoffice]
      operationId: createOnlyOfficeSession
      summary: 生成编辑器配置（DocsAPI.DocEditor 可直接使用）
      description: >-
        校验读权限（authorizeFileAccess 同规则：个人文件 owner、团队文件任意
        在册成员）且当前版本 blob 为 available。editorConfig.mode 按写权限判定：
        可写（个人 owner / 团队 CanWrite，与「覆盖为新版本」目标校验同语义）时
        为 edit 且 document.permissions.edit=true；只读用户为 view 且
        permissions.edit=false（服务端未接线写授权器时保守降级 view）。
        document.key 绑定 `file_id:version_id`（编辑会话与版本绑定）；
        document.url 为 5 分钟有效期的签名下载 URL
        （ONLYOFFICE_DOWNLOAD_URL_BASE 前缀）；token 为对 document+
        editorConfig 整体签名的 JWT（HS256，ONLYOFFICE_JWT_SECRET，TTL 5 分钟，
        aud=onlyoffice-config，回调端点拒绝该用途 token）。集成未启用
        （ONLYOFFICE_ENABLED=false）时路由不注册（404）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id]
              properties:
                file_id: { type: string, format: uuid }
      responses:
        '200':
          description: >-
            DocsAPI.DocEditor 配置（documentType/document/editorConfig/token；
            editorConfig 含 mode（edit|view，按写权限判定）、user.id/name、
            lang=zh 与 callbackUrl；document.permissions.edit 与 mode 一致）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 无权限或当前版本不可用（非 available 状态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 文件无当前版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/from-template:
    post:
      tags: [Files]
      operationId: createOfficeTemplate
      summary: 创建空白 Office 模板
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind: { type: string, enum: [word, spreadsheet, presentation, docx, xlsx, pptx] }
                name: { type: string }
                parent_id: { type: string, format: uuid }
      responses:
        '201': { description: 创建成功 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /onlyoffice/download/{fileId}:
    get:
      tags: [onlyoffice]
      operationId: onlyofficeDownload
      summary: DocumentServer 回源下载（签名 token，无 Bearer）
      description: >-
        供 DocumentServer 拉取文档内容（无用户会话）。token 为 HS256 JWT：
        sub=file_id、v=版本 ID、aud=onlyoffice-download、exp 5 分钟，且须与
        路径 fileId、查询 v 一致；校验通过后流式返回该版本内容（单区间 Range 与
        Content-Disposition: attachment 同个人下载，不计入 download_count）。
        被隔离/不可用 blob 一律拒绝（403）。独立按 IP 轻限流
        （ONLYOFFICE_RATE_LIMIT_PER_MIN）。
      security: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: 签名下载 token（session 接口的 document.url 内嵌）
        - name: v
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: 版本记录 ID（与 token 的 v 声明一致）
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 全量内容
          headers:
            Content-Disposition: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: token 缺失、签名不符、过期、用途（aud）不符或参数绑定失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: blob 非 available 状态（隔离/不可用）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416':
          description: Range 无法满足
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /onlyoffice/download/{fileId}/{filename}:
    get:
      tags: [onlyoffice]
      operationId: onlyofficeDownloadNamed
      summary: DocumentServer 回源下载（带文件名兼容路由）
      security: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: filename
          in: path
          required: true
          schema: { type: string }
        - name: v
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200': { description: 文件内容 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /onlyoffice/callback:
    post:
      tags: [onlyoffice]
      operationId: onlyofficeCallback
      summary: 保存回调（DocumentServer → DocFlow，无 Bearer）
      description: >-
        DocumentServer command service 回调。JWT 校验取 body.token 或
        Authorization: Bearer 头（HS256，ONLYOFFICE_JWT_SECRET）。token 用途
        隔离：aud 为 onlyoffice-config 或 onlyoffice-download 的 token 一律
        拒绝（编辑配置/下载 token 不得混用为回调 token；DS 自签回调 token
        通常无 aud，允许通过）。status/key/url 以验签后的 claims 为唯一信任
        源：claims 缺失必需声明（status、key，保存类状态另需 url）即拒绝，
        不回退未签名 body。status=2/6：先做写鉴权（claims users[0] 为 actor，
        按「覆盖为新版本」目标校验同语义判定写权限；未接线授权器时 fail
        closed 拒绝），通过后以幂等键 (file_id, document.key, url) 抢占
        （重复回调不重复建版本），仅接受与 ONLYOFFICE_SERVER_URL 同源的下载
        URL（scheme/host/port 全等，防 SSRF），下载后作为新版本保存（临时
        key 转正、SHA-256 校验、复用内容去重）。
        status=4 仅清理（写 onlyoffice.cleanup 审计）；其他状态空处理。
        始终返回 HTTP 200：成功 {"error":0}，失败 {"error":1}（协议约定，
        非 200 会触发 DocumentServer 重试）。独立按 IP 轻限流。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string, description: document.key（file_id:version_id） }
                status: { type: integer, description: '1=编辑中 2=保存 3=错误 4=关闭 6=强制保存 7=强制保存错误' }
                url: { type: string, description: 新版本下载 URL（仅 status=2/6 使用） }
                users: { type: array, items: { type: string } }
                token: { type: string, description: 回调体整体签名的 JWT }
      responses:
        '200':
          description: '处理结果（协议体）：成功 error=0，失败 error=1'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: integer, enum: [0, 1] }
        '429': { $ref: '#/components/responses/RateLimited' }

  /drawio/config:
    get:
      tags: [drawio]
      operationId: getDrawioConfig
      summary: 图表编辑集成可用性探测（前端据此显示「图表」入口）
      description: >-
        返回 draw.io 集成状态与浏览器可达的编辑器地址（前端以 iframe embed
        模式加载 `{url}?embed=1&proto=json&spin=1`）：url 优先取
        DRAWIO_PUBLIC_URL（如经反向代理暴露的 https://example.com/drawio，
        本地直连可为 http://localhost:8082），未设置时回退 DRAWIO_SERVER_URL
        （注意：该值为服务间内网地址时，浏览器可能无法加载）。该端点恒注册：
        DRAWIO_ENABLED=false 时返回 `{enabled:false, url:null}`（不暴露内部
        URL）。编辑与保存均在浏览器侧完成（postMessage JSON 协议：
        receive init → send load{xml}；receive save{xml} → 前端经 POST
        /uploads 携带 file_id 把导出 XML 覆盖为新版本），后端无其他
        drawio 端点；新建空图表文件亦直接走普通上传（初始模板
        <mxfile><diagram/></mxfile>）。
      responses:
        '200':
          description: 集成状态
          content:
            application/json:
              schema:
                type: object
                required: [enabled, url]
                properties:
                  enabled: { type: boolean }
                  url:
                    type: [string, 'null']
                    description: 浏览器可达的 draw.io 编辑器地址
                      （DRAWIO_PUBLIC_URL 优先，回退 DRAWIO_SERVER_URL）；
                      禁用时为 null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/settings:
    get:
      tags: [Admin]
      operationId: listAdminSettings
      summary: 列出全部系统设置（仅 admin）
      description: >-
        返回全部内置键的当前值（未设置时为默认值）、类型、描述、默认值与
        生效方式（effect：immediate/new_session/restart）。仅非密钥类运行时
        配置；密钥类（JWT/S3/SMTP 凭据等）一律走环境变量，不经
        system_settings 暴露——另附 secrets 只读状态探针（各密钥类 env
        是否已配置，绝不回显值）与 mail 邮件通道只读状态（SMTP 为
        env-only，见 MailEnvStatus）。
      responses:
        '200':
          description: 设置列表与凭据配置状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: array
                    items: { $ref: '#/components/schemas/Setting' }
                  secrets:
                    type: object
                    description: 密钥类配置的只读状态（env 非空 = true）；不回显值
                    additionalProperties:
                      type: boolean
                    example:
                      jwt_secret: true
                      smtp_password: false
                      s3_secret_key: false
                      onlyoffice_jwt_secret: false
                  mail:
                    allOf: { $ref: '#/components/schemas/MailEnvStatus' }
                    description: 邮件通道（SMTP）env-only 只读状态
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/tls:
    get:
      tags: [Admin]
      operationId: getTls
      summary: 查询 HTTPS 运行时状态（仅 admin）
      description: >-
        返回当前 TLS 模式（http 明文 / auto 域名+ACME 自动签发 /
        internal 域名或 IP+Caddy 内部 CA 自签 / custom 域名或 IP+已上传的
        自定义证书）与站点域名；custom 模式附已上传证书摘要（CN/有效期/SAN，
        未上传为 null）。managed=false 表示未配置 CADDY_ADMIN_ADDR（功能
        关闭，TLS 由部署配置 APP_DOMAIN 决定），页面应降级为只读提示。
      responses:
        '200':
          description: TLS 状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode:
                    type: string
                    enum: [http, auto, internal, custom]
                  domain:
                    type: string
                    description: auto/internal/custom 模式的站点域名或 IP；http 恒空
                  managed:
                    type: boolean
                    description: 是否接入运行时切换（CADDY_ADMIN_ADDR 已配置）
                  cert:
                    nullable: true
                    description: 已上传自定义证书的摘要（custom 模式用；未上传为 null）
                    allOf: { $ref: '#/components/schemas/TlsCert' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    put:
      tags: [Admin]
      operationId: updateTls
      summary: 切换 HTTPS 模式（仅 admin，热生效）
      description: >-
        渲染与 deploy/Caddyfile 同构的配置并经 Caddy admin API（POST /load）
        热下发，立即生效且无需重启容器。原子性：Caddy 拒绝配置（非法域名、
        ACME 不可达等）时保持旧配置、不落库。auto 模式要求公网域名（公共
        CA 不签发 IP）；internal 允许域名或 IP（自签证书，浏览器不受信告警）；
        custom 允许域名或 IP，要求先经 POST /admin/tls/cert 上传证书
        （tls 指令经 CADDY_TLS_CERT/KEY 指向共享卷路径）。持久化于
        tls_state（migration 033）；caddy 容器单独重启后由 backend
        启动对账重新下发。切换后注意 .env 的 COOKIE_SECURE 与模式匹配。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  type: string
                  enum: [http, auto, internal, custom]
                domain:
                  type: string
                  description: auto/internal/custom 必填；host 或 host:port，禁止 scheme/路径
            example:
              mode: internal
              domain: 192.168.1.10
      responses:
        '200':
          description: 已生效的 TLS 状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [http, auto, internal, custom] }
                  domain: { type: string }
                  managed: { type: boolean }
                  cert:
                    nullable: true
                    allOf: { $ref: '#/components/schemas/TlsCert' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: 未配置 CADDY_ADMIN_ADDR（功能关闭）

  /admin/tls/cert:
    post:
      tags: [Admin]
      operationId: uploadTlsCert
      summary: 上传自定义证书（仅 admin，custom 模式）
      description: >-
        multipart/form-data 上传 PEM 证书链与私钥（字段 cert、key，各限
        1MiB）：服务端校验可解析且私钥与证书匹配后原子落盘证书目录
        （TLS_CERT_DIR，compose 共享卷默认 /data/tls，权限 0600；caddy 容器
        以只读挂载同一路径），返回证书摘要（CN/有效期/SAN）。仅存储，
        不改变当前模式——切换到自定义证书由 PUT /admin/tls mode=custom
        完成。写 tls.cert_upload 审计（不落证书内容）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [cert, key]
              properties:
                cert:
                  type: string
                  format: binary
                  description: 证书 PEM 文件（含中间证书链）
                key:
                  type: string
                  format: binary
                  description: 私钥 PEM 文件（PKCS#1/PKCS#8/EC）
      responses:
        '200':
          description: 已存储的证书摘要与当前 TLS 状态
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { type: string, enum: [http, auto, internal, custom] }
                  domain: { type: string }
                  managed: { type: boolean }
                  cert:
                    nullable: true
                    allOf: { $ref: '#/components/schemas/TlsCert' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '503':
          description: 未配置 CADDY_ADMIN_ADDR（功能关闭）

  /admin/quarantine:
    get:
      tags: [Admin]
      operationId: listQuarantine
      summary: 隔离区列表（仅 admin）
      description: >-
        列出 object_blobs 中 status=quarantined 的内容对象：sha256/大小/
        MIME/引用计数/隔离时间，及经 file_versions join 得到的引用文件名
        （同内容多版本引用取最新；孤儿 blob 为 null）。limit 缺省 100。
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: 隔离 blob 列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/QuarantineItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/quarantine/{sha256}/action:
    post:
      tags: [Admin]
      operationId: quarantineAction
      summary: 处置隔离 blob（仅 admin）
      description: >-
        对隔离中的 blob 执行处置动作，全部动作写审计
        （quarantine.rescan / quarantine.release / quarantine.delete）：
        rescan——重新扫描对象内容，通过置 available、未通过维持 quarantined
        （响应附处置后状态）；release——管理员判定误报时解除隔离
        （quarantined → available），须显式 confirm=true，缺省或 false 一律
        400（CONFIRM_REQUIRED）；delete——解除全部版本引用并物理删除对象
        与行（current 指向被删版本的文件重指向剩余最新版本，无剩余则置空；
        物理删除复用 purge blob 的「标 deleting → 行锁复核删对象删行」
        两步语义，被复活/仍被引用时绝不删除）。
      parameters:
        - name: sha256
          in: path
          required: true
          schema: { type: string }
          description: 隔离 blob 的 sha256（列表接口返回的 sha256）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [rescan, release, delete]
                confirm:
                  type: boolean
                  description: release 动作的显式确认（须 true；其余动作忽略）
      responses:
        '200':
          description: rescan / release 处置结果（附处置后状态）
          content:
            application/json:
              schema:
                type: object
                properties:
                  sha256: { type: string }
                  status: { type: string, description: available 或 quarantined（rescan 未通过） }
        '204': { description: delete 处置完成（对象与引用已删除） }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/settings/{key}:
    put:
      tags: [Admin]
      operationId: updateAdminSetting
      summary: 更新单个系统设置（仅 admin）
      description: >-
        按键的类型与范围校验后写入（value_type 为 bool/int/string，int 键有
        min/max 范围）；未知键 404、类型或范围不符 400。成功写 settings.update
        审计（含操作者与新值）。
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum:
              [upload.max_versions_per_file, upload.max_file_size,
               upload.default_quota, share.default_expiry_hours, retention.trash_days]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  description: 与键定义类型一致的标量值（bool / int / string）
                  oneOf:
                    - type: boolean
                    - type: integer
                    - type: string
      responses:
        '200':
          description: 已更新；返回归一化后的值
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  value: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/stats:
    get:
      tags: [Admin]
      operationId: adminStats
      summary: 基础统计（仅 admin）
      description: 各核心表的行数计数（users / files / upload_sessions / sessions / shares）。
      responses:
        '200':
          description: 统计计数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/backups/status:
    get:
      tags: [Admin]
      operationId: adminBackupStatus
      summary: 备份状态（仅 admin）
      description: >-
        读取 BACKUP_DIR 下最近的 manifest.json（v2 目录布局 docflow-backup-<ts>/，
        兼容 v1 顶层散落清单），返回结构化状态：enabled（BACKUP_DIR 是否配置）、
        last_backup（最近备份的组件/对象存储模式/总大小/时间）、verified（读取
        备份目录内 verify.json 校验标记；从未校验为 null）、files（清单内每文件
        sha256/size）。只读文件，不执行任何命令；目录缺失或从未备份时
        last_backup=null、files=[]。
      responses:
        '200':
          description: 备份状态
          content:
            application/json:
              schema:
                type: object
                required: [enabled, files]
                properties:
                  enabled: { type: boolean, description: BACKUP_DIR 是否已配置 }
                  last_backup:
                    type: [object, 'null']
                    properties:
                      name: { type: string, description: 备份目录名（v2）或清单文件名（v1） }
                      manifest: { type: string, description: manifest.json 路径 }
                      timestamp: { type: string, description: 备份时间（ISO-8601，v2 清单携带） }
                      modified_at: { type: string, format: date-time }
                      size: { type: integer, format: int64, description: 清单条目大小合计（字节） }
                      components:
                        type: array
                        items: { type: string }
                        description: 备份组件（postgres / object-store / env）
                      object_store:
                        type: string
                        enum: [local, external]
                        description: external=S3 等外部对象存储（未打包，由运维层负责备份/版本化）
                      encryption: { type: string, description: 固定 ops-layer——脚本不加密，由运维层加密（LUKS/KMS 等） }
                  verified:
                    type: [boolean, 'null']
                    description: 最近备份是否通过校验；null=从未校验
                  verified_at: { type: string, description: 最近一次校验时间（verify.json 标记，ISO-8601） }
                  files:
                    type: array
                    items:
                      type: object
                      properties:
                        path: { type: string }
                        type: { type: string, description: postgres_dump / object / env }
                        sha256: { type: string }
                        size: { type: integer, format: int64 }
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/backups/verify:
    post:
      tags: [Admin]
      operationId: adminBackupVerify
      summary: 只读校验最近备份
      description: >-
        对 BACKUP_DIR 下最近备份重算每文件 sha256 并与 manifest 比对（含
        postgres 组件存在性检查）；只读备份文件，不执行脚本、不触达数据库、
        不执行恢复。结果尽力写回备份目录 verify.json 标记（目录只读时忽略，
        status 端点保持「未验证」），并写审计 backup.verify（成功/失败均记录）
        与指标 docflow_backup_verification_total{result=success|failed}；
        校验通过时刷新 docflow_backup_last_success_timestamp。
      responses:
        '200':
          description: 校验通过
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupVerifyResult' }
        '422':
          description: 校验未通过（明细在 errors；响应体同 BackupVerifyResult，verified=false）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackupVerifyResult' }
        '400': { description: 未配置 BACKUP_DIR }
        '404': { description: 备份目录下没有任何 manifest }
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}
  /admin/backups/run:
    post:
      tags: [Admin]
      operationId: adminBackupRun
      summary: 请求备份（安全禁用）
      description: >-
        服务端永不执行系统命令，固定返回 501：备份由 scripts/backup.sh 或
        scripts/backup.ps1 在部署机执行（支持 --verify 校验），服务进程不
        持有备份加密密钥。
      responses:
        '501': {description: 必须由受控运维脚本执行, content: {application/json: {schema: {type: object, properties: {error: {type: string}, code: {type: string, description: BACKUP_MANUAL_ONLY}, command: {type: string}}}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {$ref: '#/components/responses/RateLimited'}

  /admin/audit-logs:
    get:
      tags: [Admin]
      operationId: adminAuditLogs
      summary: 查询审计日志
      parameters:
        - {name: limit, in: query, schema: {type: integer, maximum: 1000}}
        - {name: cursor, in: query, schema: {type: string}}
        - {name: action, in: query, schema: {type: string}}
        - {name: user_id, in: query, schema: {type: string, format: uuid}}
      responses:
        '200': {description: 审计日志分页结果, content: {application/json: {schema: {type: object}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /admin/audit-logs/export.csv:
    get:
      tags: [Admin]
      operationId: exportAuditLogs
      summary: 导出审计日志 CSV
      responses:
        '200': {description: CSV, content: {text/csv: {schema: {type: string, format: binary}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}

  /admin/invitations:
    post:
      tags: [Admin]
      operationId: createInvitation
      summary: 创建邀请（仅 admin）
      description: >-
        为邮箱创建邀请（7 天有效，邮箱小写归一并做格式校验，role 限
        user|admin），生成一次性注册 token（32 字节随机数 URL-safe base64，
        数据库仅存 SHA-256 哈希）。新建返回 201 与一次性 accept_url
        （前端路由 /register/{token}，明文仅本次响应可见）并 best-effort
        发送邀请邮件。幂等：该邮箱已有未过期未接受的邀请时返回 200 与既有
        记录（不新发 token，无 accept_url）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, description: 被邀请人邮箱（服务端小写归一） }
                role:
                  type: string
                  enum: [user, admin]
                  default: user
                  description: 新用户角色
      responses:
        '201':
          description: 已创建；accept_url 一次性返回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvitation' }
        '200':
          description: 幂等命中既有未过期未接受邀请（无新 accept_url）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Admin]
      operationId: listInvitations
      summary: 邀请列表（仅 admin）
      description: 按 created_at 倒序返回邀请，每条附派生状态 pending/accepted/expired；limit 参数默认 100、上限 1000。
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 100 }
      responses:
        '200':
          description: 邀请列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/invitations/{id}:
    delete:
      tags: [Admin]
      operationId: revokeInvitation
      summary: 撤销邀请（仅 admin）
      description: 删除邀请行，token 立即不可解析（注册返回 404）；已接受的邀请撤销无实际效果。不存在 404。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: 已撤销
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/groups:
    get:
      tags: [Admin]
      operationId: adminListGroups
      summary: 用户组列表（仅 admin）
      description: 全部用户组（含 member_count 聚合），按创建时间升序。组为纯组织维度（不挂文件空间、不参与文件权限判定），与团队（协作空间）互补。
      responses:
        '200':
          description: 组列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Admin]
      operationId: adminCreateGroup
      summary: 创建用户组（仅 admin）
      description: 组名全局唯一（TrimSpace、非空、无控制字符、≤100 字符）；写 group.create 审计。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100, description: 非空、无控制字符 }
                description: { type: string, description: 组用途说明（可选） }
      responses:
        '201':
          description: 组已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: 组名已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/groups/{id}:
    patch:
      tags: [Admin]
      operationId: adminUpdateGroup
      summary: 更新用户组（仅 admin）
      description: 指针语义更新组名/描述（均缺省为无操作，返回当前组）；写 group.update 审计。
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 100 }
                description: { type: string, description: 空串清空描述 }
      responses:
        '200':
          description: 已更新（返回更新后的组）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Group' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 组名已被占用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Admin]
      operationId: adminDeleteGroup
      summary: 删除用户组（仅 admin）
      description: 物理删除组并级联清空 group_members（组不删用户）；写 group.delete 审计。
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '204': { description: 组已删除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/groups/{id}/members:
    get:
      tags: [Admin]
      operationId: adminListGroupMembers
      summary: 组成员列表（仅 admin）
      description: 组成员（JOIN users 补齐 username/nickname 展示列，按加入时间升序）；组不存在 404。
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMemberList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Admin]
      operationId: adminAddGroupMember
      summary: 添加组成员（仅 admin）
      description: 用户不存在 404、已在组 409；写 group.member.add 审计（metadata 记录成员用户 ID）。
      parameters: [{ name: id, in: path, required: true, schema: { type: string, format: uuid } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        '201':
          description: 成员已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 用户已是组成员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/groups/{id}/members/{uid}:
    delete:
      tags: [Admin]
      operationId: adminRemoveGroupMember
      summary: 移除组成员（仅 admin）
      description: 组或成员不存在 404；写 group.member.remove 审计（metadata 记录成员用户 ID）。
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: uid, in: path, required: true, schema: { type: string, format: uuid }, description: 被移除成员的用户 ID }
      responses:
        '204': { description: 成员已移除 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/users:
    get:
      tags: [Admin]
      operationId: adminListUsers
      summary: 用户列表（仅 admin）
      description: >-
        全量用户列表（含 disabled/locked，脱敏：不含密码哈希）。q 非空时按
        username/email/nickname 前缀匹配（ILIKE，通配符已转义；管理端场景
        允许邮箱前缀检索）；created_at 倒序分页（limit 默认 50 上限 200，
        offset ≥ 0），total 为当前过滤条件下的总数。锁定信息
        （failed_login_count/locked_until）与所属组名（group_names，按页聚合）
        一并返回供管理端判断。
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: username/email/nickname 前缀检索（空返回全部）
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        '200':
          description: 用户列表（分页）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/users/{id}:
    get:
      tags: [Admin]
      operationId: adminGetUser
      summary: 查询用户详情（仅 admin）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 用户详情（脱敏）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Admin]
      operationId: adminDeleteUser
      summary: 软禁用用户（仅 admin）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已软禁用，用户数据保留 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin]
      operationId: adminUpdateUser
      summary: 更新用户（禁用/启用/改配额/改角色，仅 admin）
      description: >-
        按需更新：status ∈ active|disabled（禁用立即撤销其全部会话——
        refresh 全部失效；置 active 同时清零登录失败锁定，视为管理员解锁）、
        storage_quota ∈ [1B, 1PiB]、role ∈ user|admin。admin 不可禁用自己
        （400）。成功写 user.update 审计（含变更字段）并返回更新后的用户。
        设计 DELETE /users/{id} 以软禁用替代：删除会级联失效其名下文件/
        分享/审计引用，破坏数据完整性；禁用达到同等的「账号不可用」效果。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminUserUpdate' }
      responses:
        '200':
          description: 更新后的用户
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/users/{id}/reset-password:
    post:
      tags: [Admin]
      operationId: adminResetUserPassword
      summary: 重置用户密码（仅 admin）
      description: >-
        强度校验（与自助改密同规则：≥12 字符且含大小写与数字）后更新密码
        哈希并撤销该用户全部会话（其所有设备需以新密码重新登录）。成功 204，
        写 user.reset_password 审计（不含密码任何形态）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [new_password]
              properties:
                new_password:
                  type: string
                  format: password
                  description: 至少 12 字符，须含大写、小写与数字
      responses:
        '204':
          description: 已重置（该用户全部会话失效）
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Authorization: Bearer <token>，两类凭证等价可用：
        ① HS256 JWT（subject 为用户 UUID，过期时间以服务配置为准）；
        ② PAT 个人访问令牌：dfpat_ + 43 字符 URL-safe base64（经
        POST /tokens 创建，撤销/过期即失效；无 refresh 语义）。

  responses:
    BadRequest:
      description: 请求参数或请求体非法
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 缺失或无效的访问令牌
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 无权限执行该操作（含只读目录、根目录保护、对象不可用等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在或不属于当前用户（不泄露存在性）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 状态冲突（名称冲突、偏移不匹配、文件无当前版本等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: 资源已失效（分享过期/撤销/达下载上限、上传会话过期或终态）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: 上传长度超过 Tus-Max-Size 上限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Content-Type 不被接受，或预览 MIME 不在白名单（preview not supported）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 触发限流；响应头 Retry-After 为当前窗口剩余秒数
      headers:
        Retry-After:
          description: 建议等待秒数
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 人类可读错误信息
        code:
          type: string
          description: >-
            机器可读错误码；当前实现使用 NAME_CONFLICT / NOT_DELETED / PARENT_DELETED /
            QUARANTINED / FAILED / TOTP_REQUIRED（POST /auth/login 对已启用两步
            验证账号的 401，error=totp_required）/ ACCOUNT_LOCKED（登录与
            refresh 遇锁定期账号的 423）/ QUOTA_EXCEEDED（上传建会话配额
            超限的 403）/ CSRF_REJECTED（refresh/logout 同源校验失败的 403）
        status:
          type: string
          description: 上传相关错误附带的会话状态（仅 uploads complete 端点）
    OpenWithPreference:
      type: object
      description: 默认打开方式偏好（/me/open-with）；ext 已规范化（小写、去点）
      required: [ext, opener]
      properties:
        ext:
          type: string
          description: 文件扩展名（1..16 个 [a-z0-9] 字符，无前置点）
        opener:
          type: string
          enum: [office, drawio, excalidraw, text, markdown, code, web, default]
        updated_at: { type: string, format: date-time }
    Setting:
      type: object
      description: 系统设置条目（GET /admin/settings）；value 为按类型解析后的标量
      properties:
        key:
          type: string
          enum:
            [upload.max_versions_per_file, upload.version_retention_days,
             upload.blocked_extensions, upload.max_file_size,
             upload.default_quota, upload.max_concurrent_uploads_per_user,
             share.default_expiry_hours, share.default_watermark,
             share.watermark_text, share.public_enabled,
             retention.trash_days, retention.access_events_days,
             security.rate_limit_per_minute, security.login_max_retries,
             security.login_lock_minutes, security.scan_quarantine_policy,
             batch.max_items, folder.max_depth, audit.retention_days,
             backup.enabled, backup.retention_days,
             backup.encryption_required, backup.last_verify]
        value: { description: 当前生效值（未设置时为默认值） }
        type: { type: string, enum: [bool, int, string] }
        description: { type: string }
        default: { description: 内置默认值 }
        effect:
          type: string
          enum: [immediate, new_session, restart]
          description: 变更生效方式（立即 / 新会话 / 需重启），按各键真实消费路径标注
        updated_at: { type: string, format: date-time }
        updated_by:
          type: [string, 'null']
          format: uuid
          description: 最近更新者；从未设置过时缺省
    MailEnvStatus:
      type: object
      description: >-
        邮件通道只读状态（GET /admin/settings 附带 mail 字段）：SMTP 为
        env-only 配置（邮件器启动时装配），不提供运行时修改端点；仅回显
        非密钥连接参数与配置状态（SMTP_PASS 只报 password_configured）。
      properties:
        enabled:
          type: boolean
          description: SMTP_ENABLED 是否启用（false = Noop 日志通道）
        host: { type: string, description: SMTP_HOST；未配置为空串 }
        port: { type: integer, description: SMTP_PORT（默认 587） }
        user: { type: string, description: SMTP_USER（空 = 匿名投递） }
        from: { type: string, description: SMTP_FROM 发件人；未配置为空串 }
        password_configured:
          type: boolean
          description: SMTP_PASS 是否已配置（不回显值）
        public_base_url: { type: string, description: PUBLIC_BASE_URL（邮件内链接前缀） }
    TlsCert:
      type: object
      description: 已上传自定义证书的摘要（POST /admin/tls/cert 与 GET /admin/tls 的 cert 字段）
      properties:
        cn: { type: string, description: 证书 Subject CN }
        not_before: { type: string, description: 生效起始时间 }
        not_after: { type: string, description: 过期时间 }
        dns_names:
          type: array
          items: { type: string }
          description: SAN 域名列表
    QuarantineItem:
      type: object
      description: 隔离 blob 条目（GET /admin/quarantine）；文件名经 file_versions join 取最新引用
      properties:
        sha256: { type: string }
        size: { type: integer, format: int64 }
        mime_type: { type: string }
        ref_count: { type: integer, format: int64 }
        file_id:
          type: [string, 'null']
          format: uuid
          description: 引用该 blob 的最新文件 ID；孤儿隔离 blob 为 null
        file_name:
          type: [string, 'null']
          description: 引用文件名；孤儿隔离 blob 为 null
        created_at: { type: string, format: date-time }
    AdminStats:
      type: object
      description: 基础统计（GET /admin/stats），各核心表行数与对象存储用量
      properties:
        users: { type: integer, format: int64 }
        files: { type: integer, format: int64 }
        uploads: { type: integer, format: int64, description: upload_sessions 行数 }
        sessions: { type: integer, format: int64 }
        shares: { type: integer, format: int64 }
        tokens: { type: integer, format: int64, description: api_tokens 行数 }
        teams: { type: integer, format: int64, description: 未软删团队数 }
        groups: { type: integer, format: int64, description: 用户组数（migration 035） }
        storage_bytes: { type: integer, format: int64, description: 对象存储用量（object_blobs.size 合计，字节） }
    BackupVerifyResult:
      type: object
      description: >-
        备份校验结果（POST /admin/backups/verify；200=通过、422=未通过，
        响应体结构一致）。校验为只读 sha256 复核，不执行脚本与恢复。
      properties:
        manifest: { type: string, description: 被校验的 manifest.json 路径 }
        backup: { type: string, description: 备份目录路径 }
        timestamp: { type: string, description: 备份时间（ISO-8601，v2 清单携带） }
        files: { type: integer, description: 清单内文件数 }
        verified: { type: boolean, description: 是否全部通过（sha256/size 一致且含 postgres 组件） }
        errors:
          type: array
          items: { type: string }
          description: 失败明细（缺文件 / sha256 或 size 不符 / 缺 postgres dump 等）
    Me:
      type: object
      description: >-
        当前用户档案（GET/PATCH /api/v1/me，C3/C21a）；不含密码哈希。
        storage.used 与配额校验同口径（当前版本求和，软删计入）。
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, disabled, locked] }
        storage:
          type: object
          properties:
            used: { type: integer, format: int64, description: 个人空间已用字节（软删计入） }
            quota: { type: integer, format: int64, description: 存储配额（字节） }
        profile:
          type: object
          properties:
            nickname:
              type: [string, 'null']
              description: 昵称（≤64 字符）；未设置为 null，前端头像按 username 首字母计算
            department:
              type: [string, 'null']
              description: 部门（≤128 字符）
            position:
              type: [string, 'null']
              description: 职位（≤128 字符）
            phone:
              type: [string, 'null']
              description: 电话（≤32 字符）
            bio:
              type: [string, 'null']
              description: 简介（≤512 字符）
            language: { type: string, enum: [zh-CN, en-US], description: 界面语言 }
            timezone: { type: string, description: 时区（IANA 名称，≤64 字符） }
        created_at: { type: string, format: date-time }
    MeProfileUpdate:
      type: object
      description: PATCH /me 请求体：仅提供的字段被更新；文本字段空串表示清空（language/timezone 空串视为未提供）
      properties:
        nickname:
          type: string
          maxLength: 64
        department:
          type: string
          maxLength: 128
        position:
          type: string
          maxLength: 128
        phone:
          type: string
          maxLength: 32
        bio:
          type: string
          maxLength: 512
        language:
          type: string
          enum: [zh-CN, en-US]
        timezone:
          type: string
          maxLength: 64
    Group:
      type: object
      description: 用户组（groups 表，migration 035；仅 admin 管理，纯组织维度）
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 100 }
        description: { type: string }
        member_count: { type: integer, format: int64, description: 组成员数（列表/详情聚合） }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    GroupList:
      type: object
      properties:
        groups:
          type: array
          items: { $ref: '#/components/schemas/Group' }
    GroupMember:
      type: object
      description: 组成员（group_members 行；username/nickname 为 JOIN users 展示列，仅非空时返回）
      properties:
        user_id: { type: string, format: uuid }
        username: { type: string }
        nickname: { type: string }
        joined_at: { type: string, format: date-time }
    GroupMemberList:
      type: object
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/GroupMember' }
    AdminUser:
      type: object
      description: 管理端用户视图（GET /admin/users 与 PATCH 响应，C6）；脱敏：不含密码哈希
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: string }
        role: { type: string, enum: [user, admin] }
        status: { type: string, enum: [active, disabled, locked] }
        storage_quota:
          type: integer
          format: int64
          description: 存储配额（字节）
        failed_login_count:
          type: integer
          description: 当前连续登录失败计数（达到阈值即锁定并清零）
        locked_until:
          type: [string, 'null']
          format: date-time
          description: 登录失败锁定截止时间；null 表示未锁定
        profile:
          type: object
          description: 档案字段（结构同 /me 的 profile）
          properties:
            nickname:
              type: [string, 'null']
            department:
              type: [string, 'null']
            position:
              type: [string, 'null']
            phone:
              type: [string, 'null']
            bio:
              type: [string, 'null']
            language: { type: string }
            timezone: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AdminUserList:
      type: object
      properties:
        users:
          type: array
          items: { $ref: '#/components/schemas/AdminUser' }
        total: { type: integer, format: int64, description: 当前过滤条件下的总数 }
        limit: { type: integer }
        offset: { type: integer }
    AdminUserUpdate:
      type: object
      description: PATCH /admin/users/{id} 请求体：指针语义（仅提供的字段被更新）
      properties:
        status:
          type: string
          enum: [active, disabled]
          description: 禁用立即撤销其全部会话；置 active 清零登录失败锁定
        storage_quota:
          type: integer
          format: int64
          minimum: 1
          maximum: 1125899906842624
          description: 存储配额（字节，1B 到 1PiB）
        role:
          type: string
          enum: [user, admin]
        nickname:
          type: string
          maxLength: 64
          description: 展示昵称（空串清空，写侧归一 NULL）
    Invitation:
      type: object
      description: 邀请记录（invitations 表）；明文 token 不落库也不回传，仅创建时一次性返回 accept_url
      properties:
        id: { type: string, format: uuid }
        email: { type: string, description: 已小写归一 }
        invited_by:
          type: [string, 'null']
          format: uuid
          description: 邀请人（admin）用户 ID
        role: { type: string, enum: [user, admin] }
        status:
          type: string
          enum: [pending, accepted, expired]
          description: 派生状态（accepted_at/expires_at 计算，不落库）
        expires_at: { type: string, format: date-time }
        accepted_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }
    CreatedInvitation:
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          properties:
            accept_url:
              type: string
              description: 一次性注册链接（前端路由 /register/{token}；仅创建响应返回，之后不可再取）
    InvitationList:
      type: object
      properties:
        invitations:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
    RegisterRequest:
      type: object
      required: [token, username, password]
      properties:
        token:
          type: string
          description: 一次性邀请 token（邀请邮件/accept_url 中的明文）
        username:
          type: string
          description: 3-32 字符，仅限字母、数字、'_' 与 '-'
        password:
          type: string
          format: password
          description: 至少 12 字符，须含大写、小写与数字
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: 一次性重置令牌（重置邮件 /reset/{token} 链接中的明文，30 分钟有效）
        password:
          type: string
          format: password
          description: 至少 12 字符，须含大写、小写与数字
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string, format: password }
        new_password:
          type: string
          format: password
          description: 至少 12 字符，须含大写、小写与数字
    TOTPLoginRequest:
      type: object
      required: [password]
      description: 两步验证登录第二段：identifier（email 或 username）+password 复核后校验 code 或 recovery_code（二选一，都传时按 TOTP 码优先）
      properties:
        identifier:
          type: string
          description: 登录标识（email 或 username），优先于 email 字段
        email:
          type: string
          description: 旧字段（兼容保留）；identifier 缺省时使用
        password: { type: string, format: password }
        code:
          type: string
          description: 认证器当前 6 位 TOTP 码（±30s 窗口）
        recovery_code:
          type: string
          description: 一次性恢复码（xxxx-xxxx；命中即消耗）
    TOTPSetup:
      type: object
      required: [secret, otpauth_url]
      description: >-
        POST /auth/totp/setup 响应；客户端不渲染二维码，以文本展示 secret
        （认证器手动录入/导入）。secret 服务端明文存储（自托管边界，见
        migration 020 注释），仅 setup/confirm 阶段经认证响应下发。
      properties:
        secret: { type: string, description: Base32 共享密钥（SHA1/6 位/30 秒） }
        otpauth_url: { type: string, description: otpauth://totp/... 认证器导入 URL }
    TOTPConfirmRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, description: 认证器当前 6 位码（±30s 窗口） }
    TOTPDisableRequest:
      type: object
      description: 密码或 TOTP 码二选一（均须非空才进入校验；恢复码不可用于禁用）
      properties:
        password: { type: string, format: password }
        code: { type: string, description: 当前有效 6 位 TOTP 码 }
    TOTPStatus:
      type: object
      required: [enabled]
      description: GET /auth/totp 状态视图
      properties:
        enabled: { type: boolean }
        confirmed_at:
          type: [string, 'null']
          format: date-time
          description: 启用确认时间；未 setup/未确认时为 null
    TokenPair:
      type: object
      required: [access_token, token_type]
      properties:
        access_token: { type: string, description: JWT 访问令牌 }
        token_type: { type: string, const: Bearer }
    WebpkgPreview:
      type: object
      description: >-
        网页包预览指引（/files/{id}/preview 与 /public/shares/{token}/preview
        对 zip+ready 包的 200 JSON 响应）；前端以 sandbox="allow-scripts" 的
        iframe 加载 url（无 allow-same-origin，内容端点带严格 CSP/nosniff）。
      required: [kind, url]
      properties:
        kind: { type: string, const: webpkg }
        url:
          type: string
          description: '内容入口 /content/<public_id>/index.html（public_id 为 43 字符随机串）'
    WebpkgPackage:
      type: object
      description: >-
        web_packages 行的对外视图（POST /files/{id}/webpkg/extract 响应）；
        public_id 仅在 ready 时返回，blocked/failed 附 error 原因。
      properties:
        file_id: { type: string, format: uuid }
        status:
          type: string
          enum: [extracting, ready, failed, blocked]
          description: ready 可预览；blocked 为安全校验未通过；failed 为存储级失败
        public_id:
          type: string
          description: 43 字符 URL-safe 随机串（仅 ready 时返回；幂等重建保持稳定）
        entry_count: { type: integer, description: 解包文件条目数（目录条目不计） }
        total_size: { type: integer, format: int64, description: 展开总字节数 }
        error:
          type: string
          description: blocked/failed 时的原因（ready 时缺省）
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    File:
      type: object
      description: >-
        文件/目录元数据；响应不含 owner_id、team_id 等内部字段。
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parent_id:
          type: [string, 'null']
          format: uuid
          description: 父目录 ID；根目录为 null
        type: { type: string, enum: [file, folder] }
        is_root: { type: boolean }
        description: { type: string }
        is_public:
          { type: boolean, description: 是否存在有效公开分享（冗余辅助字段） }
        is_starred:
          { type: boolean, description: 收藏标记（行级共享；团队文件全队共享星标） }
        view_count: { type: integer, format: int64 }
        download_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TrashFile:
      allOf:
        - $ref: '#/components/schemas/File'
        - type: object
          properties:
            deleted_at:
              type: [string, 'null']
              format: date-time
    FileWithVersion:
      allOf:
        - $ref: '#/components/schemas/File'
        - type: object
          properties:
            current_version:
              oneOf:
                - $ref: '#/components/schemas/FileVersion'
                - type: 'null'
              description: 当前版本摘要；文件无任何版本时为 null
    FileVersion:
      type: object
      description: GET /files/{id} 返回的当前版本视图（对象 blob 摘要）
      properties:
        id: { type: string, format: uuid, description: 版本记录 ID }
        version: { type: integer, description: 版本号（从 1 递增） }
        size: { type: integer, format: int64, description: 内容字节数 }
        sha256: { type: string, description: 内容 SHA-256（十六进制小写） }
        mime_type: { type: string, description: 检测出的 MIME 类型 }
        status:
          type: string
          enum: [created, scanning, available, quarantined, failed, deleting]
          description: 对象状态；仅 available 可下载
    FileList:
      type: object
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/File' }
    SearchResult:
      type: object
      description: >-
        全文检索单条结果；name/type/parent_id/updated_at 取 files 行实时值。
        snippet：名称命中时为名称本身；内容命中时为 ts_headline('simple', ...)
        片段，高亮标记为 [[..]]（纯文本，前端渲染高亮）；仅名称索引或无命中
        片段时缺省。
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, enum: [file, folder] }
        parent_id:
          type: [string, 'null']
          format: uuid
          description: 所在目录 ID（前端跳转预览用；不提供完整面包屑链）
        updated_at: { type: string, format: date-time }
        snippet: { type: string, description: "命中上下文（[[..]] 高亮标记）" }
    SearchResultList:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/SearchResult' }
    Tag:
      type: object
      description: 用户维度标签（tags 表）；(user_id, name) 唯一
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 64 }
        created_at: { type: string, format: date-time }
    TagList:
      type: object
      properties:
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
    BatchResultItem:
      type: object
      description: 批量操作单项结果；ok=false 时附机器可读错误码
      properties:
        id: { type: string, format: uuid }
        ok: { type: boolean }
        error_code:
          type: string
          description: >-
            NOT_FOUND / FORBIDDEN / ROOT / NAME_CONFLICT / INVALID_TARGET /
            PARENT_DELETED / NOT_DELETED / INTERNAL
    BatchResults:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/BatchResultItem' }
    TeamFileList:
      type: object
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/File' }
        parent_id:
          { type: string, format: uuid, description: 当前列出的目录 ID }
    UploadSession:
      type: object
      description: >-
        上传会话；POST /uploads、PATCH /uploads/{id}、POST /uploads/{id}/complete
        返回全量字段，GET /uploads/{id} 省略 retry_count。响应不含
        user_id、expected_sha256、metadata、storage_key（敏感/内部字段）。
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        name: { type: string }
        size: { type: integer, format: int64, description: 声明的总字节数 }
        offset: { type: integer, format: int64, description: 已接收字节数 }
        status:
          type: string
          enum: [uploading, verifying, scanning, available, quarantined, failed]
        file_id:
          type: [string, 'null']
          format: uuid
          description: >-
            覆盖为新版本会话的目标文件 ID（仅 file_id 创建的会话返回，含 Complete
            完成后的响应）；常规上传会话缺省该字段
        expires_at: { type: string, format: date-time }
        retry_count:
          { type: integer, description: '处理重试次数（GET /uploads/{id} 不返回）' }
        created_at: { type: string, format: date-time }
        completed_at:
          type: [string, 'null']
          format: date-time
          description: 完成时间；未完成为 null 或缺省
    FileVersionDetail:
      type: object
      description: GET /files/{id}/versions 的版本条目（版本不可变，status 为关联 blob 实时状态）
      properties:
        id: { type: string, format: uuid, description: 版本记录 ID }
        version: { type: integer, description: 版本号（从 1 递增，列表按其倒序） }
        size: { type: integer, format: int64, description: 内容字节数 }
        sha256: { type: string, description: 内容 SHA-256（十六进制小写） }
        mime_type: { type: string, description: 对象 MIME 类型 }
        status:
          type: string
          enum: [created, scanning, available, quarantined, failed, deleting]
          description: 关联对象状态；deleting 表示已被版本裁剪解除引用、待后台回收
        comment:
          type: [string, 'null']
          description: 版本备注（预留，当前恒为 null）
        user_id: { type: string, format: uuid, description: 创建该版本的用户 }
        created_at: { type: string, format: date-time }
    Share:
      type: object
      description: >-
        分享记录；列表与私有分享响应不含明文 token（明文仅公开分享创建时返回一次）。
        列表与创建响应额外附 visibility，列表响应额外附 file_name。
      properties:
        id: { type: string, format: uuid }
        file_id: { type: string, format: uuid }
        visibility:
          type: string
          enum: [public, private]
          description: 分享可见性；GET /shares 列表与 POST /shares 创建响应返回
        permission: { type: string, enum: [view, download] }
        has_password:
          type: boolean
          description: 是否受密码保护（明文与哈希均不回传）
        watermark_enabled: { type: boolean, description: 水印开关（默认 true） }
        watermark_text:
          type: [string, 'null']
          description: 自定义水印模板；null 表示渲染时使用系统默认模板
        expires_at:
          type: [string, 'null']
          format: date-time
          description: 过期时间；null 表示永久
        max_downloads:
          type: [integer, 'null']
          description: 最大下载次数；null 表示不限
        download_count: { type: integer }
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: 撤销时间；null 表示未撤销
        created_at: { type: string, format: date-time }
        file_name:
          type: string
          description: 关联文件名（JOIN files）；仅 GET /shares 列表响应返回，文件已删除时为空串
    CreatedShare:
      allOf:
        - $ref: '#/components/schemas/Share'
        - type: object
          properties:
            token:
              type: [string, 'null']
              description: >-
                公开分享的一次性明文 token（URL-safe base64，仅创建响应返回）；
                私有分享为 null/缺省
            share_url:
              type: [string, 'null']
              description: '公开分享访问路径 /api/v1/public/shares/{token}；私有分享为 null/缺省'
    ShareList:
      type: object
      properties:
        shares:
          type: array
          items: { $ref: '#/components/schemas/Share' }
    ShareAccessRecord:
      type: object
      description: 最近访问记录条目（脱敏：不含 IP 哈希与内部 ID）
      properties:
        time: { type: string, format: date-time }
        action: { type: string, enum: [download, preview] }
        ip_prefix:
          type: string
          description: 脱敏 IP 前缀（IPv4 形如 203.0.*，IPv6 形如 2001:db8:*）
        user_agent:
          type: string
          description: UA 摘要（入库前截断 512 字节）
    ShareStats:
      type: object
      description: 分享访问统计聚合（file_access_events，事件由 janitor 按 retention.access_events_days 清理）
      properties:
        total_access: { type: integer, format: int64, description: 访问事件总数 }
        unique_visitors: { type: integer, format: int64, description: 独立访客数（distinct 加盐哈希 IP） }
        recent:
          type: array
          maxItems: 20
          items: { $ref: '#/components/schemas/ShareAccessRecord' }
    ShareDetail:
      allOf:
        - $ref: '#/components/schemas/Share'
        - type: object
          properties:
            stats: { $ref: '#/components/schemas/ShareStats' }
    SharedWithMeItem:
      type: object
      description: 「与我共享」条目：有效私有分享 + 文件元数据 + 分享者用户名（不含 email）
      properties:
        id: { type: string, format: uuid, description: 分享 ID }
        file_id: { type: string, format: uuid }
        name: { type: string, description: 文件名 }
        size:
          { type: integer, format: int64, description: 当前版本字节数；版本缺失时为 0 }
        mime_type: { type: string, description: 当前版本 MIME 类型 }
        permission: { type: string, enum: [view, download] }
        owner_username: { type: string, description: 分享者用户名（不泄露 email） }
        expires_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time, description: 分享创建时间 }
    SharedWithMeList:
      type: object
      properties:
        shares:
          type: array
          items: { $ref: '#/components/schemas/SharedWithMeItem' }
    ShareFileMeta:
      type: object
      description: 分享访问入口（私有与公开）暴露的安全元数据子集；公开入口附水印渲染结果
      properties:
        name: { type: string }
        size: { type: integer, format: int64 }
        mime_type: { type: string }
        version: { type: integer }
        version_status:
          type: string
          enum: [created, scanning, available, quarantined, failed, deleting]
        permission: { type: string, enum: [view, download] }
        expires_at:
          type: [string, 'null']
          format: date-time
        max_downloads:
          type: [integer, 'null']
        download_count: { type: integer }
        watermark_enabled:
          type: boolean
          description: 仅公开入口返回；水印关闭时 watermark_text 为 null
        watermark_text:
          type: [string, 'null']
          description: >-
            按访问者渲染后的水印文案（{email}/{ip} → 脱敏 IP 前缀、
            {date} → 当天日期、{name} → 文件名）；水印关闭时为 null
    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        owner_id: { type: string, format: uuid, description: 团队 owner 用户 ID }
        created_at: { type: string, format: date-time }
    CreatedTeam:
      allOf:
        - $ref: '#/components/schemas/Team'
        - type: object
          properties:
            root_folder_id:
              { type: string, format: uuid, description: 事务内创建的团队根目录 ID }
    TeamList:
      type: object
      properties:
        teams:
          type: array
          items: { $ref: '#/components/schemas/Team' }
    TeamMember:
      type: object
      description: >-
        团队成员：role 为系统角色（owner/editor/viewer）或 custom（自定义角色，
        此时附 role_id 与 role_name）。权限继承 = 团队成员身份：团队内全部
        文件/目录适用同一权限集（设计 6.5.3 最小落地，无路径级覆盖）。
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [owner, editor, viewer, custom] }
        role_id:
          { type: string, format: uuid, description: 自定义角色 ID；系统角色时缺省 }
        role_name:
          { type: string, description: 自定义角色名（role=custom 时返回） }
        created_at: { type: string, format: date-time }
    TeamRolePermissions:
      type: object
      description: >-
        角色细粒度权限（设计 6.5.2）：布尔勾选 read/write/delete/share/admin；
        deny 数组中列出的权限显式拒绝且优先于 allow（勾选 true 也无效）。
        系统角色映射：owner 全 true；editor 读/写/分享；viewer 仅读。
      properties:
        read: { type: boolean }
        write: { type: boolean }
        delete: { type: boolean }
        share: { type: boolean }
        admin: { type: boolean }
        deny:
          type: array
          items: { type: string, enum: [read, write, delete, share, admin] }
    TeamRole:
      type: object
      properties:
        id: { type: string, format: uuid }
        team_id: { type: string, format: uuid }
        name: { type: string, maxLength: 64 }
        permissions: { $ref: '#/components/schemas/TeamRolePermissions' }
        member_count:
          { type: integer, description: 引用该角色的成员数（删除角色引用检查用） }
        created_at: { type: string, format: date-time }
    TeamRoleList:
      type: object
      properties:
        roles:
          type: array
          items: { $ref: '#/components/schemas/TeamRole' }
    TeamMemberList:
      type: object
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
    Notification:
      type: object
      description: >-
        站内通知（notifications 表，user 维度）；type 为事件类型，
        resource_id 指向关联资源（通常为文件 ID，可空）。已读通知超过
        90 天由 janitor 清理。
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [upload.completed, upload.quarantined, share.accessed, file.updated, quota.warning]
        title: { type: string, description: 通知标题（含关联文件名） }
        body: { type: string, description: 通知正文说明 }
        resource_id:
          type: [string, 'null']
          format: uuid
          description: 关联资源 ID（文件 ID 等）；无关联时为 null
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }
        read_at:
          type: [string, 'null']
          format: date-time
          description: 已读时间；未读为 null
    NotificationList:
      type: object
      required: [items, next_cursor, unread_count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        next_cursor:
          type: string
          description: >-
            下一页游标（本页最后一条的 created_at，RFC3339Nano）；无更多页时为空串
        unread_count: { type: integer, description: 当前用户未读总数（铃铛徽标） }
    NotificationPreference:
      type: object
      description: 通知偏好条目：事件类型的生效开关（无记录 = 默认开启）
      properties:
        event_type:
          type: string
          enum: [upload.completed, upload.quarantined, share.accessed, file.updated, file.version.deleted, quota.warning]
        enabled: { type: boolean }
    NotificationPreferenceList:
      type: object
      properties:
        preferences:
          type: array
          items: { $ref: '#/components/schemas/NotificationPreference' }
    FolderACLEntry:
      type: object
      description: >-
        folder_acl 条目（migration 031，设计 6.5.3/6.5.4 最小落地）：
        (目录, subject, effect, permissions) 一行一条；UNIQUE(folder_id,
        subject_type, subject_id)。subject_name 为服务端解析的展示名
        （user → username、team → 团队名），解析失败为空串。
      properties:
        subject_type: { type: string, enum: [user, team] }
        subject_id: { type: string, format: uuid }
        subject_name: { type: string, description: 展示名（username / 团队名） }
        effect: { type: string, enum: [allow, deny] }
        permissions:
          type: array
          minItems: 1
          items: { type: string, enum: [read, write, delete, share] }
        created_at: { type: string, format: date-time }
    FolderACL:
      type: object
      properties:
        folder_id: { type: string, format: uuid }
        entries:
          type: array
          items: { $ref: '#/components/schemas/FolderACLEntry' }
    FolderACLUpdate:
      type: object
      description: PUT /folders/{id}/acl 请求体：整体替换（空数组即清空）
      required: [entries]
      properties:
        entries:
          type: array
          items:
            type: object
            required: [subject_type, subject_id, effect, permissions]
            properties:
              subject_type: { type: string, enum: [user, team] }
              subject_id: { type: string, format: uuid }
              effect: { type: string, enum: [allow, deny] }
              permissions:
                type: array
                minItems: 1
                items: { type: string, enum: [read, write, delete, share] }
