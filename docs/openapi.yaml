# DocFlow HTTP API 契约（OpenAPI 3.1）。
# 本文件以 internal/http 实际实现为准（handler.go / uploads.go / tus.go / shares.go /
# teams.go / trash.go / preview.go / download.go / ratelimit.go / webpkg.go / tags.go /
# batch.go），由
# internal/http/openapi_test.go 做双向路由一致性校验，契约与实现不允许漂移。
# 说明：/health、/ready 为基础设施探针，不属于业务契约；路由参数统一写作 {id} 形式。
# 网页包内容域端点 GET /content/{pid}/{filepath} 为契约外路由（openapi_test.go
# isExcludedRoute 豁免）：无认证、面向 sandbox iframe 而非 API 客户端，独立按 IP
# 轻限流并携带严格 CSP/nosniff，语义见 /files/{id}/preview 的 webpkg 分支。
openapi: 3.1.0
info:
  title: DocFlow API
  version: 1.0.0
  description: |
    DocFlow 文档管理服务 API。

    ## 认证
    - 业务端点要求 `Authorization: Bearer <access_token>`（HS256 JWT，subject 为用户 UUID）。
    - 登录/刷新通过 HttpOnly Cookie `refresh_token`（Path=/api/v1/auth/refresh，SameSite=Lax）轮换会话。

    ## 错误与限流
    - 错误响应统一为 `{error, code?}`；`code` 为机器可读错误码（如 NAME_CONFLICT、QUARANTINED）。
    - 认证接口按 user_id+IP 每分钟限流；登录按 IP+邮箱前缀哈希更严格限流；
      公开分享接口按 IP 独立限流；超限返回 429 并带 Retry-After。
    - 文件元数据响应带 ETag（基于 updated_at）。
servers:
  - url: /api/v1
    description: API 基础路径（契约测试据此归一化路由）
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: 登录、刷新、登出、会话管理、邀请注册与密码管理（忘记/重置/修改）
  - name: Tokens
    description: 个人访问令牌（PAT，dfpat_ 前缀 Bearer 凭证）：创建（明文仅返回一次）、列表与撤销
  - name: Notifications
    description: 站内通知与通知偏好（本人维度）：列表/未读数/已读、各事件类型开关
  - name: Users
    description: 用户目录查找（邀请场景）
  - name: Files
    description: 个人空间文件与目录
  - name: Tags
    description: 标签与收藏（用户维度标签 CRUD、文件打/去标签、行级星标）
  - name: Batch
    description: 批量操作（部分成功语义，可选 Idempotency-Key 幂等）
  - name: Trash
    description: 回收站
  - name: Uploads
    description: 自定义分片上传 API
  - name: tus
    description: tus 1.0.0 断点续传（creation/expiration 扩展）
  - name: Shares
    description: 私有分享（登录用户按显式授权访问）
  - name: Public Shares
    description: 公开分享（token 链接，无认证）
  - name: Teams
    description: 团队与团队空间
  - name: Admin
    description: 管理端（仅 admin 角色）：系统设置、基础统计与邀请管理
  - name: onlyoffice
    description: >-
      ONLYOFFICE Document Server 集成（可用性探测、编辑会话、回源下载与
      保存回调）；除 config 探测端点恒注册（禁用时 enabled=false 且不暴露
      server_url）外，其余端点仅在 ONLYOFFICE_ENABLED=true 时注册
      （禁用时 404）
  - name: drawio
    description: >-
      draw.io 图表编辑集成（可用性探测）；编辑器为浏览器侧 iframe embed
      （postMessage JSON 协议：init→load→save），后端无独立编辑/保存端点
      ——保存走通用「覆盖为新版本」上传链路（POST /uploads 携带 file_id），
      图表文件即普通 .drawio 文件

paths:
  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: 邮箱密码登录
      description: >-
        校验凭据后签发访问令牌并创建刷新会话；刷新令牌经 HttpOnly Cookie
        refresh_token 下发。登录按 IP+邮箱前缀哈希独立限流。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string, format: password }
      responses:
        '200':
          description: 登录成功；Set-Cookie 下发 refresh_token
          headers:
            Set-Cookie:
              description: refresh_token=...; Path=/api/v1/auth/refresh; HttpOnly; SameSite=Lax
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: 邮箱或密码错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refresh
      summary: 轮换刷新令牌
      description: >-
        从 refresh_token Cookie 读取刷新令牌并轮换（rotate）：旧令牌立即失效，
        新 Cookie 与新访问令牌随响应返回。该端点无独立限流。
      security: []
      parameters:
        - name: refresh_token
          in: cookie
          required: true
          schema: { type: string }
          description: HttpOnly 刷新令牌 Cookie
      responses:
        '200':
          description: 新访问令牌；Set-Cookie 轮换 refresh_token
          headers:
            Set-Cookie:
              description: 轮换后的 refresh_token Cookie
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401':
          description: 刷新令牌缺失、无效或已过期
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: 登出
      description: 撤销 refresh_token Cookie 对应的刷新会话并清除 Cookie；幂等，未携带 Cookie 也返回 204。
      security: []
      parameters:
        - name: refresh_token
          in: cookie
          required: false
          schema: { type: string }
      responses:
        '204':
          description: 已登出（Cookie 被清除）

  /auth/register:
    post:
      tags: [Auth]
      operationId: register
      summary: 凭邀请注册（邀请接受）
      description: >-
        v1.0 仅管理员邀请制：凭一次性邀请 token 完成注册（用户名 3-32 字符
        仅限字母/数字/_/-，密码与 seed 同规则：≥12 字符且含大小写与数字），
        用户邮箱继承邀请、角色继承邀请。成功即视为登录：签发 access token
        并创建新 refresh 会话（响应同 login）。token 未知 404、已过期或已
        使用 410、用户名/邮箱冲突 409。按 IP 独立严格限流（10/min）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '200':
          description: 注册成功并已登录；Set-Cookie 下发 refresh_token
          headers:
            Set-Cookie:
              description: refresh_token=...; Path=/api/v1/auth/refresh; HttpOnly; SameSite=Lax
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404':
          description: 邀请 token 未知
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: 用户名或邮箱已被占用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '410':
          description: 邀请已过期或已被使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/forgot-password:
    post:
      tags: [Auth]
      operationId: forgotPassword
      summary: 请求密码重置邮件
      description: >-
        邮箱存在活跃账号时创建 30 分钟有效的一次性重置令牌并发送邮件
        （链接 {PUBLIC_BASE_URL}/reset/{token}）；无论邮箱是否存在一律 202，
        不泄露账号存在性。按 IP 独立严格限流（10/min）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string }
      responses:
        '202':
          description: 已受理（不区分邮箱是否存在）
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: accepted }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/reset-password:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: 凭一次性令牌重置密码
      description: >-
        消费一次性重置令牌（原子标记 used_at），更新密码并撤销该用户全部
        会话。令牌未知/已使用/已过期 400。按 IP 独立严格限流（10/min）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ResetPasswordRequest' }
      responses:
        '204':
          description: 已重置（全部会话失效，需重新登录）
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/change-password:
    post:
      tags: [Auth]
      operationId: changePassword
      summary: 修改密码（认证）
      description: >-
        校验旧密码（错误 403）与新密码强度后更新哈希，撤销该用户全部其他
        会话，并轮换当前会话——响应头 Set-Cookie 下发本会话新的 refresh_token。
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '204':
          description: 已修改；Set-Cookie 轮换本会话 refresh_token
          headers:
            Set-Cookie:
              description: 轮换后的 refresh_token Cookie（其他会话已被撤销）
              schema: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 旧密码错误
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/sessions:
    get:
      tags: [Auth]
      operationId: listSessions
      summary: 我的活跃登录会话
      description: >-
        列出当前用户全部活跃会话（未撤销且未过期，last_active_at 倒序）。
        实现取舍：不标记「当前会话」——会话由 refresh cookie 识别，其哈希
        不参与任何响应（凭据材料不出服务端），可伪造的请求头不作为信任源。
        响应不含 refresh_token 任何形态。
      responses:
        '200':
          description: 活跃会话列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Auth]
      operationId: revokeAllSessions
      summary: 撤销全部会话（含当前）
      description: >-
        撤销当前用户的全部会话——包括发起本请求的「当前」会话（实现取舍：
        不依赖可伪造的 X-Session-Hint 之类请求头区分当前会话），并清除
        refresh_token Cookie。前端收到 204 后应清除本地 access token 并跳转
        登录页。PAT 不受影响（无 session 语义，另行经 /tokens 撤销）。
      responses:
        '204':
          description: 已全部撤销（Cookie 被清除）
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/sessions/{id}:
    delete:
      tags: [Auth]
      operationId: revokeSession
      summary: 撤销指定会话
      description: 撤销自己的指定会话（远程登出某设备）；会话不存在、非属主或已撤销一律 404（不泄露存在性）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已撤销 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tokens:
    post:
      tags: [Tokens]
      operationId: createToken
      summary: 创建个人访问令牌
      description: >-
        创建 PAT：明文 token（dfpat_ + 43 字符 URL-safe base64）仅在本 201
        响应返回一次，服务端只存 SHA-256 哈希；prefix 为明文前 14 字符
        （UI 展示用）。name 去空白后限 1-100 字符；expires_in_days 缺省或 0
        表示永久，1-3650 天。写 token.create 审计（PAT 认证本身不审计）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 100 }
                expires_in_days:
                  { type: integer, minimum: 0, maximum: 3650, default: 0, description: 有效期（天）；0 表示永久 }
      responses:
        '201':
          description: 已创建；token 明文仅此一次返回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedApiToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Tokens]
      operationId: listTokens
      summary: 我的个人访问令牌列表
      description: 当前用户未撤销的 PAT（含已过期，按 created_at 倒序）；不含明文 token，附 last_used_at（最近一次认证，未使用为 null）。
      responses:
        '200':
          description: 令牌列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiTokenList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tokens/{id}:
    delete:
      tags: [Tokens]
      operationId: revokeToken
      summary: 撤销个人访问令牌
      description: 撤销自己的 PAT（立即失效，后续认证 401）；不存在、非属主或已撤销一律 404。写 token.revoke 审计。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已撤销 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: 我的站内通知列表
      description: >-
        当前用户通知（created_at 倒序），响应恒附 unread_count（顶栏铃铛徽标）。
        游标分页：next_cursor 为本页最后一条的 created_at（RFC3339Nano），
        作为下一页请求的 cursor（取该时间点之前的记录）；无更多页时为空串。
        简化取舍：同一时刻多条通知可能跨页跳漏，v1.0 可接受。
      parameters:
        - name: unread_only
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: 仅返回未读通知
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 20, maximum: 100 }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: 上一页 next_cursor（RFC3339Nano）；非法格式 400
      responses:
        '200':
          description: 通知列表（含未读数与下一页游标）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /notifications/read-all:
    post:
      tags: [Notifications]
      operationId: markAllNotificationsRead
      summary: 全部标记已读
      description: 当前用户全部未读通知置为已读（read_at=now）；无未读时幂等成功。
      responses:
        '204': { description: 已全部标记已读 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /notifications/{id}/read:
    post:
      tags: [Notifications]
      operationId: markNotificationRead
      summary: 标记单条已读
      description: 标记自己的通知为已读（幂等，已读不重复更新 read_at）；不存在或不属于当前用户一律 404（不泄露存在性）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已标记已读 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /notification-preferences:
    get:
      tags: [Notifications]
      operationId: listNotificationPreferences
      summary: 我的通知偏好
      description: >-
        返回全部事件类型的生效开关；无偏好记录的事件类型按默认值
        （当前全部默认开启）返回。事件类型：upload.completed（上传完成）、
        upload.quarantined（上传被隔离）、share.accessed（分享被下载）、
        file.updated（团队文件更新）。
      responses:
        '200':
          description: 各事件类型开关
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferenceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /notification-preferences/{type}:
    put:
      tags: [Notifications]
      operationId: updateNotificationPreference
      summary: 更新单个通知偏好
      description: >-
        upsert 当前用户对事件类型的开关（user_id+event_type 冲突覆盖）；
        关闭后该类型事件不再生成通知（分发时短路）。未知事件类型 400。
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [upload.completed, upload.quarantined, share.accessed, file.updated]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enabled]
              properties:
                enabled: { type: boolean }
      responses:
        '200':
          description: 已更新；返回生效值
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreference' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /users/lookup:
    get:
      tags: [Users]
      operationId: lookupUsers
      summary: 用户查找（邀请场景）
      description: >-
        按邮箱或用户名精确/前缀匹配查找活跃用户（大小写不敏感前缀），按 username
        排序，固定最多返回 10 条。权限考虑：任何登录用户均可查询（添加团队成员/
        邀请场景需要）；为避免用户枚举与隐私泄露，响应只含 id 与 username，
        绝不返回 email，并受通用认证接口限流约束。q 为空返回 400。
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: 查询串：邮箱（精确或前缀）或用户名（精确或前缀）
      responses:
        '200':
          description: 匹配的用户列表（仅 id 与 username）
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    username: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files:
    get:
      tags: [Files]
      operationId: listFiles
      summary: 列出目录内容（或按标签/收藏跨目录检索）
      description: >-
        缺省（无 tag_id/starred）列出 parent_id 指定目录（缺省为用户根目录，
        服务端按需创建）的直接子项。提供 tag_id 或 starred 时切换为跨目录
        检索模式（忽略 parent_id）：覆盖个人 + 团队可读文件（个人 owner、
        团队在册成员，实时判定）。sort/order 两种模式均生效。
        tag_id 须属于当前用户（否则 404，不泄露存在性）。
      parameters:
        - name: parent_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 父目录 ID；缺省为用户根目录（检索模式下忽略）
        - name: tag_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 标签过滤（提供即进入跨目录检索模式）
        - name: starred
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
          description: 收藏过滤（提供即进入跨目录检索模式）
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [name, updated_at, size], default: name }
          description: 排序键（size 取当前版本字节数）
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 100, maximum: 100 }
          description: 返回条数上限（服务端固定上限 100）
      responses:
        '200':
          description: 目录内容或检索结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/batch/move:
    post:
      tags: [Batch]
      operationId: batchMove
      summary: 批量移动（部分成功）
      description: >-
        把多个文件/目录移动到 target_parent_id（缺省为个人根目录）下。
        目标目录整体校验失败（不存在 404 / 无写权限 403）时整个请求失败；
        其余逐项执行、逐项收集结果 [{id,ok,error_code}]，单项失败不回滚
        其他项（部分成功语义），目标目录同名冲突项跳过（NAME_CONFLICT）。
        移动继承目标目录作用域（个人↔团队移动更新 scope/team）。根目录与
        移入自身/后代（INVALID_TARGET）拒绝。file_ids 去重、上限 100。
        可选 Idempotency-Key：同 key+同请求体 60s 内重放缓存响应
        （Idempotency-Replayed: true），同 key 不同请求体 409；
        缓存为进程内实现，多实例部署下不跨实例共享。
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: 幂等键（batch 三端点通用语义）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_ids]
              properties:
                file_ids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 100
                target_parent_id:
                  { type: string, format: uuid, description: 目标目录 ID；缺省为个人根目录 }
      responses:
        '200':
          description: 逐项结果（含失败项 error_code）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Idempotency-Key 已被不同请求体使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/batch/trash:
    post:
      tags: [Batch]
      operationId: batchTrash
      summary: 批量软删除（部分成功）
      description: >-
        批量移入回收站（软删除）；根目录跳过（ROOT），个人文件仅 owner、
        团队文件要求成员写权限（FORBIDDEN）。逐项结果语义与上限同 move。
        Idempotency-Key 语义同 move。
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_ids]
              properties:
                file_ids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 100
      responses:
        '200':
          description: 逐项结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Idempotency-Key 已被不同请求体使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/batch/restore:
    post:
      tags: [Batch]
      operationId: batchRestore
      summary: 批量恢复（部分成功）
      description: >-
        批量从回收站恢复，逐项复用单文件 Restore 语义：原父目录已删除
        （PARENT_DELETED）/ 名称冲突（NAME_CONFLICT）/ 未删除（NOT_DELETED）
        记入 per-item 结果，不静默改名。Idempotency-Key 语义同 move。
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_ids]
              properties:
                file_ids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 1
                  maxItems: 100
      responses:
        '200':
          description: 逐项结果
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BatchResults' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Idempotency-Key 已被不同请求体使用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tags:
    get:
      tags: [Tags]
      operationId: listTags
      summary: 我的标签列表
      description: 当前用户的标签（用户维度，按名称排序）。
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Tags]
      operationId: createTag
      summary: 创建标签
      description: 名称 NFC 归一、非空、≤64 rune、拒绝控制字符；(user_id, name) 唯一。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, maxLength: 64 }
      responses:
        '201':
          description: 标签已创建
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tag' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tags/{id}:
    delete:
      tags: [Tags]
      operationId: deleteTag
      summary: 删除标签（解除全部关联）
      description: 仅创建者可删；file_tags 关联级联清理。他人的标签按 404 处理。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已删除 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /folders:
    post:
      tags: [Files]
      operationId: createFolder
      summary: 创建目录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parent_id:
                  { type: string, format: uuid, description: 父目录 ID；缺省为用户根目录 }
      responses:
        '201':
          description: 目录已创建
          headers:
            ETag: { schema: { type: string }, description: 基于 updated_at 的弱校验值 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}:
    get:
      tags: [Files]
      operationId: getFile
      summary: 文件/目录元数据（含当前版本）
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 元数据；文件无当前版本时 current_version 为 null
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileWithVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Files]
      operationId: renameFile
      summary: 重命名
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        '200':
          description: 重命名后的元数据
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }
    delete:
      tags: [Files]
      operationId: deleteFile
      summary: 软删除（移入回收站）
      description: 删除文件或目录（含子树）进入回收站；根目录不可删除（403）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已移入回收站 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/download:
    get:
      tags: [Files]
      operationId: downloadFile
      summary: 下载当前版本
      description: >-
        对象状态须为 available（否则 403）；成功时递增 download_count；
        Content-Disposition: attachment（文件名按 RFC 5987 编码）；支持单区间 Range。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          required: false
          schema: { type: string }
          description: '如 bytes=0-1023 或 bytes=-N（后缀区间）；多区间不支持（416）'
      responses:
        '200':
          description: 全量内容（实际 Content-Type 为对象 MIME 类型）
          headers:
            Content-Disposition:
              description: attachment; filename=...（RFC 5987）
              schema: { type: string }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 对象不可下载（非 available 状态）或无权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416':
          description: 'Range 无法满足；响应带 Content-Range: bytes */<size>'
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/preview:
    get:
      tags: [Files]
      operationId: previewFile
      summary: 内联预览
      description: >-
        MIME 白名单：image/*、application/pdf、application/json、text/plain；
        image/svg* 一律拒绝（防 XSS）；text/* 强制 charset=utf-8；
        Content-Disposition: inline 且带 X-Content-Type-Options: nosniff；
        成功递增 view_count；支持单区间 Range。
        网页包联动：application/zip（或 .zip 文件名）且 web_packages 存在
        ready 解包结果时，返回 200 JSON {kind:"webpkg",
        url:"/content/<public_id>/index.html"}（替代 415），前端以
        sandbox iframe 加载该 URL。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: >-
            内联内容（常规类型为二进制流）；zip 网页包为 WebpkgPreview JSON
          headers:
            Content-Disposition:
              description: inline; filename=...（RFC 5987）；webpkg JSON 分支无此头
              schema: { type: string }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: '#/components/schemas/WebpkgPreview' }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 对象不可预览（非 available 状态）或无权限
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415':
          description: preview not supported（MIME 不在白名单，或 zip 无 ready 网页包）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '416':
          description: Range 无法满足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/webpkg/extract:
    post:
      tags: [Files]
      operationId: extractWebpkg
      summary: 手动解包网页包（幂等重建）
      description: >-
        对文件当前版本（zip）执行安全解包；权限同「覆盖为新版本」：
        个人文件 owner、团队文件 CanWrite（editor 及以上）。重复执行幂等重建
        （先删旧解包对象再解包，public_id 保持稳定）。安全校验未通过时返回
        200 且 status=blocked（附原因）；存储级失败返回 500。上传完成时
        （WEBPKG_ENABLED，默认 true）亦会自动尝试解包，失败置 blocked，
        不影响文件本身可用性。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 解包结果（status=ready|blocked|failed|extracting）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebpkgPackage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 文件无当前版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500':
          description: 存储级解包失败（status=failed，原因见 200 语义或服务器日志）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /files/{id}/versions:
    get:
      tags: [Files]
      operationId: listFileVersions
      summary: 版本列表
      description: >-
        按版本号倒序列出文件全部版本（含关联对象 blob 的 status/size/sha256/mime）。
        读权限同文件元数据：个人文件 owner、团队文件任意在册成员。
        新版本不设独立写入端点，经上传链路（POST /uploads 或 tus 创建）携带 file_id 覆盖产生。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 版本列表（含当前版本）
          content:
            application/json:
              schema:
                type: object
                properties:
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/FileVersionDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/versions/{versionId}/restore:
    post:
      tags: [Files]
      operationId: restoreFileVersion
      summary: 回滚当前版本
      description: >-
        将 current_version 指向该文件的既有版本（版本内容不可变，仅移动指针）；
        仅允许指向该文件的版本，否则 409（code: NOT_FILE_VERSION）。
        权限：个人文件 owner、团队文件 CanWrite（editor 及以上）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: versionId
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 目标版本记录 ID（versions 列表中的 id）
      responses:
        '200':
          description: 回滚后的文件元数据（current_version 已指向目标版本）
          headers:
            ETag: { schema: { type: string }, description: 基于 updated_at 的弱校验值 }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FileWithVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 版本不属于该文件；code 为 NOT_FILE_VERSION
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/tags:
    get:
      tags: [Tags]
      operationId: listFileTags
      summary: 文件上的标签（当前用户的）
      description: 列出该文件上属于当前用户的标签；文件读权限（个人 owner、团队任意在册成员）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 标签列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TagList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    post:
      tags: [Tags]
      operationId: addFileTag
      summary: 给文件打标签
      description: >-
        把当前用户自己的标签打到文件上；文件读权限即可（标签为用户维度
        组织视图，不改动文件内容）。幂等：重复打同一标签仍 201。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tag_id]
              properties:
                tag_id: { type: string, format: uuid }
      responses:
        '201':
          description: 关联已建立（或已存在，幂等）
          content:
            application/json:
              schema:
                type: object
                properties:
                  tag_id: { type: string, format: uuid }
                  file_id: { type: string, format: uuid }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/tags/{tagId}:
    delete:
      tags: [Tags]
      operationId: removeFileTag
      summary: 解除文件标签（幂等）
      description: 解除当前用户自己的标签与文件的关联；未关联时同样 204。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: tagId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已解除（或本就未关联） }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/starred:
    patch:
      tags: [Tags]
      operationId: setFileStarred
      summary: 切换收藏
      description: >-
        设置 files.is_starred。取舍：星标为行级共享标记（团队文件全队
        共享，不引入 per-user 表），写权限放宽为读权限即可切换；不影响
        updated_at/ETag。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starred]
              properties:
                starred: { type: boolean }
      responses:
        '200':
          description: 更新后的文件元数据
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /files/{id}/restore:
    post:
      tags: [Trash]
      operationId: restoreFile
      summary: 从回收站恢复
      description: 恢复软删除文件；原父目录已删除或名称冲突时返回 409（带错误码），不静默改名。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 恢复后的元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 恢复冲突；code 为 PARENT_DELETED / NAME_CONFLICT / NOT_DELETED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /trash:
    get:
      tags: [Trash]
      operationId: listTrash
      summary: 回收站列表
      description: 列出当前用户软删除文件（含子树条目），按 deleted_at 倒序，limit 简单分页。
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 100, maximum: 1000 }
      responses:
        '200':
          description: 回收站内容
          content:
            application/json:
              schema:
                type: object
                properties:
                  files:
                    type: array
                    items: { $ref: '#/components/schemas/TrashFile' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /trash/{id}:
    delete:
      tags: [Trash]
      operationId: purgeFile
      summary: 彻底删除（硬删除）
      description: >-
        仅软删除文件可彻底删除；级联删除子树记录，物理对象引用计数归零后删除存储对象。
        根目录不可删除（403）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已彻底删除 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 目标不在回收站；code 为 NOT_DELETED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /uploads:
    post:
      tags: [Uploads]
      operationId: createUpload
      summary: 创建上传会话（自定义分片 API）
      description: >-
        与 tus 端点并存的自定义 API。注意：此处服务启动失败类错误（如超出大小上限）
        一律映射 400，而非 tus 端点的 413。
        携带 file_id 时为「覆盖为新版本」会话：目标须为 type=file 且当前用户有
        CanWrite 权限（个人 owner / 团队 editor+），name 与 parent_id 被忽略，
        沿用目标文件现有名称与父目录；Complete 成功后内容成为该文件的新版本，
        并按 MAX_VERSIONS_PER_FILE（默认 5）裁剪历史版本。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, size]
              properties:
                name: { type: string }
                size: { type: integer, format: int64, minimum: 0 }
                expected_sha256:
                  { type: string, description: 期望内容 SHA-256（64 位十六进制，大小写不敏感） }
                parent_id:
                  { type: string, format: uuid, description: 目标目录；缺省为用户根目录 }
                file_id:
                  { type: string, format: uuid, description: 覆盖目标文件 ID；指定时 name/parent_id 被忽略 }
      responses:
        '201':
          description: 会话已创建
          headers:
            Location:
              description: '/api/v1/uploads/{id}'
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 无 CanWrite 权限（团队 viewer/非成员）或版本覆盖能力未启用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: file_id 目标不存在（或个人文件非 owner，不泄露存在性）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /uploads/{id}:
    get:
      tags: [Uploads]
      operationId: getUpload
      summary: 查询上传会话
      description: 轮询上传状态（含后台自动完成后的终态）；响应为 UploadSession 的子集（不含 retry_count）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 会话状态
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [Uploads]
      operationId: patchUpload
      summary: 追加上传数据
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          description: 必须等于服务端当前 offset，否则 409
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        '200':
          description: 追加成功；响应头 Upload-Offset 为新偏移
          headers:
            Upload-Offset: { schema: { type: integer, format: int64 } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /uploads/{id}/complete:
    post:
      tags: [Uploads]
      operationId: completeUpload
      summary: 完成上传
      description: >-
        校验哈希 → 病毒扫描（如启用）→ 落库为文件版本。终态幂等：available 重复调用
        返回 200；quarantined / failed 返回 409（code 分别为 QUARANTINED / FAILED）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 完成后的会话（status=available）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: '扫描被隔离 / 校验失败 / 会话不可完成；code: QUARANTINED 或 FAILED'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tus/files:
    options:
      tags: [tus]
      operationId: tusOptions
      summary: tus 能力发现
      description: >-
        响应头：Tus-Resumable: 1.0.0、Tus-Version: 1.0.0、
        Tus-Extension: creation,expiration、Tus-Max-Size（配置了上限时返回）。
        不支持 concatenation / termination / checksum 扩展。
      security: []
      responses:
        '204':
          description: 能力宣告（无响应体）
          headers:
            Tus-Resumable: { schema: { type: string, const: '1.0.0' } }
            Tus-Version: { schema: { type: string, const: '1.0.0' } }
            Tus-Extension: { schema: { type: string, const: 'creation,expiration' } }
            Tus-Max-Size:
              description: 单次上传长度上限（字节）；未配置上限时不返回该头
              schema: { type: integer, format: int64 }
    post:
      tags: [tus]
      operationId: tusCreate
      summary: 创建 tus 上传（creation 扩展）
      description: >-
        Upload-Metadata 为逗号分隔的 "key base64value" 对（value 可整体省略）；
        filename 键必填；parent_id（UUID）与 sha256 可选，其余键原样保存并在 HEAD 回显。
        未指定 parent_id 时落入用户根目录。
        携带 file_id（UUID，base64 编码）时为「覆盖为新版本」会话：目标须为
        type=file 且当前用户有 CanWrite 权限，filename/parent_id 被忽略，
        沿用目标文件现有名称与父目录；写满自动完成后内容成为新版本并按
        MAX_VERSIONS_PER_FILE 裁剪历史。
      parameters:
        - name: Upload-Length
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          description: 上传总字节数；超过 Tus-Max-Size 时返回 413
        - name: Upload-Metadata
          in: header
          required: true
          schema: { type: string }
          description: >-
            逗号分隔的 "key base64value" 对；filename 必填（base64 编码），
            可选 parent_id、sha256（base64 编码的 64 位十六进制）、
            file_id（base64 编码的 UUID，覆盖为新版本）
        - name: Tus-Resumable
          in: header
          required: false
          schema: { type: string, const: '1.0.0' }
          description: 协议版本头；当前实现未强制校验请求头
      responses:
        '201':
          description: 上传已创建
          headers:
            Location:
              description: '/api/v1/tus/files/{id}'
              schema: { type: string }
            Upload-Offset: { schema: { type: integer, format: int64, const: 0 } }
            Upload-Expires:
              description: 会话过期时间（RFC 7231 日期格式）
              schema: { type: string }
            Tus-Resumable: { schema: { type: string, const: '1.0.0' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: file_id 目标不存在（或个人文件非 owner，不泄露存在性）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /tus/files/{id}:
    head:
      tags: [tus]
      operationId: tusHead
      summary: 查询上传偏移与元数据
      description: >-
        无响应体。响应头：Upload-Offset、Upload-Length、Upload-Metadata（创建时回显原始头）、
        Cache-Control: no-store、Tus-Resumable。终态会话仍可查询；
        uploading 且已过期返回 410；不存在或非本人资源一律 404（不泄露存在性）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 当前偏移与长度（无响应体）
          headers:
            Upload-Offset: { schema: { type: integer, format: int64 } }
            Upload-Length: { schema: { type: integer, format: int64 } }
            Upload-Metadata:
              description: 创建时的原始 Upload-Metadata 头（无则不返回）
              schema: { type: string }
            Cache-Control: { schema: { type: string, const: no-store } }
            Tus-Resumable: { schema: { type: string, const: '1.0.0' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }
    patch:
      tags: [tus]
      operationId: tusPatch
      summary: 追加数据块
      description: >-
        Content-Type 必须为 application/offset+octet-stream（否则 415）；
        Upload-Offset 请求头必须等于服务端当前偏移（否则 409）；
        请求体字节数不得超过剩余长度（否则 400）。
        偏移写满后服务端后台自动完成（verify → scan → available），
        可通过 GET /uploads/{id} 轮询状态；终态会话返回 410。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Upload-Offset
          in: header
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
          description: 当前服务端偏移
      requestBody:
        required: true
        content:
          application/offset+octet-stream:
            schema: { type: string, format: binary }
      responses:
        '204':
          description: 追加成功（无响应体）
          headers:
            Upload-Offset: { schema: { type: integer, format: int64 } }
            Upload-Expires: { schema: { type: string } }
            Tus-Resumable: { schema: { type: string, const: '1.0.0' } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '410': { $ref: '#/components/responses/Gone' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shares:
    post:
      tags: [Shares]
      operationId: createShare
      summary: 创建分享
      description: >-
        visibility=public（默认）：生成公开 token，明文 token 与 share_url 仅在本次
        响应返回一次（库中只存 SHA-256 哈希）；此时 user_ids / team_ids 必须为空。
        visibility=private：不生成 token，按 user_ids / team_ids 显式授权。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id]
              properties:
                file_id: { type: string, format: uuid }
                permission:
                  { type: string, enum: [view, download], default: view }
                visibility:
                  { type: string, enum: [public, private], default: public }
                user_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: 私有分享：显式授权的用户列表
                team_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: 私有分享：授权的团队列表（成员可访问）
                expires_in:
                  { type: integer, format: int64, description: 有效期（秒）；缺省或 0 表示永久 }
                max_downloads:
                  { type: integer, description: 最大下载次数；缺省表示不限 }
      responses:
        '201':
          description: >-
            分享已创建；公开分享额外返回 token 与 share_url
            （/api/v1/public/shares/{token}，仅此一次），私有分享不含两者
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedShare' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 文件不可分享（如软删除中）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Shares]
      operationId: listShares
      summary: 我的分享列表
      description: >-
        按创建时间倒序列出当前用户创建的分享（公开与私有）；
        每条附 file_name（文件已删除时为空串）与 visibility（public|private）。
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 100, maximum: 1000 }
      responses:
        '200':
          description: 分享列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shares/shared-with-me:
    get:
      tags: [Shares]
      operationId: listSharedWithMe
      summary: 与我共享的列表
      description: >-
        分享给当前用户的有效私有分享列表（share_users 显式授权，或当前用户属于
        share_teams 任一授权团队；成员关系实时判定）。公开分享、已撤销、已过期、
        达下载上限的分享，以及文件已删除/不可用的条目不返回；按 created_at 倒序。
        owner_username 为分享者用户名（不含 email，避免泄露）。
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 100, maximum: 1000 }
      responses:
        '200':
          description: 与我共享的分享列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SharedWithMeList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shares/{id}:
    delete:
      tags: [Shares]
      operationId: revokeShare
      summary: 撤销分享
      description: 幂等；仅分享创建者可撤销。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: 已撤销 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shares/{id}/files/{fid}:
    get:
      tags: [Shares]
      operationId: shareFileInfo
      summary: 私有分享文件元数据（登录用户）
      description: >-
        分享 owner 可直接访问；其他登录用户须被显式授权（user_ids）或属于授权团队
        （team_ids），否则 403。公开分享不以用户入口开放：非 owner 访问一律 404
        （公开分享按 token 解析，404 语义不泄露分享存在性）。仅暴露安全字段，
        不含 owner、内部 ID 与存储路径。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 分享 ID
        - name: fid
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 被分享的文件 ID
      responses:
        '200':
          description: 文件元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareFileMeta' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 当前用户未被授权访问该私有分享
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shares/{id}/files/{fid}/download:
    get:
      tags: [Shares]
      operationId: shareFileDownload
      summary: 私有分享下载（登录用户）
      description: >-
        需 download 权限；成功原子递增分享与文件 download_count（受 max_downloads 限制）；
        存储内容读取失败（500）时补偿回退已消耗的计数。支持单区间 Range 与
        Content-Disposition: attachment。授权语义同元数据端点（公开分享非 owner
        一律 404；私有分享未授权 403）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: fid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 全量内容
          headers:
            Content-Disposition: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '416':
          description: Range 无法满足
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /shares/{id}/files/{fid}/preview:
    get:
      tags: [Shares]
      operationId: shareFilePreview
      summary: 私有分享预览（登录用户）
      description: >-
        view 与 download 权限均可预览；不消耗分享 download_count；MIME 白名单同
        个人预览。授权语义同元数据端点（公开分享非 owner 一律 404；私有分享
        未授权 403）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: fid
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 内联内容
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '416':
          description: Range 无法满足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/shares/{token}:
    get:
      tags: [Public Shares]
      operationId: publicShareInfo
      summary: 公开分享元数据（无认证）
      description: >-
        按 token 匹配（库中只存哈希）；无认证、不设任何 Cookie，按 IP 独立限流。
        仅暴露安全字段。未启用则 404；过期/撤销/达下载上限 410。
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
          description: 创建公开分享时返回的一次性明文 token（URL-safe base64）
      responses:
        '200':
          description: 文件元数据
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShareFileMeta' }
        '403':
          description: 文件当前不可用（对象非 available 状态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/shares/{token}/download:
    get:
      tags: [Public Shares]
      operationId: publicShareDownload
      summary: 公开分享下载（无认证）
      description: >-
        校验分享有效性与对象可用性；成功原子递增分享与文件 download_count；
        存储内容读取失败（500）时补偿回退已消耗的计数；支持单区间 Range 与
        Content-Disposition: attachment。
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 全量内容
          headers:
            Content-Disposition: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403':
          description: 分享不允许下载或对象不可用
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '416':
          description: Range 无法满足
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /public/shares/{token}/preview:
    get:
      tags: [Public Shares]
      operationId: publicSharePreview
      summary: 公开分享预览（无认证）
      description: >-
        view 与 download 权限均可预览；不消耗分享 download_count；
        MIME 白名单与安全头同个人预览。网页包联动同个人预览：zip 且存在
        ready 解包结果时返回 200 JSON（WebpkgPreview）。
      security: []
      parameters:
        - name: token
          in: path
          required: true
          schema: { type: string }
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 内联内容；zip 网页包为 WebpkgPreview JSON
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Content-Type-Options: { schema: { type: string, const: nosniff } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
            application/json:
              schema: { $ref: '#/components/schemas/WebpkgPreview' }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403':
          description: 对象不可用或分享不允许访问
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '410': { $ref: '#/components/responses/Gone' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '416':
          description: Range 无法满足
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /teams:
    post:
      tags: [Teams]
      operationId: createTeam
      summary: 创建团队
      description: 创建者自动成为 owner 成员，并在同一事务内生成团队根目录；团队名全局唯一。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  { type: string, maxLength: 100, description: 非空、无控制字符 }
                description: { type: string }
      responses:
        '201':
          description: 团队已创建（含 root_folder_id）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedTeam' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: 团队名已存在
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Teams]
      operationId: listTeams
      summary: 我的团队列表
      description: 当前用户所属（成员或 owner）的团队。
      responses:
        '200':
          description: 团队列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /teams/{id}/members:
    post:
      tags: [Teams]
      operationId: addTeamMember
      summary: 添加成员（仅团队 owner）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
                role:
                  { type: string, enum: [owner, editor, viewer], default: viewer }
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201':
          description: 成员已添加
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMember' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 用户已是成员
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Teams]
      operationId: listTeamMembers
      summary: 成员列表（须为团队成员）
      description: 仅团队成员（含 owner）可见；非成员 404（不泄露团队存在性）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: 成员列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamMemberList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /teams/{id}/members/{uid}:
    delete:
      tags: [Teams]
      operationId: removeTeamMember
      summary: 移除成员（仅团队 owner）
      description: owner 对应的成员不可移除（403）。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: uid
          in: path
          required: true
          schema: { type: string, format: uuid }
          description: 被移除成员的用户 ID
      responses:
        '204': { description: 成员已移除 }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /teams/{id}/files:
    get:
      tags: [Teams]
      operationId: listTeamFiles
      summary: 团队空间文件列表
      description: >-
        列出团队根目录（缺省）或 parent_id 指定团队目录的直接子项；
        成员可读；非成员 404（不泄露团队存在性）。
        tag_id/starred 过滤（目录范围内）与 sort/order 排序可选，语义同个人 /files。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: parent_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 团队目录 ID；缺省为团队根目录
        - name: tag_id
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: 标签过滤（须为当前用户的标签，否则 404）
        - name: starred
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"] }
          description: 收藏过滤
        - name: sort
          in: query
          required: false
          schema: { type: string, enum: [name, updated_at, size], default: name }
        - name: order
          in: query
          required: false
          schema: { type: string, enum: [asc, desc], default: asc }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 100, maximum: 1000 }
      responses:
        '200':
          description: 目录内容（含所属父目录 ID）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamFileList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /teams/{id}/folders:
    post:
      tags: [Teams]
      operationId: createTeamFolder
      summary: 创建团队目录（editor 及以上角色）
      description: 在团队根目录（缺省）或指定团队目录下创建目录；viewer 返回 403。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                parent_id:
                  { type: string, format: uuid, description: 团队目录 ID；缺省为团队根目录 }
      responses:
        '201':
          description: 目录已创建
          headers:
            ETag: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/File' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /onlyoffice/config:
    get:
      tags: [onlyoffice]
      operationId: getOnlyOfficeConfig
      summary: 集成可用性探测（前端据此显示「编辑」入口）
      description: >-
        返回 ONLYOFFICE 集成状态与浏览器可达的 DocumentServer 地址（前端加载
        `{server_url}/web-apps/apps/api/documents/api.js`）：server_url 优先取
        ONLYOFFICE_PUBLIC_URL（如经反向代理暴露的
        https://example.com/onlyoffice，本地直连可为 http://localhost:8081），
        未设置时回退 ONLYOFFICE_SERVER_URL（注意：该值为服务间内网地址时，
        浏览器可能无法解析加载）。该端点恒注册：ONLYOFFICE_ENABLED=false 时
        返回 `{enabled:false, server_url:null}`（不暴露内部 URL），其余
        onlyoffice 端点此时不注册（404）。
      responses:
        '200':
          description: 集成状态
          content:
            application/json:
              schema:
                type: object
                required: [enabled, server_url]
                properties:
                  enabled: { type: boolean }
                  server_url:
                    type: [string, 'null']
                    description: 浏览器可达的 DocumentServer 地址
                      （ONLYOFFICE_PUBLIC_URL 优先，回退 ONLYOFFICE_SERVER_URL）；
                      禁用时为 null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /onlyoffice/session:
    post:
      tags: [onlyoffice]
      operationId: createOnlyOfficeSession
      summary: 生成编辑器配置（DocsAPI.DocEditor 可直接使用）
      description: >-
        校验读权限（authorizeFileAccess 同规则：个人文件 owner、团队文件任意
        在册成员）且当前版本 blob 为 available。editorConfig.mode 按写权限判定：
        可写（个人 owner / 团队 CanWrite，与「覆盖为新版本」目标校验同语义）时
        为 edit 且 document.permissions.edit=true；只读用户为 view 且
        permissions.edit=false（服务端未接线写授权器时保守降级 view）。
        document.key 绑定 `file_id:version_id`（编辑会话与版本绑定）；
        document.url 为 5 分钟有效期的签名下载 URL
        （ONLYOFFICE_DOWNLOAD_URL_BASE 前缀）；token 为对 document+
        editorConfig 整体签名的 JWT（HS256，ONLYOFFICE_JWT_SECRET，TTL 5 分钟，
        aud=onlyoffice-config，回调端点拒绝该用途 token）。集成未启用
        （ONLYOFFICE_ENABLED=false）时路由不注册（404）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_id]
              properties:
                file_id: { type: string, format: uuid }
      responses:
        '200':
          description: >-
            DocsAPI.DocEditor 配置（documentType/document/editorConfig/token；
            editorConfig 含 mode（edit|view，按写权限判定）、user.id/name、
            lang=zh 与 callbackUrl；document.permissions.edit 与 mode 一致）
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: 无权限或当前版本不可用（非 available 状态）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: 文件无当前版本
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /onlyoffice/download/{fileId}:
    get:
      tags: [onlyoffice]
      operationId: onlyofficeDownload
      summary: DocumentServer 回源下载（签名 token，无 Bearer）
      description: >-
        供 DocumentServer 拉取文档内容（无用户会话）。token 为 HS256 JWT：
        sub=file_id、v=版本 ID、aud=onlyoffice-download、exp 5 分钟，且须与
        路径 fileId、查询 v 一致；校验通过后流式返回该版本内容（单区间 Range 与
        Content-Disposition: attachment 同个人下载，不计入 download_count）。
        被隔离/不可用 blob 一律拒绝（403）。独立按 IP 轻限流
        （ONLYOFFICE_RATE_LIMIT_PER_MIN）。
      security: []
      parameters:
        - name: fileId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: token
          in: query
          required: true
          schema: { type: string }
          description: 签名下载 token（session 接口的 document.url 内嵌）
        - name: v
          in: query
          required: true
          schema: { type: string, format: uuid }
          description: 版本记录 ID（与 token 的 v 声明一致）
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: 全量内容
          headers:
            Content-Disposition: { schema: { type: string } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '206':
          description: 区间内容
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: token 缺失、签名不符、过期、用途（aud）不符或参数绑定失败
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: blob 非 available 状态（隔离/不可用）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '416':
          description: Range 无法满足
          headers:
            Content-Range: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /onlyoffice/callback:
    post:
      tags: [onlyoffice]
      operationId: onlyofficeCallback
      summary: 保存回调（DocumentServer → DocFlow，无 Bearer）
      description: >-
        DocumentServer command service 回调。JWT 校验取 body.token 或
        Authorization: Bearer 头（HS256，ONLYOFFICE_JWT_SECRET）。token 用途
        隔离：aud 为 onlyoffice-config 或 onlyoffice-download 的 token 一律
        拒绝（编辑配置/下载 token 不得混用为回调 token；DS 自签回调 token
        通常无 aud，允许通过）。status/key/url 以验签后的 claims 为唯一信任
        源：claims 缺失必需声明（status、key，保存类状态另需 url）即拒绝，
        不回退未签名 body。status=2/6：先做写鉴权（claims users[0] 为 actor，
        按「覆盖为新版本」目标校验同语义判定写权限；未接线授权器时 fail
        closed 拒绝），通过后以幂等键 (file_id, document.key, url) 抢占
        （重复回调不重复建版本），仅接受与 ONLYOFFICE_SERVER_URL 同源的下载
        URL（scheme/host/port 全等，防 SSRF），下载后作为新版本保存（临时
        key 转正、SHA-256 校验、复用内容去重）。
        status=4 仅清理（写 onlyoffice.cleanup 审计）；其他状态空处理。
        始终返回 HTTP 200：成功 {"error":0}，失败 {"error":1}（协议约定，
        非 200 会触发 DocumentServer 重试）。独立按 IP 轻限流。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                key: { type: string, description: document.key（file_id:version_id） }
                status: { type: integer, description: '1=编辑中 2=保存 3=错误 4=关闭 6=强制保存 7=强制保存错误' }
                url: { type: string, description: 新版本下载 URL（仅 status=2/6 使用） }
                users: { type: array, items: { type: string } }
                token: { type: string, description: 回调体整体签名的 JWT }
      responses:
        '200':
          description: '处理结果（协议体）：成功 error=0，失败 error=1'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: integer, enum: [0, 1] }
        '429': { $ref: '#/components/responses/RateLimited' }

  /drawio/config:
    get:
      tags: [drawio]
      operationId: getDrawioConfig
      summary: 图表编辑集成可用性探测（前端据此显示「图表」入口）
      description: >-
        返回 draw.io 集成状态与浏览器可达的编辑器地址（前端以 iframe embed
        模式加载 `{url}?embed=1&proto=json&spin=1`）：url 优先取
        DRAWIO_PUBLIC_URL（如经反向代理暴露的 https://example.com/drawio，
        本地直连可为 http://localhost:8082），未设置时回退 DRAWIO_SERVER_URL
        （注意：该值为服务间内网地址时，浏览器可能无法加载）。该端点恒注册：
        DRAWIO_ENABLED=false 时返回 `{enabled:false, url:null}`（不暴露内部
        URL）。编辑与保存均在浏览器侧完成（postMessage JSON 协议：
        receive init → send load{xml}；receive save{xml} → 前端经 POST
        /uploads 携带 file_id 把导出 XML 覆盖为新版本），后端无其他
        drawio 端点；新建空图表文件亦直接走普通上传（初始模板
        <mxfile><diagram/></mxfile>）。
      responses:
        '200':
          description: 集成状态
          content:
            application/json:
              schema:
                type: object
                required: [enabled, url]
                properties:
                  enabled: { type: boolean }
                  url:
                    type: [string, 'null']
                    description: 浏览器可达的 draw.io 编辑器地址
                      （DRAWIO_PUBLIC_URL 优先，回退 DRAWIO_SERVER_URL）；
                      禁用时为 null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/settings:
    get:
      tags: [Admin]
      operationId: listAdminSettings
      summary: 列出全部系统设置（仅 admin）
      description: >-
        返回全部内置键的当前值（未设置时为默认值）、类型、描述与默认值。
        仅非密钥类运行时配置；密钥类（JWT/S3/SMTP 凭据等）一律走环境变量，
        不经 system_settings 暴露。
      responses:
        '200':
          description: 设置列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  settings:
                    type: array
                    items: { $ref: '#/components/schemas/Setting' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/settings/{key}:
    put:
      tags: [Admin]
      operationId: updateAdminSetting
      summary: 更新单个系统设置（仅 admin）
      description: >-
        按键的类型与范围校验后写入（value_type 为 bool/int/string，int 键有
        min/max 范围）；未知键 404、类型或范围不符 400。成功写 settings.update
        审计（含操作者与新值）。
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            enum:
              [upload.max_versions_per_file, upload.max_file_size,
               share.default_expiry_hours, retention.trash_days]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [value]
              properties:
                value:
                  description: 与键定义类型一致的标量值（bool / int / string）
                  oneOf:
                    - type: boolean
                    - type: integer
                    - type: string
      responses:
        '200':
          description: 已更新；返回归一化后的值
          content:
            application/json:
              schema:
                type: object
                properties:
                  key: { type: string }
                  value: {}
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/stats:
    get:
      tags: [Admin]
      operationId: adminStats
      summary: 基础统计（仅 admin）
      description: 各核心表的行数计数（users / files / upload_sessions / sessions / shares）。
      responses:
        '200':
          description: 统计计数
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminStats' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/invitations:
    post:
      tags: [Admin]
      operationId: createInvitation
      summary: 创建邀请（仅 admin）
      description: >-
        为邮箱创建邀请（7 天有效，邮箱小写归一并做格式校验，role 限
        user|admin），生成一次性注册 token（32 字节随机数 URL-safe base64，
        数据库仅存 SHA-256 哈希）。新建返回 201 与一次性 accept_url
        （前端路由 /register/{token}，明文仅本次响应可见）并 best-effort
        发送邀请邮件。幂等：该邮箱已有未过期未接受的邀请时返回 200 与既有
        记录（不新发 token，无 accept_url）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, description: 被邀请人邮箱（服务端小写归一） }
                role:
                  type: string
                  enum: [user, admin]
                  default: user
                  description: 新用户角色
      responses:
        '201':
          description: 已创建；accept_url 一次性返回
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedInvitation' }
        '200':
          description: 幂等命中既有未过期未接受邀请（无新 accept_url）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invitation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Admin]
      operationId: listInvitations
      summary: 邀请列表（仅 admin）
      description: 按 created_at 倒序返回邀请，每条附派生状态 pending/accepted/expired；limit 参数默认 100、上限 1000。
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, default: 100 }
      responses:
        '200':
          description: 邀请列表
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /admin/invitations/{id}:
    delete:
      tags: [Admin]
      operationId: revokeInvitation
      summary: 撤销邀请（仅 admin）
      description: 删除邀请行，token 立即不可解析（注册返回 404）；已接受的邀请撤销无实际效果。不存在 404。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204':
          description: 已撤销
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/RateLimited' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        Authorization: Bearer <token>，两类凭证等价可用：
        ① HS256 JWT（subject 为用户 UUID，过期时间以服务配置为准）；
        ② PAT 个人访问令牌：dfpat_ + 43 字符 URL-safe base64（经
        POST /tokens 创建，撤销/过期即失效；无 refresh 语义）。

  responses:
    BadRequest:
      description: 请求参数或请求体非法
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: 缺失或无效的访问令牌
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: 无权限执行该操作（含只读目录、根目录保护、对象不可用等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: 资源不存在或不属于当前用户（不泄露存在性）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: 状态冲突（名称冲突、偏移不匹配、文件无当前版本等）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Gone:
      description: 资源已失效（分享过期/撤销/达下载上限、上传会话过期或终态）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PayloadTooLarge:
      description: 上传长度超过 Tus-Max-Size 上限
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    UnsupportedMediaType:
      description: Content-Type 不被接受，或预览 MIME 不在白名单（preview not supported）
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: 触发限流；响应头 Retry-After 为当前窗口剩余秒数
      headers:
        Retry-After:
          description: 建议等待秒数
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: 人类可读错误信息
        code:
          type: string
          description: >-
            机器可读错误码；当前实现使用 NAME_CONFLICT / NOT_DELETED / PARENT_DELETED /
            QUARANTINED / FAILED
        status:
          type: string
          description: 上传相关错误附带的会话状态（仅 uploads complete 端点）
    Setting:
      type: object
      description: 系统设置条目（GET /admin/settings）；value 为按类型解析后的标量
      properties:
        key:
          type: string
          enum:
            [upload.max_versions_per_file, upload.max_file_size,
             share.default_expiry_hours, retention.trash_days]
        value: { description: 当前生效值（未设置时为默认值） }
        type: { type: string, enum: [bool, int, string] }
        description: { type: string }
        default: { description: 内置默认值 }
        updated_at: { type: string, format: date-time }
        updated_by:
          type: [string, 'null']
          format: uuid
          description: 最近更新者；从未设置过时缺省
    AdminStats:
      type: object
      description: 基础统计（GET /admin/stats），各核心表行数
      properties:
        users: { type: integer, format: int64 }
        files: { type: integer, format: int64 }
        uploads: { type: integer, format: int64, description: upload_sessions 行数 }
        sessions: { type: integer, format: int64 }
        shares: { type: integer, format: int64 }
    Invitation:
      type: object
      description: 邀请记录（invitations 表）；明文 token 不落库也不回传，仅创建时一次性返回 accept_url
      properties:
        id: { type: string, format: uuid }
        email: { type: string, description: 已小写归一 }
        invited_by:
          type: [string, 'null']
          format: uuid
          description: 邀请人（admin）用户 ID
        role: { type: string, enum: [user, admin] }
        status:
          type: string
          enum: [pending, accepted, expired]
          description: 派生状态（accepted_at/expires_at 计算，不落库）
        expires_at: { type: string, format: date-time }
        accepted_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time }
    CreatedInvitation:
      allOf:
        - $ref: '#/components/schemas/Invitation'
        - type: object
          properties:
            accept_url:
              type: string
              description: 一次性注册链接（前端路由 /register/{token}；仅创建响应返回，之后不可再取）
    InvitationList:
      type: object
      properties:
        invitations:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }
    RegisterRequest:
      type: object
      required: [token, username, password]
      properties:
        token:
          type: string
          description: 一次性邀请 token（邀请邮件/accept_url 中的明文）
        username:
          type: string
          description: 3-32 字符，仅限字母、数字、'_' 与 '-'
        password:
          type: string
          format: password
          description: 至少 12 字符，须含大写、小写与数字
    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: 一次性重置令牌（重置邮件 /reset/{token} 链接中的明文，30 分钟有效）
        password:
          type: string
          format: password
          description: 至少 12 字符，须含大写、小写与数字
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string, format: password }
        new_password:
          type: string
          format: password
          description: 至少 12 字符，须含大写、小写与数字
    TokenPair:
      type: object
      required: [access_token, token_type]
      properties:
        access_token: { type: string, description: JWT 访问令牌 }
        token_type: { type: string, const: Bearer }
    WebpkgPreview:
      type: object
      description: >-
        网页包预览指引（/files/{id}/preview 与 /public/shares/{token}/preview
        对 zip+ready 包的 200 JSON 响应）；前端以 sandbox="allow-scripts" 的
        iframe 加载 url（无 allow-same-origin，内容端点带严格 CSP/nosniff）。
      required: [kind, url]
      properties:
        kind: { type: string, const: webpkg }
        url:
          type: string
          description: '内容入口 /content/<public_id>/index.html（public_id 为 43 字符随机串）'
    WebpkgPackage:
      type: object
      description: >-
        web_packages 行的对外视图（POST /files/{id}/webpkg/extract 响应）；
        public_id 仅在 ready 时返回，blocked/failed 附 error 原因。
      properties:
        file_id: { type: string, format: uuid }
        status:
          type: string
          enum: [extracting, ready, failed, blocked]
          description: ready 可预览；blocked 为安全校验未通过；failed 为存储级失败
        public_id:
          type: string
          description: 43 字符 URL-safe 随机串（仅 ready 时返回；幂等重建保持稳定）
        entry_count: { type: integer, description: 解包文件条目数（目录条目不计） }
        total_size: { type: integer, format: int64, description: 展开总字节数 }
        error:
          type: string
          description: blocked/failed 时的原因（ready 时缺省）
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    File:
      type: object
      description: >-
        文件/目录元数据；响应不含 owner_id、team_id 等内部字段。
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        parent_id:
          type: [string, 'null']
          format: uuid
          description: 父目录 ID；根目录为 null
        type: { type: string, enum: [file, folder] }
        is_root: { type: boolean }
        description: { type: string }
        is_public:
          { type: boolean, description: 是否存在有效公开分享（冗余辅助字段） }
        is_starred:
          { type: boolean, description: 收藏标记（行级共享；团队文件全队共享星标） }
        view_count: { type: integer, format: int64 }
        download_count: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    TrashFile:
      allOf:
        - $ref: '#/components/schemas/File'
        - type: object
          properties:
            deleted_at:
              type: [string, 'null']
              format: date-time
    FileWithVersion:
      allOf:
        - $ref: '#/components/schemas/File'
        - type: object
          properties:
            current_version:
              oneOf:
                - $ref: '#/components/schemas/FileVersion'
                - type: 'null'
              description: 当前版本摘要；文件无任何版本时为 null
    FileVersion:
      type: object
      description: GET /files/{id} 返回的当前版本视图（对象 blob 摘要）
      properties:
        id: { type: string, format: uuid, description: 版本记录 ID }
        version: { type: integer, description: 版本号（从 1 递增） }
        size: { type: integer, format: int64, description: 内容字节数 }
        sha256: { type: string, description: 内容 SHA-256（十六进制小写） }
        mime_type: { type: string, description: 检测出的 MIME 类型 }
        status:
          type: string
          enum: [created, scanning, available, quarantined, failed, deleting]
          description: 对象状态；仅 available 可下载
    FileList:
      type: object
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/File' }
    Tag:
      type: object
      description: 用户维度标签（tags 表）；(user_id, name) 唯一
      properties:
        id: { type: string, format: uuid }
        name: { type: string, maxLength: 64 }
        created_at: { type: string, format: date-time }
    TagList:
      type: object
      properties:
        tags:
          type: array
          items: { $ref: '#/components/schemas/Tag' }
    BatchResultItem:
      type: object
      description: 批量操作单项结果；ok=false 时附机器可读错误码
      properties:
        id: { type: string, format: uuid }
        ok: { type: boolean }
        error_code:
          type: string
          description: >-
            NOT_FOUND / FORBIDDEN / ROOT / NAME_CONFLICT / INVALID_TARGET /
            PARENT_DELETED / NOT_DELETED / INTERNAL
    BatchResults:
      type: object
      properties:
        results:
          type: array
          items: { $ref: '#/components/schemas/BatchResultItem' }
    TeamFileList:
      type: object
      properties:
        files:
          type: array
          items: { $ref: '#/components/schemas/File' }
        parent_id:
          { type: string, format: uuid, description: 当前列出的目录 ID }
    UploadSession:
      type: object
      description: >-
        上传会话；POST /uploads、PATCH /uploads/{id}、POST /uploads/{id}/complete
        返回全量字段，GET /uploads/{id} 省略 retry_count。响应不含
        user_id、expected_sha256、metadata、storage_key（敏感/内部字段）。
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid }
        name: { type: string }
        size: { type: integer, format: int64, description: 声明的总字节数 }
        offset: { type: integer, format: int64, description: 已接收字节数 }
        status:
          type: string
          enum: [uploading, verifying, scanning, available, quarantined, failed]
        file_id:
          type: [string, 'null']
          format: uuid
          description: >-
            覆盖为新版本会话的目标文件 ID（仅 file_id 创建的会话返回，含 Complete
            完成后的响应）；常规上传会话缺省该字段
        expires_at: { type: string, format: date-time }
        retry_count:
          { type: integer, description: '处理重试次数（GET /uploads/{id} 不返回）' }
        created_at: { type: string, format: date-time }
        completed_at:
          type: [string, 'null']
          format: date-time
          description: 完成时间；未完成为 null 或缺省
    FileVersionDetail:
      type: object
      description: GET /files/{id}/versions 的版本条目（版本不可变，status 为关联 blob 实时状态）
      properties:
        id: { type: string, format: uuid, description: 版本记录 ID }
        version: { type: integer, description: 版本号（从 1 递增，列表按其倒序） }
        size: { type: integer, format: int64, description: 内容字节数 }
        sha256: { type: string, description: 内容 SHA-256（十六进制小写） }
        mime_type: { type: string, description: 对象 MIME 类型 }
        status:
          type: string
          enum: [created, scanning, available, quarantined, failed, deleting]
          description: 关联对象状态；deleting 表示已被版本裁剪解除引用、待后台回收
        comment:
          type: [string, 'null']
          description: 版本备注（预留，当前恒为 null）
        user_id: { type: string, format: uuid, description: 创建该版本的用户 }
        created_at: { type: string, format: date-time }
    Share:
      type: object
      description: >-
        分享记录；列表与私有分享响应不含明文 token（明文仅公开分享创建时返回一次）。
        列表响应额外附 file_name 与 visibility。
      properties:
        id: { type: string, format: uuid }
        file_id: { type: string, format: uuid }
        visibility:
          type: string
          enum: [public, private]
          description: 分享可见性；仅 GET /shares 列表响应返回
        permission: { type: string, enum: [view, download] }
        expires_at:
          type: [string, 'null']
          format: date-time
          description: 过期时间；null 表示永久
        max_downloads:
          type: [integer, 'null']
          description: 最大下载次数；null 表示不限
        download_count: { type: integer }
        revoked_at:
          type: [string, 'null']
          format: date-time
          description: 撤销时间；null 表示未撤销
        created_at: { type: string, format: date-time }
        file_name:
          type: string
          description: 关联文件名（JOIN files）；仅 GET /shares 列表响应返回，文件已删除时为空串
    CreatedShare:
      allOf:
        - $ref: '#/components/schemas/Share'
        - type: object
          properties:
            token:
              type: [string, 'null']
              description: >-
                公开分享的一次性明文 token（URL-safe base64，仅创建响应返回）；
                私有分享为 null/缺省
            share_url:
              type: [string, 'null']
              description: '公开分享访问路径 /api/v1/public/shares/{token}；私有分享为 null/缺省'
    ShareList:
      type: object
      properties:
        shares:
          type: array
          items: { $ref: '#/components/schemas/Share' }
    SharedWithMeItem:
      type: object
      description: 「与我共享」条目：有效私有分享 + 文件元数据 + 分享者用户名（不含 email）
      properties:
        id: { type: string, format: uuid, description: 分享 ID }
        file_id: { type: string, format: uuid }
        name: { type: string, description: 文件名 }
        size:
          { type: integer, format: int64, description: 当前版本字节数；版本缺失时为 0 }
        mime_type: { type: string, description: 当前版本 MIME 类型 }
        permission: { type: string, enum: [view, download] }
        owner_username: { type: string, description: 分享者用户名（不泄露 email） }
        expires_at:
          type: [string, 'null']
          format: date-time
        created_at: { type: string, format: date-time, description: 分享创建时间 }
    SharedWithMeList:
      type: object
      properties:
        shares:
          type: array
          items: { $ref: '#/components/schemas/SharedWithMeItem' }
    ShareFileMeta:
      type: object
      description: 分享访问入口（私有与公开）暴露的安全元数据子集
      properties:
        name: { type: string }
        size: { type: integer, format: int64 }
        mime_type: { type: string }
        version: { type: integer }
        version_status:
          type: string
          enum: [created, scanning, available, quarantined, failed, deleting]
        permission: { type: string, enum: [view, download] }
        expires_at:
          type: [string, 'null']
          format: date-time
        max_downloads:
          type: [integer, 'null']
        download_count: { type: integer }
    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        owner_id: { type: string, format: uuid, description: 团队 owner 用户 ID }
        created_at: { type: string, format: date-time }
    CreatedTeam:
      allOf:
        - $ref: '#/components/schemas/Team'
        - type: object
          properties:
            root_folder_id:
              { type: string, format: uuid, description: 事务内创建的团队根目录 ID }
    TeamList:
      type: object
      properties:
        teams:
          type: array
          items: { $ref: '#/components/schemas/Team' }
    TeamMember:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        role: { type: string, enum: [owner, editor, viewer] }
        created_at: { type: string, format: date-time }
    TeamMemberList:
      type: object
      properties:
        members:
          type: array
          items: { $ref: '#/components/schemas/TeamMember' }
    Notification:
      type: object
      description: >-
        站内通知（notifications 表，user 维度）；type 为事件类型，
        resource_id 指向关联资源（通常为文件 ID，可空）。已读通知超过
        90 天由 janitor 清理。
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [upload.completed, upload.quarantined, share.accessed, file.updated]
        title: { type: string, description: 通知标题（含关联文件名） }
        body: { type: string, description: 通知正文说明 }
        resource_id:
          type: [string, 'null']
          format: uuid
          description: 关联资源 ID（文件 ID 等）；无关联时为 null
        is_read: { type: boolean }
        created_at: { type: string, format: date-time }
        read_at:
          type: [string, 'null']
          format: date-time
          description: 已读时间；未读为 null
    NotificationList:
      type: object
      required: [items, next_cursor, unread_count]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Notification' }
        next_cursor:
          type: string
          description: >-
            下一页游标（本页最后一条的 created_at，RFC3339Nano）；无更多页时为空串
        unread_count: { type: integer, description: 当前用户未读总数（铃铛徽标） }
    NotificationPreference:
      type: object
      description: 通知偏好条目：事件类型的生效开关（无记录 = 默认开启）
      properties:
        event_type:
          type: string
          enum: [upload.completed, upload.quarantined, share.accessed, file.updated]
        enabled: { type: boolean }
    NotificationPreferenceList:
      type: object
      properties:
        preferences:
          type: array
          items: { $ref: '#/components/schemas/NotificationPreference' }
